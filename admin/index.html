<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MYSBIZON 고객 데이터</title><link rel="stylesheet" href="/admin.css"><script src="/admin.js" defer></script></head><body>
<header><div><small>MYSBIZON · 관리자 전용</small><h1>고객 데이터</h1></div><button id="logout" hidden>잠그기</button></header>
<section id="login"><h2>보안 연결로 접속했어요</h2><p>관리자 키는 이 탭의 메모리에만 보관하며, 15분 후 자동 잠금됩니다.</p><form id="login-form"><label>관리자 키<input id="key" type="password" autocomplete="off" required></label><button>관리자 화면 열기</button></form></section>
<main id="workspace" hidden><div class="toolbar"><button id="surveys" aria-pressed="true">설문·이메일</button><button id="clicks" aria-pressed="false">버튼 클릭 통계</button><button id="refresh">새로고침</button></div>
<section><div class="toolbar"><label>현재 페이지 검색<input id="search" type="search" placeholder="지역, 업종 등"></label><label class="check"><input id="reveal" type="checkbox">이메일 전체 표시·내보내기</label><button id="export">현재 페이지 CSV</button></div><p id="description">제출일·이메일·설문 답을 확인해요. CSV는 엑셀에서 열 수 있어요.</p><div class="table-wrap"><table id="table"></table></div><button id="more" hidden>다음 100건</button></section></main><p id="status" role="status" aria-live="polite"></p></body></html>
