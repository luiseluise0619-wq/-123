name: 대시보드 자동 갱신

# 상권 데이터(매출·점포·임대료)는 분기별, 폐업·생존율은 연간 갱신이라
# 매주 1회면 충분(매일은 API 콜 낭비). 매주 월요일 06:10 KST(=21:10 UTC 일).
on:
  schedule:
    - cron: "10 21 * * 0"        # 매주 월요일 06:10 KST — 가벼운 주간 갱신(heavy 미포함)
  workflow_dispatch:             # 수동 실행 버튼
    inputs:
      heavy:
        description: "상권 전량 빌드까지 실행(분기 1회만 ON). 평소엔 OFF로 빠르게."
        type: boolean
        default: false

permissions:
  contents: write                # 갱신된 HTML 커밋용

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 전체 히스토리 — 커밋 스텝의 rebase(master 경합 대응)에 필요

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install pandas numpy scikit-learn lightgbm requests pyproj pyarrow   # pyarrow: 상권 원천 parquet 캐시용

      - name: 대시보드 재생성
        working-directory: backend
        continue-on-error: true       # 식자재 CSV(gitignore)가 없으면 실패하지만 지도 수집은 계속돼야 함
        env:
          # 있으면 aT 실시간가로 최신값 갱신(없으면 CSV 기준). Actions Secrets 에 등록.
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python refresh_dashboard.py

      - name: 유동인구(생활인구) 수집 → 자치구 집계
        working-directory: backend
        continue-on-error: true       # 키 없거나 API 장애 시 지도는 기존 데이터로 동작
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_livepop.py

      - name: 주차장(입지 접근성) 수집 → 자치구 집계
        working-directory: backend
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect_parking.py

      - name: 추정매출(업종별 시간대·요일·연령) 수집
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_sales.py

      - name: 점포·개폐업(업종별 폐업률·프랜차이즈) 수집
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_stores.py

      - name: 상주인구(거주민 배후수요) 수집
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_repop.py

      - name: 직장인구(출근 수요) 수집
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_workpop.py

      - name: 소득소비(평균소득·지출 구성) 수집
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_income.py

      - name: 소상공인 상가정보(자치구별 실측 점포수) 수집
        working-directory: backend
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect_storeinfo.py

      - name: 지하철 승하차(자치구별 접근성) 수집
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_subway.py

      - name: 역·자치구 데이터 1차 커밋(무거운 상권 빌드와 분리)
        continue-on-error: true       # 1차 커밋 실패해도 이후 스텝·최종 커밋은 계속
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # 지하철 수집(14번)까지의 산출물만 먼저 커밋 — 상권 전량 빌드(15번)에
          # 묶이지 않게 역·자치구 데이터를 master 에 즉시 반영한다.
          for f in frontend/subway_stations.json frontend/subway_gu.json frontend/storeinfo_gu.json frontend/livepop_gu.json frontend/livepop_dong.json frontend/parking_gu.json frontend/repop.json frontend/workpop.json frontend/income.json frontend/sales_by_industry.json frontend/stores_by_industry.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if git diff --cached --quiet; then
            echo "1차 커밋: 변경 없음 — 생략"
          else
            git commit -m "chore: 역·자치구 데이터 1차 갱신 ($(date -u +%Y-%m-%d))"
            # master 가 런 도중 앞서갈 수 있으므로 rebase 후 push 재시도(non-ff 거부 방지)
            ok=0
            for i in 1 2 3 4 5; do
              git fetch origin master || true
              git rebase origin/master || { git rebase --abort || true; }
              if git push origin HEAD:master; then ok=1; break; fi
              echo "1차 커밋 push 재시도 $i"; sleep $((i*3))
            done
            [ "$ok" = 1 ] || echo "1차 커밋 push 실패(경합 지속) — 최종 커밋에서 재시도됨"
          fi

      - name: 상권 캐시 키(분기 단위)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.heavy }}
        id: trdarkey
        run: echo "k=trdar-$(date -u +%Y)-q$(( ($(date -u +%-m)-1)/3+1 ))" >> "$GITHUB_OUTPUT"

      - name: 상권 원천 parquet 캐시(같은 분기 재실행 시 1.6M행 재수집 생략)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.heavy }}
        uses: actions/cache@v4
        with:
          path: backend/app/data/real_data/_cache
          key: ${{ steps.trdarkey.outputs.k }}

      - name: 상권 전량 데이터셋 빌드(거리감쇠 입력 CSV · 상권 좌표 포함)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.heavy }}   # 분기 1회 · 느림(수십 분)
        working-directory: backend
        continue-on-error: true
        env:
          # seoul_trdar_client.get_api_key() 는 SEOUL_OPENDATA_API_KEY 를 읽는다(다른 수집기와 이름이 다름).
          SEOUL_OPENDATA_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python build_seoul_dataset.py --build

      - name: 역-거리 감쇠 분석(해상도 개선 · distance_decay.json)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.heavy }}   # 상권 CSV 의존 → heavy 에서만
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python analyze_distance_decay.py --csv app/data/real_data/seoul_trdar_dataset.csv

      - name: 상권 좌표 마커 레이어 생산(trade_zones.json · 5181→WGS84)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.heavy }}   # 상권 CSV 의존 → heavy 에서만
        working-directory: backend
        continue-on-error: true
        run: python make_trade_zones.py

      - name: 상권×업종 세부 레이어 생산(zone_industry.json · 매출·점포·객단가)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.heavy }}   # 같은 상권 CSV 의존 → heavy 에서만
        working-directory: backend
        continue-on-error: true
        run: python make_zone_industry.py

      - name: 매출 다분기 이력 수집(예측 학습용, 증분)
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_sales_history.py

      - name: 매출예측 백테스트(관성 이길 때만 예측)
        working-directory: backend
        continue-on-error: true
        run: python forecast_sales.py

      - name: 변경분 커밋
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # 파일별로 개별 add — 하나가 없어도(수집 실패) 나머지는 정상 스테이징
          for f in frontend/dashboard.html frontend/livepop_gu.json frontend/livepop_dong.json frontend/parking_gu.json frontend/sales_by_industry.json frontend/stores_by_industry.json frontend/sales_history.json frontend/sales_forecast.json frontend/repop.json frontend/workpop.json frontend/income.json frontend/storeinfo_gu.json frontend/subway_gu.json frontend/subway_stations.json frontend/distance_decay.json frontend/trade_zones.json frontend/zone_industry.json frontend/updates.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 대시보드·유동인구·주차 자동 갱신 ($(date -u +%Y-%m-%d))"
            # master 경합 대응: rebase 후 push 재시도(non-ff 거부 방지)
            ok=0
            for i in 1 2 3 4 5; do
              git fetch origin master || true
              git rebase origin/master || { git rebase --abort || true; }
              if git push origin HEAD:master; then ok=1; break; fi
              echo "최종 커밋 push 재시도 $i"; sleep $((i*3))
            done
            [ "$ok" = 1 ] || echo "최종 커밋 push 실패(경합 지속)"
          fi
