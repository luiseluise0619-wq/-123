name: 대시보드 자동 갱신

# 상권 데이터(매출·점포·임대료)는 분기별, 폐업·생존율은 연간 갱신이라
# 매주 1회면 충분(매일은 API 콜 낭비). 매주 월요일 06:10 KST(=21:10 UTC 일).
on:
  schedule:
    - cron: "10 21 * * 0"        # 매주 월요일 06:10 KST — 가벼운 주간 갱신(heavy 미포함)
    - cron: "20 21 1 * *"        # 매월 2일 06:20 KST — 21:20 UTC(1일)+9h → 2일 새벽. heavy 자동 실행(분기 상권/자치구 데이터 반영)
  workflow_dispatch:             # 수동 실행 버튼
    inputs:
      heavy:
        description: "상권 전량 빌드 포함(기본 ON · 수십 분, 상권/자치구/상권×업종 갱신). 빠른 갱신만 원하면 끄세요."
        type: boolean
        default: true

permissions:
  contents: write                # 갱신된 HTML 커밋용

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 전체 히스토리 — 커밋 스텝의 rebase(master 경합 대응)에 필요

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 의존성 설치
        run: pip install pandas numpy scikit-learn lightgbm requests pyproj pyarrow   # pyarrow: 상권 원천 parquet 캐시용

      - name: 대시보드 재생성
        working-directory: backend
        continue-on-error: true       # 식자재 CSV(gitignore)가 없으면 실패하지만 지도 수집은 계속돼야 함
        env:
          # 있으면 aT 실시간가로 최신값 갱신(없으면 CSV 기준). Actions Secrets 에 등록.
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python refresh_dashboard.py

      - name: 유동인구(생활인구) 수집 → 자치구 집계
        working-directory: backend
        continue-on-error: true       # 키 없거나 API 장애 시 지도는 기존 데이터로 동작
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_livepop.py

      - name: 주차장(입지 접근성) 수집 → 자치구 집계
        working-directory: backend
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect_parking.py

      - name: 추정매출(업종별 시간대·요일·연령) 수집
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_sales.py

      - name: 점포·개폐업(업종별 폐업률·프랜차이즈) 수집
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_stores.py

      - name: 상주인구(거주민 배후수요) 수집
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_repop.py

      - name: 직장인구(출근 수요) 수집
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_workpop.py

      - name: 소득소비(평균소득·지출 구성) 수집
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_income.py

      - name: 소상공인 상가정보(자치구별 실측 점포수) 수집
        working-directory: backend
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect_storeinfo.py

      - name: 지하철 승하차(자치구별 접근성) 수집
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_subway.py

      - name: 상권변화지표(등급·평균 생존개월) 수집
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_zone_change.py

      - name: 상권 집객시설(배후 수요 앵커) 수집
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_zone_facility.py

      - name: 상권 배후 아파트(주거 구매력) 수집
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_zone_apt.py

      - name: 충북 점포·업종 수집(소진공 상가업소)
        working-directory: backend
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect_stores_region.py 43 충청북도

      - name: 충남 점포·업종 수집(소진공 상가업소)
        working-directory: backend
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python collect_stores_region.py 44 충청남도

      # ── 아래 둘은 data.go.kr '활용신청' 승인 전까지 available:false 로 정직하게 비워 둔다 ──
      # 키는 이미 쓰는 DATA_GO_KR_KEY 를 그대로 재사용한다(새 키 발급 불필요).
      # 요청주소는 활용신청 화면의 '요청주소'를 그대로 Secrets/Variables 에 넣으면 된다.
      - name: 프랜차이즈 가맹정보(브랜드 창업비용·직영/가맹 점포수) 수집
        working-directory: backend
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          FTC_BRAND_URL: ${{ vars.FTC_BRAND_URL }}
          FTC_INDUSTRY_URL: ${{ vars.FTC_INDUSTRY_URL }}
          FTC_COST_URL: ${{ vars.FTC_COST_URL }}
        run: python collect_franchise.py

      - name: 상업용 건물 실거래가(법정동별 ㎡당 자리값) 수집
        working-directory: backend
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
          BLDPRICE_URL: ${{ vars.BLDPRICE_URL }}
          # 수익률을 넣으면 임대료 '추정'까지 한다. 비워 두면 실측(매매가)만 저장한다.
          BLDPRICE_YIELD: ${{ vars.BLDPRICE_YIELD }}
        run: python collect_bldprice.py

      - name: 역·자치구 데이터 1차 커밋(무거운 상권 빌드와 분리)
        continue-on-error: true       # 1차 커밋 실패해도 이후 스텝·최종 커밋은 계속
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # 지하철 수집(14번)까지의 산출물만 먼저 커밋 — 상권 전량 빌드(15번)에
          # 묶이지 않게 역·자치구 데이터를 master 에 즉시 반영한다.
          for f in frontend/subway_stations.json frontend/subway_gu.json frontend/storeinfo_gu.json frontend/livepop_gu.json frontend/livepop_dong.json frontend/parking_gu.json frontend/repop.json frontend/workpop.json frontend/income.json frontend/sales_by_industry.json frontend/stores_by_industry.json frontend/zone_change.json frontend/zone_facility.json frontend/zone_apt.json frontend/stores_chungbuk.json frontend/stores_chungnam.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if git diff --cached --quiet; then
            echo "1차 커밋: 변경 없음 — 생략"
          else
            git commit -m "chore: 역·자치구 데이터 1차 갱신 ($(date -u +%Y-%m-%d))"
            # master 가 런 도중 앞서갈 수 있으므로 rebase 후 push 재시도(non-ff 거부 방지)
            ok=0
            for i in 1 2 3 4 5; do
              git fetch origin master || true
              git rebase origin/master || { git rebase --abort || true; }
              if git push origin HEAD:master; then ok=1; break; fi
              echo "1차 커밋 push 재시도 $i"; sleep $((i*3))
            done
            [ "$ok" = 1 ] || echo "1차 커밋 push 실패(경합 지속) — 최종 커밋에서 재시도됨"
          fi

      - name: 상권 캐시 키(분기 단위)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.heavy) || github.event.schedule == '20 21 1 * *' }}
        id: trdarkey
        run: echo "k=trdar-$(date -u +%Y)-q$(( ($(date -u +%-m)-1)/3+1 ))" >> "$GITHUB_OUTPUT"

      - name: 상권 원천 parquet 캐시(같은 분기 재실행 시 1.6M행 재수집 생략)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.heavy) || github.event.schedule == '20 21 1 * *' }}
        uses: actions/cache@v4
        with:
          path: backend/app/data/real_data/_cache
          key: ${{ steps.trdarkey.outputs.k }}

      - name: 상권 전량 데이터셋 빌드(거리감쇠 입력 CSV · 상권 좌표 포함)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.heavy) || github.event.schedule == '20 21 1 * *' }}   # 분기 1회 · 느림(수십 분)
        working-directory: backend
        continue-on-error: true
        env:
          # seoul_trdar_client.get_api_key() 는 SEOUL_OPENDATA_API_KEY 를 읽는다(다른 수집기와 이름이 다름).
          SEOUL_OPENDATA_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python build_seoul_dataset.py --build

      - name: 자치구×업종 매출 집계(sales_gu_ind.json · 최신 분기 자동 정렬)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.heavy) || github.event.schedule == '20 21 1 * *' }}   # 상권 CSV 의존 → heavy 에서만
        working-directory: backend
        continue-on-error: true
        run: python build_sales_local.py   # 기본 입력=seoul_trdar_dataset.csv(최신 분기)

      - name: 자치구×업종 점포 집계(store_gu_ind.json · 최신 분기 자동 정렬)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.heavy) || github.event.schedule == '20 21 1 * *' }}   # 상권 CSV 의존 → heavy 에서만
        working-directory: backend
        continue-on-error: true
        run: python build_trdar_local.py   # 기본 입력=seoul_trdar_dataset.csv + trdar_signgu.csv 매핑

      - name: 역-거리 감쇠 분석(해상도 개선 · distance_decay.json)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.heavy) || github.event.schedule == '20 21 1 * *' }}   # 상권 CSV 의존 → heavy 에서만
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python analyze_distance_decay.py --csv app/data/real_data/seoul_trdar_dataset.csv

      - name: 상권 좌표 마커 레이어 생산(trade_zones.json · 5181→WGS84)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.heavy) || github.event.schedule == '20 21 1 * *' }}   # 상권 CSV 의존 → heavy 에서만
        working-directory: backend
        continue-on-error: true
        run: python make_trade_zones.py

      - name: 상권×업종 세부 레이어 생산(zone_industry.json · 매출·점포·객단가)
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.heavy) || github.event.schedule == '20 21 1 * *' }}   # 같은 상권 CSV 의존 → heavy 에서만
        working-directory: backend
        continue-on-error: true
        run: python make_zone_industry.py

      - name: 상권 인텔리전스 빌드(zone_intel.json · 수요/공급/기회·유사상권)
        working-directory: backend
        continue-on-error: true
        # API 키 불필요 — 이미 받아둔 상권·아파트·집객시설·생활인구 JSON 을 결합만 한다.
        # 반드시 collect_sales_history 앞에 둔다: 상권코드→자치구 매핑을 여기서 만들고
        # 그 매핑으로 아래에서 자치구×업종 매출 이력을 집계하기 때문.
        run: python build_zone_intel.py

      - name: 매출 다분기 이력 수집(업종·상권·자치구×업종, 증분)
        working-directory: backend
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
        run: python collect_sales_history.py

      - name: 매출예측 백테스트(관성 이길 때만 예측)
        working-directory: backend
        continue-on-error: true
        run: python forecast_sales.py

      - name: 상권 신호 생성(변화·이상징후·전망 · signals.json)
        working-directory: backend
        continue-on-error: true
        # 홀드아웃 검증을 통과한 예측만 show=true 로 내보낸다(화면은 show=false 를 표시하지 않음).
        run: python build_signals.py

      - name: 임대료·공실률 레이어 생산(rent.json · 정적 CSV 파생, 키 불필요)
        working-directory: backend
        continue-on-error: true
        run: python make_rent.py

      - name: 지도 번들 재생성(data-bundle.js · 모든 JSON 갱신 반영, 반드시 마지막)
        working-directory: backend
        continue-on-error: true       # 실패해도 기존 번들 유지 — 지도는 계속 동작
        run: python build_bundle.py   # core/geo 보존 + 동적 레이어를 최신 JSON으로 교체

      - name: 화면용 v3 데이터 조립(frontend/data/v3 — 배포본이 실제로 읽는 10개)
        working-directory: backend
        continue-on-error: true
        # 수집기들은 frontend/ 에 원천·중간 파일을 만들고, 화면은 data/v3 의 10개만 읽는다.
        # 이 단계가 그 사이를 잇는다. 지리(자치구 경로·경계·동 배정)는 그대로 두고
        # 분기마다 바뀌는 수치만 갱신한다 — build_v3.py 머리말 참고.
        run: python build_v3.py

      - name: 데이터 무결성 점검(분기 깨짐 조기 감지 · 비차단 리포트)
        working-directory: backend
        continue-on-error: true       # 데이터는 고치지 않고 로그로만 경고 — 배포는 막지 않음
        run: python check_data.py     # 비율합·범위·소비 구성 이상치 리포트(FAIL 있으면 로그에 표시)

      - name: 변경분 커밋
        run: |
          git config user.name  "dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          # 파일별로 개별 add — 하나가 없어도(수집 실패) 나머지는 정상 스테이징
          #
          # 여기 이름이 없으면 워크플로가 만들어도 커밋되지 않고 그대로 버려진다.
          # 실제로 build_zone_intel.py / build_signals.py 를 돌려놓고 그 결과물
          # (zone_intel·zone_index·zone_opportunity·zone_opportunity_all·signals·zone_history)
          # 을 목록에 안 넣어서, CI 는 매번 계산하고 매번 버렸다.
          # 새 빌더를 추가하면 출력 파일을 반드시 이 줄에 같이 추가할 것.
          for f in frontend/dashboard.html frontend/data-bundle.js frontend/livepop_gu.json frontend/livepop_dong.json frontend/parking_gu.json frontend/sales_by_industry.json frontend/stores_by_industry.json frontend/sales_history.json frontend/zone_history.json frontend/sales_forecast.json frontend/repop.json frontend/workpop.json frontend/income.json frontend/storeinfo_gu.json frontend/subway_gu.json frontend/subway_stations.json frontend/distance_decay.json frontend/trade_zones.json frontend/zone_industry.json frontend/rent.json frontend/sales_gu_ind.json frontend/store_gu_ind.json frontend/zone_change.json frontend/zone_facility.json frontend/zone_apt.json frontend/zone_intel.json frontend/zone_index.json frontend/zone_opportunity.json frontend/zone_opportunity_all.json frontend/signals.json frontend/stores_chungbuk.json frontend/stores_chungnam.json frontend/franchise.json frontend/bld_price.json frontend/updates.json frontend/data/v3/income.json frontend/data/v3/rent.json frontend/data/v3/sales_by_industry.json frontend/data/v3/sales_history.json frontend/data/v3/stores_by_industry.json frontend/data/v3/zone_industry.json frontend/data/v3/zone_gu.json frontend/data/v3/zone_livepop.json frontend/data/v3/seoul_map.json frontend/data/v3/zone_border.json; do
            [ -f "$f" ] && git add "$f" || true
          done
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: 대시보드·유동인구·주차 자동 갱신 ($(date -u +%Y-%m-%d))"
            # master 경합 대응: rebase 후 push 재시도(non-ff 거부 방지)
            ok=0
            for i in 1 2 3 4 5; do
              git fetch origin master || true
              git rebase origin/master || { git rebase --abort || true; }
              if git push origin HEAD:master; then ok=1; break; fi
              echo "최종 커밋 push 재시도 $i"; sleep $((i*3))
            done
            [ "$ok" = 1 ] || echo "최종 커밋 push 실패(경합 지속)"
          fi

      # 마지막에 둔다 — 여기서 실패해도 위의 커밋은 이미 끝나 있다.
      # continue-on-error 를 붙이지 않는 유일한 단계다. 수집이 전부 죽었을 때
      # 워크플로가 빨간불이 돼야 GitHub 이 메일을 보내기 때문이다.
      # 부분 실패로는 막지 않는다(스크립트가 exit 0) — 매주 빨간불이면 아무도 안 본다.
      - name: 수집 결과 요약(무엇이 갱신됐고 무엇이 비었는지)
        working-directory: backend
        run: python report_freshness.py
