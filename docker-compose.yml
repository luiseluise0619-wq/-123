version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DEMO_MODE=True
      - DATABASE_URL=sqlite:///./ai_local_intelligence.db
    volumes:
      - ./backend/app/ml/registry:/app/app/ml/registry
      
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
