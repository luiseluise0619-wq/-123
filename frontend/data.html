<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상권 데이터룸 · 서울 자영업 트렌드 리포트</title>
<style>
:root{
  --bg:#F7F8FA;--panel:#FFFFFF;--ink:#0F172A;--ink2:#64748B;--ink3:#94A3B8;
  --line:#E5E7EB;--navy:#1E3A5F;--navy2:#3E6DA6;--navyL:#EAF0F7;--r:16px;
  --good:#15803D;--bad:#B91C1C;--warn:#B45309;
  --sh:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.04);
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0B0E13;--panel:#141922;--ink:#F1F5F9;--ink2:#94A3B8;--ink3:#64748B;
  --line:#232B36;--navy:#6BA1E0;--navy2:#8FBAEA;--navyL:#182230;--sh:0 4px 16px rgba(0,0,0,.35);
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Inter,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:920px;margin:0 auto;padding:0 24px}
/* header */
.top{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10;backdrop-filter:saturate(1.2)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px}
.brand .m{width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.top a{font-size:13px;color:var(--navy2);text-decoration:none;font-weight:600}
/* hero */
.hero{padding:56px 0 40px}
.eyebrow{font-size:12px;font-weight:700;color:var(--navy2);letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-size:38px;font-weight:800;letter-spacing:-.02em;margin:12px 0 14px;line-height:1.15}
.hero p{font-size:16px;color:var(--ink2);max-width:640px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px 20px;box-shadow:var(--sh)}
.stat .n{font-size:34px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:13px;color:var(--ink2);margin-top:6px;font-weight:600}
.stat .src{font-size:11px;color:var(--ink3);margin-top:8px}
/* section */
section{padding:40px 0;border-top:1px solid var(--line)}
.shead{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.shead .idx{font-size:13px;font-weight:800;color:var(--navy2);font-variant-numeric:tabular-nums}
.shead h2{font-size:24px;font-weight:800;letter-spacing:-.01em}
.slead{font-size:15px;color:var(--ink2);margin-bottom:8px;max-width:680px}
.insight{background:var(--navyL);border:1px solid var(--line);border-left:3px solid var(--navy);
  border-radius:12px;padding:14px 16px;margin:18px 0;font-size:14px;line-height:1.6}
.insight b{color:var(--navy2)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:22px;box-shadow:var(--sh);margin-top:16px}
.card h3{font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:2px}
.card .unit{font-size:11px;color:var(--ink3);margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
/* bars */
.bars{display:flex;flex-direction:column;gap:11px}
.bar{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:12px;font-size:13px}
.bar .bl{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:10px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;background:var(--navy);transform-origin:left;transform:scaleX(0);
  animation:grow .8s cubic-bezier(.2,.8,.2,1) forwards}
.fill.alt{background:var(--navy2)}
@keyframes grow{to{transform:scaleX(1)}}
.bar .bv{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.note{font-size:12px;color:var(--ink3);margin-top:14px;line-height:1.6}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;
  background:var(--line);color:var(--ink2);margin-left:6px;vertical-align:middle}
.tag.warn{background:rgba(180,83,9,.14);color:var(--warn)}
/* methodology */
.method{padding:40px 0 70px;border-top:1px solid var(--line)}
.method h2{font-size:16px;font-weight:800;margin-bottom:14px}
.method table{width:100%;border-collapse:collapse;font-size:12.5px}
.method td{padding:9px 4px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink2)}
.method td:first-child{font-weight:700;color:var(--ink);width:150px}
.foot{font-size:11.5px;color:var(--ink3);margin-top:20px;line-height:1.7}
@media(max-width:720px){.hero h1{font-size:29px}.stats{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}
  .bar{grid-template-columns:78px 1fr auto}}
</style>
</head>

function barRows(rows,fmt,alt){
  const max=Math.max(...rows.map(r=>r[1]))||1;
  return `<div class="bars">`+rows.map((r,i)=>`<div class="bar">
    <span class="bl">${r[0]}</span>
    <span class="track"><span class="fill${alt?' alt':''}" style="width:${(r[1]/max*100).toFixed(1)}%;animation-delay:${i*50}ms"></span></span>
    <span class="bv">${fmt(r[1])}</span></div>`).join('')+`</div>`;
}

     서울 전체에서 가장 많이 다니는 연령대는 <b>${topAge[0]}</b> — 타깃 업종 선정의 근거가 됩니다.</div>
     <div class="grid2">
       <div class="card"><h3>자치구별 유동인구 상위</h3><div class="unit">명 · ${POP.hour}시</div>
         ${barRows(guTot,num)}</div>
       <div class="card"><h3>연령대 분포 (서울 전체)</h3><div class="unit">명 · ${POP.hour}시</div>
         ${barRows(ageRows,num,true)}</div>
     </div>
     <div class="note">출처: 서울 열린데이터광장 집계구 단위 생활인구(내국인) · 기준일 ${POP.stdr_date}.</div>`);
}

function renderMethod(){
  document.getElementById('method-table').innerHTML=[
    ['폐업 통계','국세청 국세통계 — 자치구별·사유별 폐업 (연간)'],
    ['임대료·공실','한국부동산원 상업용부동산 임대동향 (국가승인통계 408001, 분기)'],
    ['업종 매출·객단가','서울시 상권분석서비스 추정매출 (점포당 중위값, 추정)'],
    ['유동인구','서울 열린데이터광장 집계구 단위 생활인구 (매일)'],
    ['대중교통·주차','서울시 정류소 좌표 · 전국주차장 표준데이터'],
  ].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
  document.getElementById('foot').innerHTML=
    `기준 분기: ${DATA.quarter}. 모든 수치는 공개 통계에 근거하며, 추정치는 개별 점포와 다를 수 있습니다. `+
    `손익분기 등 계산 지표는 입력값 기준 정확 계산입니다. 이 리포트는 매일 자동 갱신됩니다.`;
}

fetch('livepop_gu.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(d=>{
  if(d&&d.gu&&Object.keys(d.gu).length)POP=d;
}).catch(()=>{}).finally(()=>{
  heroStats(); build(); renderPop();
});
</script>
</body>
</html>
