<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상권 데이터 라이브러리 · 서울 자영업</title>
<style>
:root{
  --bg:#F7F8FA;--panel:#FFFFFF;--ink:#0F172A;--ink2:#64748B;--ink3:#94A3B8;
  --line:#E5E7EB;--navy:#1E3A5F;--navy2:#2A78D6;--navyL:#EAF0F7;--r:16px;
  --sh:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;--s4:#eda100;--s5:#e87ba4;
  --b0:#cde2fb;--b1:#9ec5f4;--b2:#6da7ec;--b3:#3987e5;--b4:#256abf;--b5:#184f95;--b6:#0d366b;
  --w0:#fbdcdc;--w1:#f4abab;--w2:#ec7c7c;--w3:#e34948;--w4:#c22f2f;--w5:#9a2424;--w6:#6f1a1a;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0B0E13;--panel:#141922;--ink:#F1F5F9;--ink2:#94A3B8;--ink3:#64748B;
  --line:#232B36;--navy:#6BA1E0;--navy2:#3987E5;--navyL:#182230;--sh:0 4px 16px rgba(0,0,0,.35);
  --s1:#3987e5;--s2:#d95926;--s3:#199e70;--s4:#c98500;--s5:#d55181;
  --b0:#12283f;--b1:#1c3a5f;--b2:#1c5cab;--b3:#256abf;--b4:#3987e5;--b5:#5598e7;--b6:#86b6ef;
  --w0:#3a1717;--w1:#5c1c1c;--w2:#8a2727;--w3:#c22f2f;--w4:#e34948;--w5:#ec7c7c;--w6:#f4abab;
}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Inter,sans-serif;
  background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.5}
.wrap{max-width:1040px;margin:0 auto;padding:0 24px}
.top{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:58px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:15px;cursor:pointer}
.brand .m{width:28px;height:28px;border-radius:8px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px}
.top a,.top button{font:inherit;font-size:13px;color:var(--navy2);text-decoration:none;font-weight:600;background:none;border:none;cursor:pointer}
.topacts{display:flex;gap:16px;align-items:center}
.pdfbtn{color:#fff!important;background:var(--navy)!important;padding:8px 14px;border-radius:9px}
.hero{padding:48px 0 26px}
.eyebrow{font-size:12px;font-weight:700;color:var(--navy2);letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:12px 0 12px;line-height:1.15}
.hero p{font-size:16px;color:var(--ink2);max-width:660px}
.libgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding-bottom:60px}
.libcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  cursor:pointer;transition:.18s;display:flex;flex-direction:column;box-shadow:var(--sh)}
.libcard:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(16,24,40,.12);border-color:var(--cc,var(--navy2))}
.libcard .cover{aspect-ratio:1/1;background:var(--cbg);display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid var(--line)}
.libcard .cover .big{font-size:54px;filter:saturate(1.05)}
.libcard .cover .cat{position:absolute;top:12px;left:12px;font-size:10.5px;font-weight:800;padding:4px 9px;border-radius:7px;
  background:var(--panel);color:var(--cc,var(--navy2));box-shadow:0 1px 3px rgba(0,0,0,.08)}
.libcard .cover .st{position:absolute;top:12px;right:12px;font-size:9.5px;font-weight:700;padding:3px 8px;border-radius:7px}
.st.on{background:var(--s3);color:#fff}.st.wait{background:var(--panel);color:var(--ink3)}
.libcard .body{padding:15px 16px 17px}
.libcard h3{font-size:15px;font-weight:800;letter-spacing:-.01em;line-height:1.3}
.libcard p{font-size:12px;color:var(--ink2);margin-top:5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.libcard .src{font-size:10.5px;color:var(--ink3);margin-top:9px;display:block}
.topicview{display:none;padding:36px 0 70px}
.topicview.on{display:block}
.tcrumb{font-size:12.5px;color:var(--ink3);margin-bottom:8px}
.tcrumb a{color:var(--navy2);cursor:pointer;font-weight:600}
.topicview h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin-bottom:8px}
.exec{font-size:15px;color:var(--ink2);max-width:760px;margin-bottom:6px}
.insight{background:var(--navyL);border:1px solid var(--line);border-left:3px solid var(--navy2);
  border-radius:12px;padding:14px 16px;margin:20px 0;font-size:14px;line-height:1.6}
.insight b{color:var(--navy2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh)}
.card h3{font-size:14px;font-weight:700;margin-bottom:2px;display:flex;align-items:center;gap:7px}
.card h3 .dot{width:9px;height:9px;border-radius:3px;flex:none}
.card .unit{font-size:11px;color:var(--ink3);margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:6px 0 4px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--sh);position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--sbar,var(--s1))}
.stat .n{font-size:27px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat .l{font-size:12.5px;color:var(--ink2);margin-top:5px;font-weight:600}
.stat .s{font-size:11px;color:var(--ink3);margin-top:6px}
.bars{display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:96px 1fr auto;align-items:center;gap:11px;font-size:13px}
.bar .bl{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:11px;background:var(--line);border-radius:6px;overflow:hidden}
.fill{height:100%;border-radius:6px;transform-origin:left;transform:scaleX(0);animation:grow .8s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes grow{to{transform:scaleX(1)}}
.bar .bv{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.donut{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.donut svg{flex:none}
.legend{display:flex;flex-direction:column;gap:9px;font-size:13px;min-width:120px}
.legkey{display:flex;align-items:center;gap:9px}.legkey .sw{width:11px;height:11px;border-radius:3px;flex:none}
.legkey .ln{color:var(--ink2);flex:1}.legkey .lv{font-weight:700;font-variant-numeric:tabular-nums}
.sel{font:inherit;font-size:14px;font-weight:700;padding:10px 13px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);min-width:200px;margin:8px 0}
.note{font-size:12px;color:var(--ink3);margin-top:14px;line-height:1.6}
.tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--line);color:var(--ink2)}
.pending{background:var(--panel);border:1px dashed var(--line);border-radius:12px;padding:22px;color:var(--ink2);font-size:14px;line-height:1.7}
.srcbar{margin-top:26px;font-size:12px;color:var(--ink3);border-top:1px solid var(--line);padding-top:14px;line-height:1.7}
@media(max-width:980px){.libgrid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:720px){.libgrid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.hero h1{font-size:27px}.grid2,.stats{grid-template-columns:1fr}.bar{grid-template-columns:80px 1fr auto}}
@media print{
  .top{position:static} .topacts,.tcrumb{display:none} body{background:#fff}
  .card,.stat{box-shadow:none;break-inside:avoid} .grid2>*{break-inside:avoid}
  .fill{animation:none;transform:none!important} .libgrid{display:none}
}
</style>
</head>

    insight:`서울 <b>${FORECAST.n_industries}개 업종</b> 중 예측이 '전분기 유지(관성)'를 이긴 건 <b>${FORECAST.n_beat_naive}개(${Math.round(FORECAST.n_beat_naive/FORECAST.n_industries*100)}%)</b>뿐 — 전부 계절성이 신호였습니다. 나머지는 매출이 안정적이라 예측 대신 <b>손익분기 계산</b>이 정답입니다.`,
    body:`<div class="grid2"><div class="card"><h3><span class="dot" style="background:var(--b4)"></span>예측 가능한 업종(계절형)</h3><div class="unit">막대 길수록 정확</div><div class="bars">${rows}</div></div>
      <div class="card"><h3><span class="dot" style="background:var(--w4)"></span>왜 대부분은 예측을 안 하나</h3><div class="note" style="margin-top:2px">모델이 "전분기와 같다"고 찍는 것보다 나아야 의미가 있습니다. 음식·카페·서비스업은 분기 매출이 안정적이라 어떤 모델도 관성을 못 이겼어요. 그래서 <b style="color:var(--ink)">허위 예측 대신</b> 손익분기 계산기로 '얼마 팔아야 하는지'를 정확히 계산합니다. 이게 "예측을 파는 게 아니라 계산을 판다"는 이유입니다.</div></div></div>`,
    src:'서울 추정매출 21분기 워크포워드 백테스트(관성 vs 계절 vs 추세).'};
}

const TOPICS=[
  {id:'bench',ic:'🏁',c:'--s3',cat:'벤치마크',t:'전국 자영업 벤치마크',d:'생존율·창업비용·영업이익·부채 — 내 가게 비교 기준선',src:'통계청',fn:tBench,on:()=>true},
  {id:'closure',ic:'📉',c:'--w4',cat:'리스크',t:'폐업·폐업사유',d:'자치구별 폐업 현황과 왜 문을 닫는지',src:'국세청',fn:tClosure,on:()=>true},
  {id:'rent',ic:'🏢',c:'--s2',cat:'비용',t:'임대료·공실',d:'상권별 임대료와 위험 신호인 공실률',src:'부동산원',fn:tRent,on:()=>true},
  {id:'consumer',ic:'🚶',c:'--s1',cat:'소비자',t:'유동인구',d:'자치구·연령·성별 — 누가 어디 다니나',src:'서울 생활인구',fn:tConsumer,on:()=>!!POP},
  {id:'sales',ic:'💳',c:'--b4',cat:'소비',t:'소비패턴·매출',d:'업종별 시간대·요일·연령 매출과 실측 객단가',src:'서울 추정매출',fn:tSales,on:()=>!!SALES},
  {id:'stores',ic:'⚠️',c:'--w4',cat:'경쟁',t:'업종 위험도·경쟁',d:'업종별 폐업률·점포수·프랜차이즈 비중',src:'서울 점포',fn:tStores,on:()=>!!STORES},
  {id:'forecast',ic:'🔮',c:'--b4',cat:'예측',t:'매출예측(정직)',d:'관성을 이기는 업종만 — 나머지는 손익분기',src:'백테스트',fn:tForecast,on:()=>!!FORECAST},
];

function buildLibrary(){
  document.getElementById('libgrid').innerHTML=TOPICS.map(tp=>{
    const ok=tp.on();
    return `<div class="libcard" style="--cc:var(${tp.c});--cbg:color-mix(in srgb, var(${tp.c}) 15%, var(--panel))" onclick="openTopic('${tp.id}')">
      <div class="cover"><span class="cat">${tp.cat}</span><span class="st ${ok?'on':'wait'}">${ok?'DATA':'대기'}</span><span class="big">${tp.ic}</span></div>
      <div class="body"><h3>${tp.t}</h3><p>${tp.d}</p><span class="src">${tp.src}</span></div>
    </div>`;}).join('');
}
window.openTopic=function(id){
  const tp=TOPICS.find(x=>x.id===id);if(!tp)return;
  const r=tp.fn();
  let html=`<div class="tcrumb"><a onclick="backToLib()">← 라이브러리</a> · ${tp.src}</div><h1>${tp.t}</h1>`;
  if(r.pending){html+=`<div class="pending">${r.pending}</div>`;}
  else{html+=`<p class="exec">${r.exec}</p><div class="insight">${r.insight}</div>${r.body}<div class="srcbar">출처: ${r.src}</div>`;}
  const v=document.getElementById('topicview'); v.innerHTML=html; v.classList.add('on');
  document.getElementById('library').style.display='none';
  document.getElementById('pdfbtn').style.display=r.pending?'none':'inline-block';
  window.scrollTo(0,0);
  if(r.after)r.after();
};
window.backToLib=function(){
  document.getElementById('topicview').classList.remove('on');
  document.getElementById('library').style.display='';
  document.getElementById('pdfbtn').style.display='none';
  window.scrollTo(0,0);
};
function loadJSON(f){return fetch(f,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);}
Promise.all([loadJSON('livepop_gu.json'),loadJSON('sales_by_industry.json'),loadJSON('stores_by_industry.json'),loadJSON('sales_forecast.json')]).then(([p,s,t,f])=>{
  if(p&&p.gu&&Object.keys(p.gu).length)POP=p;
  if(s&&s.ind&&Object.keys(s.ind).length)SALES=s;
  if(t&&t.ind&&Object.keys(t.ind).length)STORES=t;
  if(f&&f.ind&&Object.keys(f.ind).length)FORECAST=f;
}).finally(buildLibrary);
</script>
</body>
</html>
