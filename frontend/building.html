<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상권 인텔리전스 · 건물 단위 지도</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F6FEB'/%3E%3Crect x='8' y='16' width='4' height='9' rx='1.2' fill='white'/%3E%3Crect x='14' y='11' width='4' height='14' rx='1.2' fill='white'/%3E%3Crect x='20' y='7' width='4' height='18' rx='1.2' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="theme.css">
<style>
/* ── 공통 메뉴/푸터 (모든 페이지 동일) ── */
.navlink{font-size:14px;color:var(--ink3);text-decoration:none;white-space:nowrap;
  letter-spacing:-.01em;transition:color .2s;font-weight:400}
.navlink:hover{color:var(--ink)}
.navlink.on{color:var(--ink);font-weight:600}
.sitefoot{border-top:1px solid var(--line);margin-top:40px}
.sitefoot .footwrap{max-width:1120px;margin:0 auto;padding:26px 20px 48px;
  display:flex;gap:22px;flex-wrap:wrap;align-items:center}
.sitefoot a{font-size:13px;color:var(--ink2);text-decoration:none;white-space:nowrap}
.sitefoot a:hover{color:var(--ink)}
.sitefoot a[aria-current]{color:var(--ink);font-weight:600}
.sitefoot .footsrc{margin-left:auto;font-size:12px;color:var(--ink3)}
@media print{.sitefoot{display:none}}

  .btnlink{display:block;text-align:center;text-decoration:none;background:var(--accent);color:var(--on-accent);border-radius:8px;padding:9px;font-size:13px;font-weight:600;margin-top:6px;box-sizing:border-box}

  table.cmpt td.na{color:var(--ink3)}
  #cmp-inline .cmpnote{font-size:10px;color:var(--mut);margin-top:5px;line-height:1.5}
  html,body{height:100%}   /* 지도 전체화면 — 색·폰트는 theme.css */
  #app{position:fixed;inset:0;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}

  .panel{position:absolute;top:12px;left:12px;z-index:10;width:288px;max-height:calc(100% - 24px);overflow-y:auto;

<!-- 개요 지도 기본 데이터(자치구 폐업추세 등). window.__SANGGWON 을 세팅 → 핀 분석의 폐업추세에 사용. -->
<script src="data-bundle.js"></script>
<script>
let MAP=null, GU=null, ST=null, ZONE=null, POP=null, PARK=null, STORE=null, DD=null, DONGPOP=null, DONGGEO=null, ZC=null, ZA=null, guCenters={}, IW=null, pinMk=null, pinCircle=null, lastPin=null, pinGu=null, pinData=null;

// 점이 폴리곤(외곽 링) 안에 있는지 — ray casting
function pointInRing(lng,lat,ring){let c=false;for(let i=0,j=ring.length-1;i<ring.length;j=i++){const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];if(((yi>lat)!==(yj>lat))&&(lng<(xj-xi)*(lat-yi)/(yj-yi)+xi))c=!c;}return c;}
// 클릭 지점이 속한 행정동 properties(adm,gu,dong) 반환
function findDong(lng,lat){
  if(!DONGGEO||!DONGGEO.features)return null;
  for(const f of DONGGEO.features){
    const geom=f.geometry; if(!geom)continue;
    const polys=geom.type==='MultiPolygon'?geom.coordinates:[geom.coordinates];
    for(const poly of polys){ if(poly[0]&&pointInRing(lng,lat,poly[0])) return f.properties; }
  }
  return null;
}
const stationMk=[], zoneMk=[], searchMk=[], savedMk=[];

function loadJSON(f){return fetch(f).then(r=>r.ok?r.json():null).catch(()=>null);}
function num(n){return (n==null||isNaN(n))?'—':Number(n).toLocaleString('ko-KR');}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function radiusOf(t,max){t=Math.max(0,t||0);return 70+Math.sqrt(t/(max||1))*300;}  // 작게 — 역 많아도 덜 겹치게
function colorStation(t,max){const r=Math.min(1,(t||0)/(max||1));return `rgb(42,${Math.round(150-r*70)},${Math.round(214-r*40)})`;}
function haversine(aLng,aLat,bLng,bLat){const R=6371000,rad=Math.PI/180;
  const p1=aLat*rad,p2=bLat*rad,dp=(bLat-aLat)*rad,dl=(bLng-aLng)*rad;
  const x=Math.sin(dp/2)**2+Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
function fmtM(m){return m<1000?Math.round(m)+'m':(m/1000).toFixed(m<10000?1:0)+'km';}
function fmtYmd(s){s=String(s||'');return s.length===8?`${+s.slice(4,6)}/${+s.slice(6,8)}`:s;}
function fmtYmdK(s){s=String(s||'');return s.length===8?`${+s.slice(4,6)}월 ${+s.slice(6,8)}일`:s;}
function fmtHour(h){h=parseInt(h,10);return isNaN(h)?'':(h<12?`오전 ${h||12}시`:h===12?'낮 12시':`오후 ${h-12}시`);}
function fmtQ(s){s=String(s||'');return s.length===5?`${s.slice(0,4)} ${s.slice(4)}분기`:s;}

function kakao(body){
  return fetch('/api/kakao',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
    .then(r=>r.json()).catch(e=>({ok:false,items:[],error:'연결 실패(배포 사이트에서만 동작): '+e}));
}

function drawGuBase(map){
  if(!GU||!GU.features)return;
  GU.features.forEach(f=>{
    const name=f.properties.name;
    const rings=f.geometry.type==='MultiPolygon'?f.geometry.coordinates.map(p=>p[0]):[f.geometry.coordinates[0]];
    let cx=0,cy=0,cn=0;
    rings.forEach(ring=>{
      const path=ring.map(pt=>new kakao.maps.LatLng(pt[1],pt[0]));
      new kakao.maps.Polygon({path,strokeWeight:1,strokeColor:'#B8B8B2',strokeOpacity:.7,fillColor:'#8A8A93',fillOpacity:.16}).setMap(map);
      ring.forEach(pt=>{cx+=pt[0];cy+=pt[1];cn++;});
    });
    if(cn) guCenters[name]={lat:cy/cn,lng:cx/cn};
  });
}
function drawStations(map){
  if(!ST||!ST.stations||!ST.stations.length)return;
  const max=ST.stations[0].total||1;
  ST.stations.forEach(s=>{
    if(s.lat==null||s.lon==null)return;
    const pos=new kakao.maps.LatLng(s.lat,s.lon);
    const c=new kakao.maps.Circle({center:pos,radius:radiusOf(s.total,max),strokeWeight:1,strokeColor:'#94949B',strokeOpacity:.3,fillColor:colorStation(s.total,max),fillOpacity:.4});
    c.setMap(document.getElementById('ly-station').checked?map:null); stationMk.push(c);
    kakao.maps.event.addListener(c,'click',()=>openIW(pos,`<b style="font-size:14px">${esc(s.nm)}</b> <span style="color:var(--ink3)">· ${esc(s.gu||'')}</span><br>승차 ${num(s.on)} · 하차 ${num(s.off)}<br><b>합계 ${num(s.total)}</b> 명/일`));
  });
  document.getElementById('ly-station-n').textContent=ST.n_stations?`${num(ST.n_stations)}개`:'';
}
function drawZones(map){
  if(!ZONE||!ZONE.available||!ZONE.zones||!ZONE.zones.length)return;
  const max=ZONE.zones[0].stores||1;
  ZONE.zones.forEach(z=>{
    if(z.lat==null||z.lon==null)return;
    const pos=new kakao.maps.LatLng(z.lat,z.lon);
    const c=new kakao.maps.Circle({center:pos,radius:70+Math.sqrt((z.stores||0)/max)*230,strokeWeight:1,strokeColor:'#8A6A3A',strokeOpacity:.35,fillColor:'#D9922F',fillOpacity:.4});
    c.setMap(document.getElementById('ly-zone').checked?map:null); zoneMk.push(c);
    const top=(z.top||[]).map(t=>`${esc(t.ind)} ${num(t.stores)}`).join(' · ');
    kakao.maps.event.addListener(c,'click',()=>openIW(pos,`<b style="font-size:14px">${esc(z.nm)}</b><br>점포 <b>${num(z.stores)}</b>개${z.sales?` · 월매출 ${num(z.sales)}`:''}<br><span style="color:#6E6E73;font-size:11px">${top}</span>`));
  });
  document.getElementById('ly-zone-n').textContent=ZONE.n_zones?`${num(ZONE.n_zones)}개`:'';
}
function openIW(pos,html){
  if(!IW) IW=new kakao.maps.InfoWindow({removable:true});
  IW.setContent(`<div style="padding:8px 11px;font:13px -apple-system;color:var(--bg);min-width:150px;max-width:240px">${html}</div>`);
  IW.setPosition(pos); IW.open(MAP);
}
function clearMk(arr){arr.forEach(m=>m.setMap(null));arr.length=0;}

/* ── 핀 분석: 클릭 지점 종합 브리핑 ── */
const CATS=[['FD6','음식점'],['CE7','카페'],['CS2','편의점'],['HP8','병원'],['PM9','약국'],['AC5','학원'],['BK9','은행'],['MT1','마트'],['SC4','학교'],['CT1','문화'],['SW8','지하철역']];
const AGES=[['a10','10대'],['a20','20대'],['a30','30대'],['a40','40대'],['a50','50대'],['a60','60+']];
function analyzePin(latlng){
  lastPin=latlng;
  // 모바일: 핀 찍으면 결과가 보이게 하단 시트 펼침
  const _pn=document.getElementById('panel');
  if(_pn&&_pn.classList.contains('collapsed')){_pn.classList.remove('collapsed');
    const _pt=document.getElementById('pan-toggle');if(_pt)_pt.innerHTML='정보판 접기 ▾';}
  const lat=latlng.getLat(), lng=latlng.getLng(), radius=+document.getElementById('pin-r').value;
  if(pinMk) pinMk.setMap(null);
  pinMk=new kakao.maps.Marker({position:latlng,map:MAP});
  if(pinCircle) pinCircle.setMap(null);
  pinCircle=new kakao.maps.Circle({center:latlng,radius,strokeWeight:2,strokeColor:'#1F7A4D',strokeOpacity:.9,fillColor:'#1F7A4D',fillOpacity:.07});
  pinCircle.setMap(MAP);

  // 1) 즉시 계산(로컬 haversine): 주변 역 3개, 가까운 상권, 역세권 프리미엄
  let near=null, stH='<span class="muted">역 데이터 준비 중 (heavy 실행 후)</span>';
  if(ST&&ST.stations&&ST.stations.length){
    near=ST.stations.map(s=>({s,d:haversine(lng,lat,s.lon,s.lat)})).sort((a,b)=>a.d-b.d).slice(0,3);
    stH=near.map(o=>`<div class="li"><span class="v">${esc(o.s.nm)} <span class="muted">${esc(o.s.gu||'')}</span></span><span class="d">${fmtM(o.d)} · ${num(o.s.total)}/일</span></div>`).join('');
  }
  // 역세권 프리미엄: distance_decay 의 대표 업종 임계거리 vs 이 지점의 최근접 역거리
  let premH='';
  if(near&&near.length){
    const d0=near[0].d;
    if(DD&&DD.available){
      const res=DD.result||DD.by_industry||DD.industries||{};
      let bp=null; for(const k in res){ if(res[k]&&res[k].breakpoint_m){bp=res[k].breakpoint_m;break;} }
      premH=bp!=null
        ? `역세권 매출 임계 ~${bp}m · 이 지점 최근접 역 ${fmtM(d0)} → <b>${d0<=bp?'역세권 안':'역세권 밖'}</b>`
        : `역 인접 매출 프리미엄 데이터 있음(임계 불명확)`;
    }else{
      premH=`역세권 매출분석은 heavy 실행 후`;
    }
  }
  let znBest=null, znDist=null, znH='<span class="muted">상권 데이터 준비 중 (heavy 실행 후)</span>';
  if(ZONE&&ZONE.available&&ZONE.zones&&ZONE.zones.length){
    let best=null,bd=1e12; ZONE.zones.forEach(z=>{const d=haversine(lng,lat,z.lon,z.lat);if(d<bd){bd=d;best=z;}});
    if(best){ znBest=best; znDist=bd; znH=`<div class="li"><span class="v">${esc(best.nm)}</span><span class="d">${fmtM(bd)} · 점포 ${num(best.stores)}</span></div>`; }
  }

  // 인사이트/재사용을 위해 이 핀의 데이터를 축적
  pinData={lat,lng,radius,
    popAsof:(POP&&POP.stdr_date)?fmtYmd(POP.stdr_date):null,
    stAsof:(ST&&ST.date)?fmtYmd(ST.date):null,
    znAsof:(ZONE&&ZONE.quarter)?fmtQ(ZONE.quarter):null,
    near: near?near.map(o=>({nm:o.s.nm,d:Math.round(o.d),total:o.s.total})):null,
    zone: znBest?{nm:znBest.nm,cd:znBest.cd,d:Math.round(znDist),stores:znBest.stores}:null,
    premium: (near&&near.length)?(DD&&DD.available?'있음':'준비중'):null,
    addr:null,gu:null,dong:null,popTot:null,popScope:null,mp:null,fp:null,topAge:null,
    store:null,lots:null,slots:null,trend:null,y2024:null,chosenName:null,cats:null,density:null};

  const popAs=(POP&&POP.stdr_date)?` · ${fmtYmd(POP.stdr_date)}${POP.hour?' '+fmtHour(POP.hour):''} 기준`:'';
  const stAs=(ST&&ST.date)?` · ${fmtYmd(ST.date)} 기준`:'';
  const znAs=(ZONE&&ZONE.quarter)?` · ${fmtQ(ZONE.quarter)}`:'';
  const sigStationH = (near&&near.length)
    ? `<b>${esc(near[0].s.nm)}</b> <span class="muted">${fmtM(near[0].d)} · 하루 승하차 ${num(near[0].s.total)}명</span>`
    : '<span class="muted">역 데이터 준비 중</span>';
  const box=document.getElementById('pin');
  box.innerHTML=
    // ── 핵심(예비 창업자 관점): 어디 + 3신호 + 가까운 역 ──
    `<div class="blk"><div class="lb">어디인가요</div><div class="big" id="pin-addr">주소 확인 중…</div><div class="v muted" id="pin-region"></div></div>`+
    `<div class="sig">`+
      `<div class="t" title="서울 생활인구 · 그 시각 그 지역에 머문 사람 수"><div class="tl" id="sig-pop-l">유동인구</div><div class="tv" id="sig-pop">…</div></div>`+
      `<div class="t" title="반경 내 카카오지도에 등록된 그 업종 가게 수(지금 조회)"><div class="tl" id="sig-cat-l">경쟁</div><div class="tv" id="sig-cat">…</div></div>`+
      `<div class="t" title="2022→2024 자치구 폐업 건수 증감률. ▲ 늘어남(주의) ▼ 줄어듦"><div class="tl">폐업 2년</div><div class="tv" id="sig-close">…</div></div>`+
    `</div>`+
    `<div class="muted" id="sig-pop-note" style="font-size:10.5px;margin:0 0 4px">${(POP&&POP.stdr_date)?`※ 유동인구 = <b>${fmtYmdK(POP.stdr_date)} ${fmtHour(POP.hour)}</b> 그 지역에 머문 사람 수(서울 생활인구)`:'※ 유동인구 데이터 준비 중'}</div>`+
    `<div class="blk"><div class="lb">가까운 역<span class="asof">${stAs}</span></div><div class="v">${sigStationH}</div></div>`+
    // ── 자세히(접기): 상세 지표 ──
    `<details class="more"><summary>자세히 보기 ▾</summary>`+
      `<div class="blk"><div class="lb">유동인구 구성<span class="asof">${popAs}</span></div><div class="v" id="pin-pop">…</div><div class="muted" id="pin-demo" style="font-size:11px;margin-top:2px"></div></div>`+
      `<div class="blk"><div class="lb">자치구 지표<span class="asof"> · 구 전체 실측</span></div><div class="v" id="pin-gu">…</div></div>`+
      `<div class="blk"><div class="lb">주변 역 (가까운 3)<span class="asof">${stAs} · 하루 승하차 합</span></div>${stH}${premH?`<div class="muted" style="font-size:11px;margin-top:4px">${premH}</div>`:''}</div>`+
      `<div class="blk"><div class="lb">가까운 상권<span class="asof">${znAs} · 상권별 점포수</span></div>${znH}</div>`+
      `<div class="blk"><div class="lb">이 건물<span class="asof"> · 건축물대장, 지금 조회</span></div><div class="v" id="pin-bld"><span class="muted">조회 중…</span></div></div>`+
      `<div class="blk"><div class="lb">반경 ${fmtM(radius)} 업종별 점포<span class="asof"> · 카카오 등록, 지금 조회</span></div><div class="chips" id="pin-cats"><span class="muted">세는 중…</span></div><div class="muted" id="pin-density" style="font-size:11px;margin-top:5px"></div></div>`+
    `</details>`;

  // 동네(행정동) 생활인구 — 구 전체(예: 45만) 대신 지점이 속한 동네 국소값으로 즉시 표시
  let popFilled=false;
  const dongP=findDong(lng,lat);
  const lp=(DONGPOP&&DONGPOP.dong&&dongP&&dongP.adm&&DONGPOP.dong[dongP.adm])||null;
  if(lp&&lp.tot!=null){
    const sp0=document.getElementById('sig-pop'); if(sp0) sp0.innerHTML=`${num(Math.round(lp.tot))}<small>명</small>`;
    const spl=document.getElementById('sig-pop-l'); if(spl) spl.textContent=dongP.dong||'유동인구';
    const spn=document.getElementById('sig-pop-note'); if(spn) spn.innerHTML=`※ 유동인구 = <b>${fmtYmdK(DONGPOP.stdr_date)} ${fmtHour(DONGPOP.hour)}</b> <b>${esc(dongP.dong||'')}</b>(동네) 생활인구 · 구 전체 아님`;
    if(pinData){pinData.popTot=Math.round(lp.tot);pinData.popScope=dongP.dong;}
    popFilled=true;
  }
  document.getElementById('pin-opp').innerHTML='';   // 새 지점: 기회 업종 초기화
  updateURL();
  drawSavedMarkers();   // 선택 상태(주황) 반영 — 저장 마커를 다시 누르면 제거되는 힌트

  // 이 건물(건축물대장) 실시간 조회 — 좌표→법정동코드→표제부(서버 함수, 키는 서버에만)
  (function(){
    const el=document.getElementById('pin-bld'); if(!el)return;
    fetch('/api/building',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({x:lng,y:lat})})
      .then(r=>r.json()).then(d=>{
        if(d&&d.ok&&d.bld){const b=d.bld;
          const fl=[b.grndFlr?`지상 ${b.grndFlr}층`:'', b.ugrndFlr?`지하 ${b.ugrndFlr}층`:''].filter(Boolean).join(' · ');
          const ar=b.totArea?`연면적 ${num(Math.round(b.totArea))}㎡`:'';
          const ap=(b.aprDay&&b.aprDay.length>=4)?`${b.aprDay.slice(0,4)}년 준공`:'';
          el.innerHTML=`${b.name?`<b>${esc(b.name)}</b> · `:''}${esc(b.use||'용도 미상')}`+
            `<div class="muted" style="font-size:11px;margin-top:2px">${[fl,ar,b.struct,ap].filter(Boolean).map(esc).join(' · ')}${b.dongCnt>1?` · ${b.dongCnt}개 동`:''}</div>`;
        } else {
          el.innerHTML=`<span class="muted">${esc((d&&d.error)||'건축물대장 없음')}</span>`;
        }
      }).catch(()=>{el.innerHTML='<span class="muted">조회 실패(배포 사이트에서만 동작)</span>';});
  })();

  // 2) 역지오코딩 → 주소·자치구 → 유동인구(성별·연령) · 폐업추세
  kakao({mode:'coord',x:lng,y:lat}).then(d=>{
    if(d&&d.ok){
      document.getElementById('pin-addr').textContent=d.address||'주소 정보 없음';
      document.getElementById('pin-region').textContent=[d.sido,d.gu,d.dong].filter(Boolean).join(' ');
      pinGu=d.gu||null;
      if(pinData){pinData.addr=d.address||null;pinData.gu=d.gu||null;pinData.dong=d.dong||null;}
      const pop=POP&&POP.gu&&d.gu&&POP.gu[d.gu];
      document.getElementById('pin-pop').innerHTML=pop
        ? `${esc(d.gu)} <b>${num(pop.tot)}</b>명 <span class="muted">${POP&&POP.hour?fmtHour(POP.hour)+' 머묾':'체류'}</span>`
        : `<span class="muted">${d.gu?esc(d.gu)+' 유동인구 데이터 없음':'자치구 밖'}</span>`;
      if(!popFilled){const sp=document.getElementById('sig-pop'); if(sp) sp.innerHTML=pop?`${num(pop.tot)}<small>명</small>`:'<small class="muted">—</small>';}
      // 성별·연령 구성(자치구 기준)
      if(pop&&pop.tot){
        const mp=Math.round((pop.m||0)/pop.tot*100), fp=100-mp;
        let topAge='', tv=-1; AGES.forEach(([k,l])=>{if((pop[k]||0)>tv){tv=pop[k]||0;topAge=l;}});
        document.getElementById('pin-demo').innerHTML=`남 ${mp}% · 여 ${fp}% · 최다 ${topAge}`;
        if(pinData){if(!popFilled){pinData.popTot=pop.tot;pinData.popScope='자치구';}pinData.mp=mp;pinData.fp=fp;pinData.topAge=topAge;}
      }
      // 자치구 지표: 실측 상가 · 주차장 · 폐업추세
      const gv=[];
      const store=STORE&&STORE.gu&&d.gu&&STORE.gu[d.gu];
      if(store){ gv.push(`<div class="li"><span class="v">가게 수</span><span class="d">${num(store.stores)}개</span></div>`); if(pinData)pinData.store=store.stores; }
      const pk=PARK&&PARK.gu&&d.gu&&PARK.gu[d.gu];
      if(pk){ gv.push(`<div class="li"><span class="v">주차장</span><span class="d">${num(pk.lots)}곳 · ${num(pk.slots)}면</span></div>`); if(pinData){pinData.lots=pk.lots;pinData.slots=pk.slots;} }
      const core=(window.__SANGGWON&&window.__SANGGWON.core), cg=core&&core.gu&&d.gu&&core.gu[d.gu];
      if(cg&&cg.trend!=null){ gv.push(`<div class="li"><span class="v">가게 폐업<span class="muted"> 건수 2년증감</span></span><span class="d">${cg.trend>=0?'+':''}${cg.trend}% · '24년 ${num(cg.y2024)}곳</span></div>`); if(pinData){pinData.trend=cg.trend;pinData.y2024=cg.y2024;} }
      document.getElementById('pin-gu').innerHTML=gv.length?gv.join(''):`<span class="muted">자치구 지표 없음</span>`;
      const scl=document.getElementById('sig-close');
      if(scl){ if(cg&&cg.trend!=null){const up=cg.trend>=0;scl.innerHTML=`<span style="color:${up?'var(--bad)':'var(--good)'}">${up?'▲':'▼'}${Math.abs(cg.trend)}<small>%</small></span>`;} else scl.innerHTML='<small class="muted">—</small>'; }
    }else{
      document.getElementById('pin-addr').textContent='주소 변환 실패';
      document.getElementById('pin-region').innerHTML=`<span class="muted">${esc((d&&d.error)||'')}</span>`;
      document.getElementById('pin-pop').innerHTML='<span class="muted">—</span>';
      document.getElementById('pin-gu').innerHTML='<span class="muted">자치구 미확인</span>';
      if(!popFilled){const sp=document.getElementById('sig-pop'); if(sp)sp.innerHTML='<small class="muted">—</small>';}
      const scl=document.getElementById('sig-close'); if(scl)scl.innerHTML='<small class="muted">—</small>';
    }
  });

  // 3) 반경 내 점포수 — 카카오 호출 절감: 선택 업종 + 핵심 3개(음식·카페·편의)만 즉시,
  //    나머지 업종은 칩('업종 +')을 눌렀을 때만 1건씩 조회(온디맨드). 429/비용 방어.
  const CORE=['FD6','CE7','CS2'];
  const chosenCode=document.getElementById('pin-cat').value;
  const nowCodes=[...new Set([chosenCode, ...CORE])];   // 중복 제거 → 최대 4건
  const nowCats=CATS.filter(c=>nowCodes.includes(c[0]));
  const laterCats=CATS.filter(c=>!nowCodes.includes(c[0]));
  const catState={};   // code -> {nm, n}
  const el=document.getElementById('pin-cats');

  function renderCats(){
    const pick=catState[chosenCode];
    const pickH=pick?`<div class="pick">선택 업종 <b>${esc(pick.nm)} ${pick.n==null?'—':num(pick.n)}</b>곳 <span class="muted">반경 내</span></div>`:'';
    const nowH=nowCats.map(([code,nm])=>{const c=catState[code];
      return `<span class="chip${code===chosenCode?' sel':''}">${esc(nm)} <b>${c&&c.n!=null?num(c.n):'—'}</b></span>`;}).join('');
    const laterH=laterCats.map(([code,nm])=>{const c=catState[code];
      return (c&&c.n!=null)
        ? `<span class="chip${code===chosenCode?' sel':''}">${esc(nm)} <b>${num(c.n)}</b></span>`
        : `<span class="chip more" data-code="${code}" data-nm="${esc(nm)}">${esc(nm)} <b>+</b></span>`;}).join('');
    el.innerHTML=pickH+nowH+laterH;
    [...el.querySelectorAll('.chip.more')].forEach(ch=>ch.onclick=()=>loadCat(ch.dataset.code,ch.dataset.nm));
  }
  function loadCat(code,nm){
    const chip=[...el.querySelectorAll('.chip.more')].find(c=>c.dataset.code===code);
    if(chip) chip.innerHTML=`${esc(nm)} …`;
    kakao({mode:'category',code,x:lng,y:lat,radius,size:1}).then(r=>{
      catState[code]={nm,n:r&&r.ok?r.total:null};
      if(pinData&&catState[code].n!=null){pinData.cats=pinData.cats||[];pinData.cats.push({nm,n:catState[code].n});}
      renderCats();
    });
  }
  function updateDensity(){
    const pick=catState[chosenCode], pop=POP&&POP.gu&&pinGu&&POP.gu[pinGu];
    if(pick&&pick.n>0&&pop&&pop.tot){
      const dens=Math.round(pop.tot/pick.n);
      if(pinData)pinData.density={nm:pick.nm,per:dens};
      document.getElementById('pin-density').innerHTML=`경쟁 밀도: ${esc(pick.nm)} 1곳당 유동 <b>${num(dens)}</b>명 <span style="opacity:.7">(자치구 유동 ÷ 반경 ${esc(pick.nm)}, 참고)</span>`;
    }else document.getElementById('pin-density').innerHTML='';
  }

  Promise.all(nowCats.map(([code,nm])=>kakao({mode:'category',code,x:lng,y:lat,radius,size:1}).then(r=>({nm,code,n:r&&r.ok?r.total:null,err:r&&r.error}))))
    .then(rows=>{
      const scl=document.getElementById('sig-cat-l'), scv=document.getElementById('sig-cat');
      if(!rows.some(r=>r.n!=null)){el.innerHTML=`<span class="muted">${esc(rows.find(r=>r.err)?.err||'집계 실패 — /api/kakao(KAKAO_REST_KEY) 확인')}</span>`;
        document.getElementById('pin-density').innerHTML='';
        if(scv)scv.innerHTML='<small class="muted">키필요</small>';return;}
      rows.forEach(r=>{catState[r.code]={nm:r.nm,n:r.n};});
      const pk=catState[chosenCode];
      if(scl)scl.textContent=pk?pk.nm:'경쟁';
      if(scv)scv.innerHTML=pk&&pk.n!=null?`${num(pk.n)}<small>곳</small>`:'<small class="muted">—</small>';
      if(pinData){pinData.chosenName=pk?pk.nm:null;
        pinData.cats=Object.values(catState).filter(c=>c.n!=null).map(c=>({nm:c.nm,n:c.n}));}
      renderCats(); updateDensity();
    });
}

// 축적된 핀 데이터 → 사람이 읽을 컨텍스트 텍스트(있는 값만, 없는 건 생략 → AI 가 지어내지 않게)
function pinContext(){
  const p=pinData; if(!p)return '';
  const L=[];
  if(p.addr||p.gu) L.push(`위치: ${p.addr||''}${p.gu?' ('+p.gu+(p.dong?' '+p.dong:'')+')':''}`);
  if(p.popTot!=null){const scope=p.popScope&&p.popScope!=='자치구'?p.popScope+'(동네)':'자치구 전체';
    L.push(`유동인구(생활인구): ${scope} ${p.popTot.toLocaleString()}명 · 기준 ${p.popAsof||''} ${POP&&POP.hour?fmtHour(POP.hour):''}(그 시각 그 지역에 머문 사람)${p.mp!=null?`, 성별·연령은 자치구 기준 남 ${p.mp}% 여 ${p.fp}% 최다연령 ${p.topAge}`:''}`);}
  if(p.store!=null) L.push(`자치구 실측 상가: ${p.store.toLocaleString()}개`);
  if(p.lots!=null) L.push(`자치구 주차장: ${p.lots}곳 ${p.slots}면`);
  if(p.trend!=null) L.push(`자치구 폐업 추세(2년): ${p.trend>=0?'+':''}${p.trend}%, 2024년 폐업 ${(p.y2024||0).toLocaleString()}건`);
  if(p.near&&p.near.length) L.push(`가까운 역: ${p.near.map(n=>`${n.nm} ${n.d}m(승하차 ${n.total.toLocaleString()}/일)`).join(', ')} (${p.stAsof||''} 기준)`);
  if(p.zone) L.push(`가까운 상권: ${p.zone.nm} ${p.zone.d}m, 점포 ${p.zone.stores.toLocaleString()}개 (${p.znAsof||''})`);
  if(p.cats&&p.cats.length) L.push(`반경 ${p.radius}m 점포수: ${p.cats.map(c=>`${c.nm} ${c.n}`).join(', ')}`);
  if(p.density) L.push(`경쟁 밀도(참고): ${p.density.nm} 1곳당 자치구 유동 ${p.density.per.toLocaleString()}명`);
  if(p.chosenName) L.push(`사용자 관심 업종: ${p.chosenName}`);
  return L.join('\n');
}
function runInsight(){
  const out=document.getElementById('pin-insight'); if(!out)return;
  const ctx=pinContext();
  if(!ctx){out.innerHTML='<span class="muted">먼저 지도를 클릭해 지점을 고르세요.</span>';return;}
  const model=(document.getElementById('ai-model')||{}).value||'';
  out.innerHTML='<span class="muted">AI가 정리 중…</span>';
  fetch('/api/insight',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({context:ctx,model})})
    .then(r=>r.json()).then(d=>{
      if(d&&d.insight){const tag=[d.provider,d.model].filter(Boolean).join(' · ');out.innerHTML=esc(d.insight)+(tag?`<div style="color:var(--mut);font-size:10.5px;margin-top:6px">· ${esc(tag)}</div>`:'');}
      else out.innerHTML=`<span class="muted">${esc((d&&d.error)||'인사이트 생성 실패')}</span>`;
    }).catch(e=>{out.innerHTML=`<span class="muted">연결 실패(배포 사이트에서만 동작): ${esc(String(e))}</span>`;});
}
// 설정된 제공자(Gemini·OpenAI·Anthropic)별 모델을 드롭다운에 optgroup 으로 채움(선택 저장)
function loadModels(){
  const sel=document.getElementById('ai-model'); if(!sel)return;
  const saved=(()=>{try{return localStorage.getItem('ai_model')||'';}catch{return'';}})();
  sel.onchange=()=>{try{localStorage.setItem('ai_model',sel.value);}catch{}};
  fetch('/api/models').then(r=>r.json()).then(d=>{
    if(!d||!d.ok)return;
    const groups=Array.isArray(d.groups)?d.groups:[];
    if(groups.length){
      groups.forEach(g=>{
        if(!g.models||!g.models.length)return;
        const og=document.createElement('optgroup'); og.label=g.label||g.provider;
        g.models.forEach(m=>{const o=document.createElement('option');o.value=g.provider+':'+m;o.textContent=m;og.appendChild(o);});
        sel.appendChild(og);
      });
    } else if(Array.isArray(d.models)){ // 하위호환
      d.models.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;sel.appendChild(o);});
    }
    if(saved&&[...sel.options].some(o=>o.value===saved)) sel.value=saved;
  }).catch(()=>{});
}

// 이 동네 기회 업종 — 수요(동네 생활인구) 대비 공급(반경 내 그 업종 가게 수)
const OPP_CATS=[['FD6','음식점'],['CE7','카페'],['CS2','편의점'],['AC5','학원']];
function opportunityAnalysis(){
  const out=document.getElementById('pin-opp');
  if(!lastPin){out.innerHTML='<span class="muted">먼저 지도를 클릭해 지점을 고르세요.</span>';return;}
  const demand=pinData&&pinData.popTot;
  if(!demand){out.innerHTML='<span class="muted">유동인구 데이터가 있어야 분석됩니다(핀을 다시 클릭).</span>';return;}
  const lng=lastPin.getLng(), lat=lastPin.getLat(), radius=+document.getElementById('pin-r').value;
  const scope=(pinData&&pinData.popScope)||'해당 지역';
  out.innerHTML='<span class="muted">기회 업종 계산 중…</span>';
  Promise.all(OPP_CATS.map(([code,nm])=>kakao({mode:'category',code,x:lng,y:lat,radius,size:1}).then(r=>({nm,n:r&&r.ok?r.total:null,err:r&&r.error}))))
    .then(rows=>{
      const ok=rows.filter(r=>r.n!=null);
      if(!ok.length){out.innerHTML=`<span class="muted">${esc(rows.find(r=>r.err)?.err||'집계 실패 — KAKAO_REST_KEY 확인')}</span>`;return;}
      ok.forEach(r=>r.ratio=Math.round(demand/(r.n+1)));   // 가게 1곳당 동네 사람 수(많을수록 덜 붐빔)
      ok.sort((a,b)=>b.ratio-a.ratio);
      out.innerHTML=
        `<div style="font-size:12px;margin:2px 0 5px"><b>${esc(scope)}</b> · 가게 1곳당 사람 수(많을수록 덜 붐빔=기회)</div>`+
        ok.map((r,i)=>`<div class="li"><span class="v">${i===0?'[추천] ':''}${esc(r.nm)}</span><span class="d">${num(r.n)}곳 · 1곳당 <b>${num(r.ratio)}</b>명</span></div>`).join('')+
        `<div class="muted" style="font-size:10.5px;margin-top:5px">※ 동네 생활인구 ÷ 반경 내 가게 수. 카카오 등록·오후 2시 기준의 <b>참고 지표</b>이지 '예상 매출'이 아님.</div>`;
    });
}

// 공유: 핀 위치·업종·반경을 URL 로 → 링크만 보내면 같은 화면 복원
function updateURL(){
  if(!lastPin)return;
  const p=new URLSearchParams();
  p.set('lat',lastPin.getLat().toFixed(6)); p.set('lng',lastPin.getLng().toFixed(6));
  p.set('cat',document.getElementById('pin-cat').value); p.set('r',document.getElementById('pin-r').value);
  history.replaceState(null,'','?'+p.toString());
}
function shareLink(){
  updateURL();
  const btn=document.getElementById('pin-share-btn');
  const done=()=>{const t=btn.textContent;btn.textContent='링크 복사됨';setTimeout(()=>btn.textContent=t,1600);};
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(location.href).then(done,done);
  else done();
}

// 후보지 저장·비교(localStorage)
function loadSaved(){try{return JSON.parse(localStorage.getItem('bld_saved')||'[]');}catch{return[];}}
function saveSaved(a){try{localStorage.setItem('bld_saved',JSON.stringify(a.slice(0,8)));}catch{}}
function renderSaved(){
  const a=loadSaved(), sec=document.getElementById('saved-sec'), list=document.getElementById('saved-list');
  document.getElementById('saved-n').textContent=a.length?a.length+'곳':'';
  sec.style.display=a.length?'':'none'; if(!a.length){list.innerHTML='';return;}
  list.innerHTML=a.map((s,i)=>`<div class="r" data-i="${i}"><span class="del" data-del="${i}">×</span><b>${i+1}. ${esc(s.label)}</b><br><span class="c">사람 ${s.pop!=null?num(s.pop):'—'} · ${esc(s.catNm||'경쟁')} ${s.catN!=null?num(s.catN)+'곳':'—'} · 폐업 ${s.trend!=null?(s.trend>=0?'+':'')+s.trend+'%':'—'}</span></div>`).join('');
  [...list.querySelectorAll('.r')].forEach(el=>el.onclick=e=>{
    if(e.target.dataset.del!=null){const arr=loadSaved();arr.splice(+e.target.dataset.del,1);saveSaved(arr);renderSaved();return;}
    const s=a[+el.dataset.i], pos=new kakao.maps.LatLng(s.lat,s.lng); MAP.setCenter(pos); MAP.setLevel(4); analyzePin(pos);
  });
  drawSavedMarkers();
  renderInlineCompare();
}
// 저장 지점을 지도에 번호(①②③) 마커로
function drawSavedMarkers(){
  savedMk.forEach(m=>m.setMap(null)); savedMk.length=0;
  if(!MAP)return;
  loadSaved().forEach((s,i)=>{
    const el=document.createElement('div'); el.className='numpin'; el.textContent=i+1;
    el.title='클릭: 이 지점 분석 · 선택된 상태에서 다시 클릭: 제거';
    const sel=lastPin&&Math.abs(lastPin.getLat()-s.lat)<1e-7&&Math.abs(lastPin.getLng()-s.lng)<1e-7;
    if(sel) el.classList.add('sel');
    el.onclick=()=>{
      // 이미 선택(분석)된 지점을 다시 누르면 제거(토글)
      if(lastPin&&Math.abs(lastPin.getLat()-s.lat)<1e-7&&Math.abs(lastPin.getLng()-s.lng)<1e-7){
        const arr=loadSaved(); const k=arr.findIndex(x=>Math.abs(x.lat-s.lat)<1e-7&&Math.abs(x.lng-s.lng)<1e-7);
        if(k>-1){arr.splice(k,1);saveSaved(arr);}
        if(pinMk){pinMk.setMap(null);pinMk=null;} if(pinCircle){pinCircle.setMap(null);pinCircle=null;}
        lastPin=null; renderSaved(); return;
      }
      const pos=new kakao.maps.LatLng(s.lat,s.lng);MAP.setCenter(pos);MAP.setLevel(4);analyzePin(pos);
    };
    savedMk.push(new kakao.maps.CustomOverlay({map:MAP,position:new kakao.maps.LatLng(s.lat,s.lng),yAnchor:1.1,content:el}));
  });
}
// 저장 지점 인라인 비교표(색상: 각 항목 유리한 값 초록) — 새 창 없이 페이지 안에서
let cmpOpen=false;
function renderInlineCompare(){
  const box=document.getElementById('cmp-inline'); if(!box) return;
  const a=loadSaved();
  if(!cmpOpen||!a.length){box.style.display='none';box.innerHTML='';return;}
  box.style.display='';
  const catNm=(a.find(s=>s.catNm)||{}).catNm||'경쟁';
  // [라벨, 값getter, 방향('hi'큰게 유리|'lo'작은게 유리|null), 포맷]
  const metrics=[
    ['유동인구', s=>s.pop, 'hi', v=>num(Math.round(v))],
    [catNm+' 가게', s=>s.catN, 'lo', v=>num(v)+'곳'],
    ['폐업 2년', s=>s.trend, 'lo', v=>(v>=0?'+':'')+v+'%'],
    ['가까운 상권 점포', s=>s.zoneStores, 'hi', v=>num(v)],
    ['상권 등급', s=>s.grade, null, v=>esc(v)],
    ['평균 생존기간', s=>s.oprMt, 'hi', v=>num(v)+'개월'],
    ['배후 아파트', s=>s.aptHshld, 'hi', v=>num(v)+'세대'],
    ['아파트 평균시가', s=>s.aptPrice, 'hi', v=>v+'억'],
    ['최근접 역', s=>s.nearD, 'lo', v=>fmtM(v)],
    ['자치구 가게수', s=>s.store, null, v=>num(v)],
  ];
  const body=metrics.map(([label,get,dir,fmt])=>{
    const vals=a.map(get);
    const nn=vals.filter(v=>v!=null);
    const best=(dir&&nn.length)?(dir==='hi'?Math.max(...nn):Math.min(...nn)):null;
    const cells=vals.map(v=>{
      if(v==null)return '<td class="na">—</td>';
      const win=best!=null&&v===best&&nn.length>1;
      return `<td class="${win?'win':''}">${fmt(v)}</td>`;
    }).join('');
    return `<tr><td class="mh">${label}</td>${cells}</tr>`;
  }).join('');
  const heads=a.map((s,i)=>`<td class="win" style="text-align:center;background:none;color:var(--ink)">${i+1}</td>`).join('');
  const names=a.map((s,i)=>`<div class="cmpname"><b>${i+1}.</b> ${esc(s.label)}</div>`).join('');
  box.innerHTML=`<div class="cmpnames">${names}</div>`+
    `<table class="cmpt"><thead><tr><td class="mh"></td>${heads}</tr></thead><tbody>${body}</tbody></table>`+
    `<div class="cmpnote">초록 = 그 항목에서 유리한 값(유동인구·상권 점포는 클수록, 경쟁·폐업·역거리는 작을수록). 항목별 실측이며 예상 매출 아님.</div>`;
}

    `th{background:#eef3f9}td.h{background:#f7fafc;font-weight:600;text-align:left;white-space:nowrap}`+
    `.note{color:#5A5A60;font-size:11px;margin-top:14px;line-height:1.6}`+
    `.pbtn{margin:14px 0;padding:9px 16px;font-size:14px;cursor:pointer;border:1px solid #1F6FEB;background:#1F6FEB;color:#FFFFFF;border-radius:8px}`+
    `@media print{.pbtn{display:none}}</style></head><body>`+
    `<h1>상권 후보지 비교</h1><div class="sub">${new Date().toLocaleDateString('ko-KR')} · 서울 상권 인텔리전스</div>`+
    `<button class="pbtn" onclick="window.print()">인쇄 / PDF로 저장</button>`+
    `<table>`+
    `<tr><td class="h">지점</td>${th}</tr>`+
    `<tr><td class="h">동네 유동인구${hour?' ('+hour+')':''}</td>${cell(s=>s.pop!=null?num(s.pop)+'명':'—')}</tr>`+
    `<tr><td class="h">관심 업종</td>${cell(s=>esc(s.catNm||'—'))}</tr>`+
    `<tr><td class="h">반경 내 경쟁</td>${cell(s=>s.catN!=null?num(s.catN)+'곳':'—')}</tr>`+
    `<tr><td class="h">폐업 2년 추세</td>${cell(s=>s.trend!=null?(s.trend>=0?'+':'')+s.trend+'%':'—')}</tr>`+
    `</table>`+
    `<div class="note">※ 유동인구=행정동 생활인구(${hour||'오후 2시'}). 경쟁=반경 내 카카오 등록 가게 수. 폐업=자치구 2년 증감률. 참고 지표이며 예상 매출이 아닙니다.</div>`+
    `</body></html>`;
  const w=window.open('','_blank');
  if(!w){alert('팝업이 차단됐습니다. 팝업 허용 후 다시 시도하세요.');return;}
  w.document.write(html); w.document.close(); w.focus(); setTimeout(()=>{try{w.print();}catch(e){}},500);
}
function savePin(){
  if(!lastPin||!pinData) return;
  const cat=(pinData.cats||[]).find(c=>c.nm===pinData.chosenName);
  const zcd=pinData.zone?pinData.zone.cd:null;
  const zg=(zcd&&ZC&&ZC.zones)?ZC.zones[zcd]:null;   // 상권 등급·생존개월
  const za=(zcd&&ZA&&ZA.zones)?ZA.zones[zcd]:null;   // 배후 아파트
  const a=loadSaved();
  a.unshift({lat:lastPin.getLat(), lng:lastPin.getLng(),
    label:(pinData.popScope&&pinData.popScope!=='자치구')?pinData.popScope:(pinData.gu||'지점'),
    pop:pinData.popTot, catNm:pinData.chosenName, catN:cat?cat.n:null, trend:pinData.trend,
    gu:pinData.gu||null, store:pinData.store,
    zoneNm:pinData.zone?pinData.zone.nm:null, zoneStores:pinData.zone?pinData.zone.stores:null,
    nearNm:(pinData.near&&pinData.near[0])?pinData.near[0].nm:null,
    nearD:(pinData.near&&pinData.near[0])?pinData.near[0].d:null,
    grade:zg?(zg.ix_nm||zg.ix):null, oprMt:zg?zg.opr:null,
    aptHshld:za?za.hshld:null, aptPrice:za?za.price_eok:null});
  saveSaved(a); renderSaved();
  const b=document.getElementById('pin-save-btn'), t=b.textContent; b.textContent='저장됨'; setTimeout(()=>b.textContent=t,1400);
}

/* ── 업소 검색 ── */
function poiMarker(map,it){
  const pos=new kakao.maps.LatLng(it.y,it.x);
  const mk=new kakao.maps.Marker({position:pos,map});
  kakao.maps.event.addListener(mk,'click',()=>openIW(pos,
    `<b style="font-size:14px">${esc(it.name)}</b><br><span style="color:var(--ink3);font-size:11px">${esc(it.category||'')}</span><br>`+
    `${it.road||it.address?esc(it.road||it.address)+'<br>':''}${it.phone?esc(it.phone)+'<br>':''}`+
    `${it.url?`<a href="${esc(it.url)}" target="_blank" style="color:#1F6FEB">카카오맵 보기</a>`:''}`));
  return mk;
}
function runSearch(){
  const q=document.getElementById('q').value.trim(), box=document.getElementById('results');
  if(!q){box.innerHTML='';return;}
  box.innerHTML='<div class="r c">검색 중…</div>';
  const c=MAP.getCenter();
  kakao({mode:'keyword',query:q,x:c.getLng(),y:c.getLat()}).then(d=>{
    clearMk(searchMk);
    if(!d.ok){box.innerHTML=`<div class="r c" style="color:var(--bad)">${esc(d.error||'검색 실패')}</div>`;return;}
    if(!d.items.length){box.innerHTML='<div class="r c">결과 없음</div>';return;}
    d.items.forEach(it=>searchMk.push(poiMarker(MAP,it)));
    const f=d.items[0]; MAP.panTo(new kakao.maps.LatLng(f.y,f.x)); MAP.setLevel(4);
    box.innerHTML=d.items.map((it,i)=>`<div class="r" data-i="${i}"><b>${esc(it.name)}</b><br><span class="c">${esc(it.category||'')}${it.road?' · '+esc(it.road):''}</span></div>`).join('');
    [...box.querySelectorAll('.r')].forEach(el=>el.onclick=()=>{const it=d.items[+el.dataset.i];analyzePin(new kakao.maps.LatLng(it.y,it.x));MAP.setLevel(4);});
  });
}

function fillGuSelect(){
  const sel=document.getElementById('gu-sel');
  Object.keys(guCenters).sort().forEach(n=>{const o=document.createElement('option');o.value=n;o.textContent=n;sel.appendChild(o);});
  sel.onchange=()=>{const v=sel.value;if(!MAP)return;
    if(v&&guCenters[v]){MAP.panTo(new kakao.maps.LatLng(guCenters[v].lat,guCenters[v].lng));MAP.setLevel(5);}
    else{MAP.panTo(new kakao.maps.LatLng(37.5636,126.9976));MAP.setLevel(8);}};
}
function setStat(){
  const el=document.getElementById('stat'); if(!el)return;
  const p=[];
  p.push(ST&&ST.available&&ST.stations&&ST.stations.length?`역 <b>${num(ST.n_stations)}</b>개`:'역 준비 중');
  p.push(ZONE&&ZONE.available&&ZONE.zones&&ZONE.zones.length?`상권 <b>${num(ZONE.n_zones)}</b>개`:'상권 준비 중');
  p.push(POP&&POP.gu?`유동인구 ${POP.hour}시`:'유동인구 준비 중');
  el.innerHTML=p.join(' · ');
}

function initMap(){
  const el=document.getElementById('map');
  MAP=new kakao.maps.Map(el,{center:new kakao.maps.LatLng(37.5636,126.9976),level:8});
  MAP.addControl(new kakao.maps.ZoomControl(),kakao.maps.ControlPosition.RIGHT);
  drawGuBase(MAP); drawStations(MAP); drawZones(MAP);
  fillGuSelect(); setStat();
  document.getElementById('q-btn').onclick=runSearch;
  document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')runSearch();});
  document.getElementById('ly-station').onchange=e=>stationMk.forEach(m=>m.setMap(e.target.checked?MAP:null));
  document.getElementById('ly-zone').onchange=e=>zoneMk.forEach(m=>m.setMap(e.target.checked?MAP:null));
  // 반경·관심업종을 바꾸면 마지막 핀에 대해 즉시 다시 그림(원·집계 갱신)
  document.getElementById('pin-r').onchange=()=>{ if(lastPin) analyzePin(lastPin); };
  document.getElementById('pin-cat').onchange=()=>{ if(lastPin) analyzePin(lastPin); };
  document.getElementById('pin-insight-btn').onclick=runInsight;
  loadModels();
  document.getElementById('pin-opp-btn').onclick=opportunityAnalysis;
  document.getElementById('pin-share-btn').onclick=shareLink;
  document.getElementById('pin-save-btn').onclick=savePin;
  document.getElementById('cmp-view-btn').onclick=()=>{cmpOpen=!cmpOpen;
    document.getElementById('cmp-view-btn').textContent=cmpOpen?'비교표 접기 ▴':'지점 비교표 보기';
    renderInlineCompare();};
  document.getElementById('pin-report-btn').onclick=reportPrint;
  document.getElementById('cmp-btn').onclick=comparePrint;
  renderSaved();
  // 공유 링크로 들어온 경우: 그 지점 복원
  const q=new URLSearchParams(location.search);
  const qlat=parseFloat(q.get('lat')), qlng=parseFloat(q.get('lng'));
  if(!isNaN(qlat)&&!isNaN(qlng)){
    if(q.get('cat'))document.getElementById('pin-cat').value=q.get('cat');
    if(q.get('r'))document.getElementById('pin-r').value=q.get('r');
    const pos=new kakao.maps.LatLng(qlat,qlng); MAP.setCenter(pos); MAP.setLevel(4); analyzePin(pos);
  }
  // 모바일 하단 시트 접기/펼치기
  const pt=document.getElementById('pan-toggle');
  if(pt) pt.onclick=()=>{const c=document.getElementById('panel').classList.toggle('collapsed');
    pt.innerHTML=c?'정보판 열기 ▴':'정보판 접기 ▾';};
  kakao.maps.event.addListener(MAP,'click',me=>analyzePin(me.latLng));
}
function boot(){
  Promise.all([loadJSON('seoul_gu.geojson'),loadJSON('subway_stations.json'),loadJSON('trade_zones.json'),loadJSON('livepop_gu.json'),loadJSON('parking_gu.json'),loadJSON('storeinfo_gu.json'),loadJSON('distance_decay.json'),loadJSON('livepop_dong.json'),loadJSON('seoul_dong.geojson'),loadJSON('zone_change.json'),loadJSON('zone_apt.json')])
    .then(([g,s,z,p,pk,so,dd,dp,dg,zc,za])=>{GU=g;ST=s;ZONE=z;POP=p;PARK=pk;STORE=so;DD=dd;DONGPOP=dp;DONGGEO=dg;ZC=(zc&&zc.available!==false)?zc:null;ZA=(za&&za.available!==false)?za:null;})
    .finally(()=>{
      if(window.kakao&&kakao.maps){kakao.maps.load(initMap);}
      else{document.getElementById('mapfail').classList.add('on');setStat();}
    });
}
