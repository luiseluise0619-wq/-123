<style>
  /* ── 디자인 토큰 ───────────────────────────────────────────────
     색은 화면 코드에 직접 쓰지 않는다. 테마를 바꾼다는 건 이 값만 바꾸는 것이다.
     --color-* 가 원본이고, 아래 짧은 이름(--accent 등)은 별칭이다.
     별칭을 남겨 둔 이유: 이미 수천 곳이 그 이름을 쓰고 있어서, 한 번에 갈아엎으면
     빠뜨린 곳이 생긴다. 새 코드는 --color-* 를 쓴다.
     사용자가 고른 테마는 <html> 의 인라인 스타일로 --color-* 만 덮어쓴다. */
  :root{
    --color-primary:#087F6B;
    --color-primary-hover:#0F6B59;
    --color-primary-mid:#7FBCAE;
    --color-primary-soft:#E8F5F1;
    --color-background:#FFFFFF;
    --color-surface:#F5F5F7;
    --color-surface-secondary:#EAECEC;
    --color-text-primary:#191F28;
    --color-text-secondary:#4E5968;
    --color-text-muted:#687583;
    --color-border:#EAECEC;
    --color-border-strong:#D2D2D7;
    /* 의미 색 — '+' 라서 초록이 아니라, 사장님에게 좋은 값일 때만 초록이다.
       경쟁 점포가 +30% 인 건 나쁜 값이라 주황/빨강으로 쓴다.
       비교 대상을 구분하는 색(--chart-series-*)과 절대 섞어 쓰지 않는다. */
    --color-positive:#1F7A4D;
    --color-warning:#A8620F;
    --color-negative:#D93025;
    /* 비교 대상 색 — Okabe-Ito 팔레트. 색각 이상에서도 서로 갈린다.
       한 상권은 모든 차트에서 같은 색을 쓴다(logic/rank.js 의 colorSlot). */
    --chart-series-1:#0072B2;
    --chart-series-2:#E69F00;
    --chart-series-3:#009E73;
    --chart-series-4:#CC79A7;
    --chart-series-5:#D55E00;

    --bg:var(--color-background); --bg-blur:rgba(255,255,255,.8);
    --ink:var(--color-text-primary); --ink2:var(--color-text-secondary); --ink3:var(--color-text-muted);
    --line:var(--color-border); --line-strong:var(--color-border-strong); --surface:var(--color-surface);
    --accent:var(--color-primary); --accent-hover:var(--color-primary-hover);
    --accent-2:var(--color-primary-mid); --accent-3:var(--color-primary-soft);
    --selection:var(--color-primary-soft);
    --good:var(--color-positive); --warn:var(--color-warning); --err:var(--color-negative);
    /* 카드 그림자 — 회색 배경 대신 흰 카드 + 얇은 테두리 + 아주 옅은 그림자 */
    --shadow-card:0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.03);
    --shadow-pop:0 12px 32px -12px rgba(16,24,40,.18);
    --r-lg:20px; --r-md:16px; --r-sm:12px;
  }
  /* 다크는 색 반전이 아니다. 같은 뜻의 토큰을 어두운 화면에서 읽히는 값으로 다시 정한다. */
  html[data-theme="dark"]{
    --color-primary:#3FA88F;
    --color-primary-hover:#6FC4AE;
    --color-primary-mid:#2E7565;
    --color-primary-soft:#12332C;
    --color-background:#000000;
    --color-surface:#121214;
    --color-surface-secondary:#1F1F22;
    /* ink3 는 --surface 위에서는 5.4:1 로 충분했지만 --accent-3(선택된 카드) 위에서
       3.98:1 로 떨어져 설명 글자가 흐리게 보였다. 두 배경 모두에서 4.5:1 을 넘기게 올린다. */
    --color-text-primary:#F5F5F7;
    --color-text-secondary:#A8A8AE;
    --color-text-muted:#9A9AA0;
    --color-border:#1F1F22;
    --color-border-strong:#3A3A3E;
    --color-positive:#4E9E6A;
    --color-warning:#C88A3A;
    --color-negative:#FF6B60;
    /* 어두운 배경에서는 같은 팔레트가 가라앉는다 — 밝기만 올린 짝을 쓴다 */
    --chart-series-1:#56B4E9;
    --chart-series-2:#F0B849;
    --chart-series-3:#34C99B;
    --chart-series-4:#E8A0C4;
    --chart-series-5:#F07A3C;
    --bg-blur:rgba(0,0,0,.72);
    --shadow-card:0 1px 2px rgba(0,0,0,.5);
    --shadow-pop:0 12px 32px -12px rgba(0,0,0,.7);
    color-scheme:dark;
  }

  /* 여러 화면에서 되풀이되던 인라인 style 을 이름으로 묶었다. 값은 그대로다. */
  .u-lab{font-size:13px;color:var(--ink2);white-space:nowrap}
  .u-lab-sm{font-size:12.5px;color:var(--ink2);white-space:nowrap}
  .u-lab-p{font-size:13px;color:var(--ink2)}
  .u-note{font-size:11.5px;color:var(--ink3);white-space:nowrap}
  .u-note-t{font-size:11.5px;color:var(--ink3);margin-top:4px;white-space:nowrap}
  /* 좁은 칸(세로 메뉴 옆)에서 쓰는 줄바꿈 되는 주석 — nowrap 이면 화면 밖으로 밀린다 */
  .u-note-w{font-size:11.5px;color:var(--ink3);margin-top:4px;line-height:1.5;text-wrap:pretty}
  .u-note-f{flex:none;font-size:12px;color:var(--ink3);white-space:nowrap}
  .u-lab-f{flex:none;font-size:13px;color:var(--ink2);white-space:nowrap}
  .u-h{font-size:15px;font-weight:600}
  .u-min{min-width:0}
  .u-fill{flex:1;min-width:0}
  .u-fill-e{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .u-fill-n{flex:1;min-width:0;font-size:15.5px;font-weight:500;white-space:nowrap}
  .u-nowrap{white-space:nowrap}
  .u-between{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .u-tap{display:flex;align-items:center;gap:12px;padding:19px 0;cursor:pointer}
  .u-stack{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .u-check{flex:none;color:var(--accent);font-weight:700}
  .u-rule{border-top:1px solid var(--line)}
  .u-sec{padding:56px 0 0}
  .u-sec-lg{padding:64px 0 0}
  .u-sec-b{padding:0 0 30px}
  .u-mt{margin-top:22px}
  html,body{margin:0;padding:0;background:var(--bg);-webkit-font-smoothing:antialiased}
  *{scrollbar-width:thin;scrollbar-color:rgba(0,0,0,.15) transparent}
  ::-webkit-scrollbar{width:4px;height:4px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:4px}
  ::-webkit-scrollbar-button{display:none;width:0;height:0}
  ::-webkit-scrollbar-button:start:decrement,::-webkit-scrollbar-button:end:increment{display:none}
  ::-webkit-scrollbar-corner{background:transparent}
  html[data-theme="dark"] *{scrollbar-color:rgba(255,255,255,.2) transparent}
  html[data-theme="dark"] ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2)}
  body{font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",system-ui,sans-serif;color:var(--ink);word-break:keep-all}
  *{box-sizing:border-box}
  a{color:var(--accent);text-decoration:none}
  a:hover{color:var(--accent-hover)}
  input,button,select{font-family:inherit}
  ::selection{background:var(--selection)}
  @keyframes riseIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes gridIn{to{opacity:1}}
  @keyframes roadX{to{transform:scaleX(1)}}
  @keyframes roadY{to{transform:scaleY(1)}}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* 도시가 계속 지어지고 사라진다 — 요소마다 duration·delay가 달라 같은 장면이 반복되지 않는다 */
  /* 완전히 사라지지 않는다 — 빈 칸이 생기면 간격이 들쭉날쭉해 보인다 */
  @keyframes buildLoop{
    0%{opacity:.22;transform:translateY(8px) scale(.9)}
    16%{opacity:1;transform:translateY(0) scale(1)}
    62%{opacity:1;transform:translateY(0) scale(1)}
    80%{opacity:.22;transform:translateY(7px) scale(.93)}
    100%{opacity:.22;transform:translateY(8px) scale(.9)}
  }
  @keyframes dotLoop{
    0%{opacity:0;transform:scale(.35)}
    16%{opacity:1;transform:scale(1)}
    62%{opacity:1;transform:scale(1)}
    82%{opacity:0;transform:scale(.4)}
    100%{opacity:0;transform:scale(.35)}
  }
  @keyframes driftA{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(16px,-12px,0)}100%{transform:translate3d(0,0,0)}}
  @keyframes driftB{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(-14px,10px,0)}100%{transform:translate3d(0,0,0)}}
  @keyframes driftC{0%{transform:translate3d(0,0,0)}50%{transform:translate3d(10px,14px,0)}100%{transform:translate3d(0,0,0)}}
  @keyframes areaBreathe{0%{opacity:.04}50%{opacity:.09}100%{opacity:.04}}
  /* 가운데에서 나타나 잠시 머물고 제자리로 올라간다 */
  @keyframes heroRise{
    0%{opacity:0;transform:translateY(21vh) scale(.985)}
    22%{opacity:1;transform:translateY(21vh) scale(1)}
    52%{opacity:1;transform:translateY(21vh) scale(1)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  @keyframes lateIn{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}
  @keyframes fadeIn{0%{opacity:0}100%{opacity:1}}
  /* 안 채우고 넘어가려 하면 입력칸이 좌우로 흔들린다.
     같은 이름이면 두 번째 누를 때 다시 안 뛰어서, 번갈아 쓰는 쌍으로 둔다. */
  @keyframes shakeA{0%,100%{transform:none}15%{transform:translateX(-7px)}30%{transform:translateX(6px)}45%{transform:translateX(-4px)}60%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
  @keyframes shakeB{0%,100%{transform:none}15%{transform:translateX(-7px)}30%{transform:translateX(6px)}45%{transform:translateX(-4px)}60%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
  @media (prefers-reduced-motion:reduce){
    @keyframes shakeA{0%,100%{transform:none}}
    @keyframes shakeB{0%,100%{transform:none}}
  }
  @keyframes botIn{0%{opacity:0;transform:translateY(16px) scale(.98)}100%{opacity:1;transform:none}}
  @keyframes gridBreathe{0%{opacity:.55}50%{opacity:.9}100%{opacity:.55}}
  @media (prefers-reduced-motion:reduce){[aria-hidden="true"] *{animation:none!important;opacity:1!important;transform:none!important}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>

<div style="min-height:100vh;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.6;letter-spacing:-0.011em">

  <a class="skip-link" href="#main-content">본문으로 바로가기</a>
  <header style="{{ headerStyle }}">
    <div style="{{ headerInner }}">
      <div role="button" tabIndex="0" onClick="{{ goHome }}" style="font-size:15px;font-weight:700;letter-spacing:-0.02em;flex:none;cursor:pointer;white-space:nowrap">MYSBIZON</div>
      <nav style="display:flex;gap:2px;align-items:center;flex:1 1 auto;min-width:0">
        <sc-for list="{{ nav }}" as="n">
          <div style="position:relative;flex:0 1 auto;min-width:0;overflow:hidden">
            <span role="button" tabIndex="0" onClick="{{ n.open }}" style="{{ n.style }}">{{ n.label }}</span>
            <sc-if value="{{ n.isOpen }}">
              <div style="position:absolute;left:0;top:40px;z-index:30;min-width:184px;background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 28px rgba(0,0,0,.12);padding:6px">
                <sc-for list="{{ n.items }}" as="i">
                  <div role="button" tabIndex="0" onClick="{{ i.go }}" style="{{ i.style }}">{{ i.label }}</div>
                </sc-for>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </nav>
      <!-- 언어·밝기·테마는 전부 ⚙ 안에 있다(§11). 헤더에 따로 내지 않는다. -->
      <span role="button" tabIndex="0" aria-label="설정" onClick="{{ openSettings }}" style="{{ settingsBtn }}">⚙</span>
    </div>
  </header>

  <main id="main-content" style="{{ mainStyle }}">
