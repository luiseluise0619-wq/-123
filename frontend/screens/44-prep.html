    <!-- 창업 준비 · 계약 전부터 오픈 직전까지 -->
    <sc-if value="{{ onPrep }}">
      <section style="padding:54px 0 70px;max-width:980px">
        <div style="font-size:13px;color:var(--accent-text);font-weight:600">{{ prep.eyebrow }} · {{ prep.place }}</div>
        <h1 style="{{ ds1 }};margin-top:8px">{{ prep.title }}</h1>
        <p style="{{ dsBody }};margin-top:10px;max-width:720px">{{ prep.sub }}</p>

        <div style="margin-top:26px;max-width:620px">
          <div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline">
            <strong style="font-size:18px">{{ prep.progress }}</strong>
            <span style="font-size:12px;color:var(--ink3)">{{ prep.progressDetail }}</span>
          </div>
          <div style="height:8px;border-radius:999px;background:var(--surface);margin-top:10px"><span style="{{ prep.progressBar }}"></span></div>
        </div>

        <div style="display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:40px;margin-top:42px" class="prep-grid">
          <div>
            <sc-for list="{{ prep.groups }}" as="g">
              <section style="padding:0 0 36px">
                <h2 style="font-size:20px;letter-spacing:-.025em;margin:0 0 8px">{{ g.title }}</h2>
                <sc-for list="{{ g.items }}" as="i">
                  <div style="display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-top:1px solid var(--line)">
                    <button aria-pressed="{{ i.checked }}" onClick="{{ i.toggle }}" style="{{ i.checkStyle }}">{{ i.checkText }}</button>
                    <div style="min-width:0;flex:1">
                      <div style="font-size:15px;font-weight:650">{{ i.label }}</div>
                      <div style="font-size:12.5px;color:var(--ink3);line-height:1.5;margin-top:3px">{{ i.detail }}</div>
                      <sc-if value="{{ i.source }}"><a href="{{ i.source.url }}" target="_blank" rel="noopener noreferrer" style="display:inline-flex;margin-top:5px;font-size:12px">{{ i.source.label }}</a></sc-if>
                    </div>
                  </div>
                </sc-for>
              </section>
            </sc-for>
          </div>

          <aside>
            <h2 style="font-size:20px;letter-spacing:-.025em;margin:0 0 8px">{{ prep.adviceTitle }}</h2>
            <sc-for list="{{ prep.advice }}" as="a">
              <div style="padding:17px 0;border-top:1px solid var(--line)">
                <div style="font-size:15px;font-weight:700">{{ a.title }}</div>
                <div style="font-size:12.5px;color:var(--ink2);line-height:1.55;margin-top:6px">{{ a.basis }}</div>
                <div style="font-size:13.5px;line-height:1.55;margin-top:7px">{{ a.action }}</div>
              </div>
            </sc-for>
            <p style="font-size:12px;color:var(--warn);line-height:1.55;margin-top:18px">{{ prep.caution }}</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px">
              <button onClick="{{ prep.goMap }}" style="{{ dsCta }}">{{ prep.mapCta }}</button>
              <button onClick="{{ prep.goBep }}" style="{{ dsGhost }}">{{ prep.bepCta }}</button>
              <button onClick="{{ prep.goCompare }}" style="{{ dsGhost }}">{{ prep.compareCta }}</button>
            </div>
          </aside>
        </div>
      </section>
    </sc-if>
