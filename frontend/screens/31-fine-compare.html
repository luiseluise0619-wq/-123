    <!-- 정밀비교 -->
    <sc-if value="{{ onFineCmp }}">
      <section class="u-sec-lg">
        <div class="u-lab">{{ fc.ind }} · 정밀비교</div>
        <h1 style="font-size:clamp(22px,3.4vw,34px);font-weight:700;letter-spacing:-0.025em;line-height:1.25;margin:10px 0 0;text-wrap:pretty">{{ fc.lead }}</h1>
        <p style="font-size:14.5px;color:var(--ink2);margin:10px 0 0;text-wrap:pretty">한 자치구 안의 동네를 빠짐없이 훑어요. 내가 담은 것만 보는 비교분석과 달라요.</p>

        <div style="margin-top:24px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span class="u-lab">업종</span>
          <select value="{{ indSel }}" onChange="{{ onIndSel }}" style="{{ selectStyle }}">
            <sc-for list="{{ indOptions }}" as="o">
              <option value="{{ o.raw }}">{{ o.label }}</option>
            </sc-for>
          </select>
          <span class="u-lab">자치구</span>
          <select value="{{ fc.gu }}" onChange="{{ fc.onGu }}" style="{{ selectStyle }}">
            <sc-for list="{{ fc.guOptions }}" as="g">
              <option value="{{ g }}">{{ g }}</option>
            </sc-for>
          </select>
        </div>

        <sc-if value="{{ fc.hasMed }}">
          <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:22px;flex-wrap:wrap">
            <span class="u-lab-sm">이 자치구 중앙값 <b style="font-variant-numeric:tabular-nums">{{ fc.medLabel }}</b></span>
            <span style="font-size:12px;color:var(--ink3);white-space:nowrap">가게 한 곳이 한 달에 파는 돈</span>
          </div>
        </sc-if>
        <div data-anim="1" style="margin-top:10px">
          <sc-for list="{{ fc.rows }}" as="r">
            <div role="button" tabIndex="0" onClick="{{ r.pick }}" style="{{ r.row }}" style-hover="background:var(--surface)">
              <span style="flex:none;width:20px;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums">{{ r.rank }}</span>
              <span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
                <span style="font-size:15.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.name }}</span>
                <span style="display:block;height:5px;border-radius:3px;background:var(--surface);overflow:hidden">
                  <span style="{{ r.bar }}"></span>
                </span>
                <span style="display:flex;align-items:baseline;gap:10px;min-width:0">
                  <span style="{{ r.storeStyle }}">가게 {{ r.storeTag }}</span>
                  <span style="{{ r.vsStyle }}">{{ r.vsMed }}</span>
                </span>
              </span>
              <span style="flex:none;width:96px;text-align:right;font-size:14.5px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap">{{ r.per }}</span>
            </div>
          </sc-for>
        </div>
        <p style="font-size:12.5px;color:var(--ink3);margin:30px 0 0;max-width:700px;text-wrap:pretty">{{ fc.note }}</p>
      </section>
    </sc-if>
