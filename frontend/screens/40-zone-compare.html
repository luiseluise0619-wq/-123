    <!-- 지역비교 (자치구) -->
    <sc-if value="{{ onZoneCmp }}">
      <section class="u-sec-lg">
        <div class="u-lab">자치구 비교</div>
        <h1 style="font-size:clamp(22px,3.4vw,34px);font-weight:700;letter-spacing:-0.025em;line-height:1.15;margin:10px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ zc.lead }}</h1>

        <div style="margin-top:22px;display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <span class="u-lab">업종</span>
          <select value="{{ indSel }}" onChange="{{ onIndSel }}" style="{{ selectStyle }}">
            <sc-for list="{{ indOptions }}" as="o">
              <option value="{{ o.raw }}">{{ o.label }}</option>
            </sc-for>
          </select>
        </div>

        <div style="display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:34px">
          <span style="font-size:15px;font-weight:600;white-space:nowrap">자치구별로 보기</span>
          <span style="font-size:12.5px;color:var(--ink3);white-space:nowrap">{{ zc.medNote }}</span>
        </div>
        <div style="{{ zc.cardsWrap }}">
          <sc-for list="{{ zc.cards }}" as="c">
            <div style="{{ c.style }}">
              <div style="display:flex;align-items:baseline;gap:8px">
                <span style="font-size:11.5px;font-weight:700;color:var(--ink3);font-variant-numeric:tabular-nums">{{ c.rank }}</span>
                <span style="flex:1;min-width:0;font-size:17px;font-weight:700;letter-spacing:-0.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ c.gu }}</span>
              </div>
              <div style="font-size:26px;font-weight:700;letter-spacing:-0.03em;margin-top:14px;font-variant-numeric:tabular-nums;white-space:nowrap">{{ c.per }}</div>
              <div class="u-note-t">가게 한 곳당 월매출 (추정)</div>
              <div style="position:relative;height:6px;border-radius:3px;background:var(--bg);margin-top:12px">
                <span style="display:block;height:100%;border-radius:3px;overflow:hidden"><span style="{{ c.bar }}"></span></span>
                <span style="{{ zc.medLine }}"></span>
              </div>
              <div style="font-size:12.5px;font-weight:600;color:var(--accent);margin-top:10px;text-wrap:pretty">{{ c.verdict }}</div>
              <div style="display:flex;flex-direction:column;gap:9px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
                <sc-for list="{{ c.facts }}" as="f">
                  <div class="u-min">
                    <div style="display:flex;align-items:baseline;gap:10px">
                      <span style="flex:1;min-width:0;font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ f.label }}</span>
                      <span style="flex:none;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap">{{ f.value }}</span>
                    </div>
                    <sc-if value="{{ f.tag }}">
                      <div style="font-size:11.5px;color:var(--ink3);margin-top:3px;text-wrap:pretty">{{ f.tag }}</div>
                    </sc-if>
                  </div>
                </sc-for>
              </div>
            </div>
          </sc-for>
        </div>

        <div style="margin-top:36px;display:flex;align-items:center;gap:20px;flex-wrap:wrap">
          <button onClick="{{ goFind }}" style="{{ ctaPrimary }}">동네까지 좁혀 보기</button>
        </div>
        <p style="font-size:12.5px;color:var(--ink3);margin:32px 0 0;max-width:660px;text-wrap:pretty">{{ zc.note }}</p>
      </section>
    </sc-if>
