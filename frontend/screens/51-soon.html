    <!-- 미완성 화면 -->
    <sc-if value="{{ onSoon }}">
      <section style="padding:96px 0 0;max-width:600px">
        <h1 style="font-size:clamp(26px,4vw,40px);font-weight:600;letter-spacing:-0.03em;line-height:1.06;margin:0;white-space:nowrap">{{ soon.title }}</h1>
        <p style="font-size:17px;color:var(--ink2);margin:16px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ soon.sub }}</p>
        <p style="font-size:15px;color:var(--ink2);margin:32px 0 0;text-wrap:pretty">{{ soon.note }}</p>
        <div style="margin-top:44px">
          <button onClick="{{ goFind }}" style="font-size:16px;font-weight:500;color:#FFFFFF;background:var(--accent);border:none;border-radius:999px;padding:0 30px;height:52px;cursor:pointer;transition:opacity .16s" style-hover="opacity:.86">후보지 찾기로</button>
        </div>
      </section>
    </sc-if>
