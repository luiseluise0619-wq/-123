    <!-- 시세분석 — 왼쪽 세로 메뉴 하나 선택 → 오른쪽에 핵심 수치 + 차트 여러 개 -->
    <sc-if value="{{ onPrice }}">
      <section class="u-sec">
        <h1 style="{{ ds1 }}">시세분석</h1>
        <p style="{{ dsBody }}; margin-top:10px;max-width:640px">임대료와 매출이 어디로 가고 있는지 볼 수 있어요.</p>

        <div style="display:grid;gap:20px;grid-template-columns:{{ navCols }};margin-top:28px">
          <nav aria-label="볼 지표 고르기" style="{{ pr.navStyle }}">
            <sc-for list="{{ pr.nav }}" as="n">
              <span role="button" tabIndex="0" aria-pressed="{{ n.on }}" onClick="{{ n.pick }}" style="{{ n.style }}">
                <span style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ n.label }}</span>
                <span style="{{ n.whenStyle }}">{{ n.when }}</span>
              </span>
            </sc-for>
          </nav>

          <div style="min-width:0">
            <!-- 핵심 수치 -->
            <div style="{{ dsCardHi }}">
              <div class="u-lab-sm">{{ pr.title }}</div>
              <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-top:8px">
                <span style="{{ dsNum }}">{{ pr.now }}</span>
                <span style="{{ pr.deltaStyle }}">{{ pr.delta }}</span>
              </div>
              <div class="u-note-t">{{ pr.nowLabel }}</div>
            </div>

            <!-- 차트 여러 개 — 옆으로 넘겨 본다 -->
            <sc-if value="{{ pr.hasCharts }}">
              <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:24px">
                <h2 style="{{ ds3 }}">{{ pr.catLabel }} 차트</h2>
                <sc-if value="{{ pr.rail.arrows }}">
                  <span style="display:flex;gap:8px">
                    <span role="button" tabIndex="0" aria-label="이전 차트" onClick="{{ pr.rail.prev }}" style="{{ pr.rail.arrowStyle }}" style-hover="background:var(--line-strong)">←</span>
                    <span role="button" tabIndex="0" aria-label="다음 차트" onClick="{{ pr.rail.next }}" style="{{ pr.rail.arrowStyle }}" style-hover="background:var(--line-strong)">→</span>
                  </span>
                </sc-if>
              </div>
              <div data-rail="price" style="{{ pr.rail.trackStyle }}">
                <sc-for list="{{ pr.charts }}" as="c">
                  <div style="{{ pr.rail.itemStyle }}">
                    <div style="{{ c.style }}">
                      <div style="font-size:15px;font-weight:700">{{ c.title }}</div>
                      <sc-if value="{{ c.hasSub }}">
                        <div class="u-note-t">{{ c.sub }}</div>
                      </sc-if>
                      <div style="position:relative;margin-top:14px;height:{{ c.height }}">
                        <canvas data-chart="{{ c.id }}" role="img" aria-label="{{ c.title }}"></canvas>
                      </div>
                      <sc-if value="{{ c.hasPeriod }}">
                        <div class="u-note" style="margin-top:10px">기준 {{ c.period }}</div>
                      </sc-if>
                    </div>
                  </div>
                </sc-for>
              </div>
            </sc-if>

            <!-- 지역·업종 목록 — 누르면 위 수치와 차트가 그 대상으로 바뀐다 -->
            <sc-if value="{{ pr.hasList }}">
              <div style="margin-top:26px">
                <div class="u-h">{{ pr.listTitle }}</div>
                <div style="margin-top:10px;max-height:300px;overflow-y:auto;padding-right:6px;display:flex;flex-direction:column;gap:2px">
                  <sc-for list="{{ pr.list }}" as="r">
                    <div role="button" tabIndex="0" onClick="{{ r.pick }}" style="{{ r.style }}" style-hover="background:var(--surface)">
                      <span class="u-fill-e">{{ r.name }}</span>
                      <span class="u-note-f">{{ r.meta }}</span>
                      <span style="flex:none;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap">{{ r.value }}</span>
                    </div>
                  </sc-for>
                </div>
              </div>
            </sc-if>

            <p style="{{ dsSub }}; margin-top:22px">{{ pr.note }}</p>
          </div>
        </div>
      </section>
    </sc-if>
