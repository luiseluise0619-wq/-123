<style>

function scatterSVG(){
  const S=R.scatter,W=680,H=300,pl=58,pb=40,pt=16,pr=16,cw=W-pl-pr,ch=H-pb-pt;
  const xmax=Math.max(...S.pts.map(p=>p.x),S.me.x)*1.05,ymax=Math.max(...S.pts.map(p=>p.y),S.me.y)*1.05;
  const X=v=>pl+v/xmax*cw,Y=v=>pt+ch-v/ymax*ch;
  let g='';for(let k=0;k<=4;k++){const gy=pt+ch*k/4,gx=pl+cw*k/4;
    g+=`<line x1="${pl}" y1="${gy}" x2="${W-pr}" y2="${gy}" stroke="var(--line)"/>
        <text x="${pl-8}" y="${gy+3}" font-size="8.5" fill="var(--cap)" text-anchor="end" font-family="var(--mono)">${won(ymax*(1-k/4))}</text>
        <text x="${gx}" y="${H-22}" font-size="8.5" fill="var(--cap)" text-anchor="middle" font-family="var(--mono)">${Math.round(xmax*k/4)}</text>`;}
  g+=`<line x1="${X(S.xmed)}" y1="${pt}" x2="${X(S.xmed)}" y2="${pt+ch}" stroke="var(--dash)" stroke-dasharray="3 3"/>
      <line x1="${pl}" y1="${Y(S.ymed)}" x2="${W-pr}" y2="${Y(S.ymed)}" stroke="var(--dash)" stroke-dasharray="3 3"/>`;
  const dots=S.pts.map(p=>`<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="2.4" fill="#8E9BDD" opacity="0.45"/>`).join('');
  const mx=X(S.me.x),my=Y(S.me.y);
  const me=`<circle cx="${mx}" cy="${my}" r="7" fill="none" stroke="#D6455A" stroke-width="2"/><circle cx="${mx}" cy="${my}" r="3.5" fill="#D6455A"/><text x="${mx}" y="${my-11}" font-size="10.5" fill="#D6455A" font-weight="700" text-anchor="middle">이 상권</text>`;
  const lab=`<text x="${pl+cw/2}" y="${H-4}" font-size="10" fill="var(--sub)" text-anchor="middle">점포 수 →</text><text x="13" y="${pt+ch/2}" font-size="10" fill="var(--sub)" text-anchor="middle" transform="rotate(-90 13 ${pt+ch/2})">점포당 월매출 →</text>`;
  return `<svg viewBox="0 0 ${W} ${H}">${g}${dots}${me}${lab}</svg>`;
}
function radarSVG(){
  const D=R.radar,S=250,cx=S/2,cy=S/2,Rr=82,n=D.length;
  let rings='';for(let ring=1;ring<=4;ring++){let pts='';for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;pts+=`${cx+Math.cos(a)*Rr*ring/4},${cy+Math.sin(a)*Rr*ring/4} `}rings+=`<polygon points="${pts}" fill="none" stroke="var(--line)"/>`}
  const poly=(key,color,fill)=>{let p='';D.forEach((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,rr=Rr*Math.max(.03,d[key]);p+=`${cx+Math.cos(a)*rr},${cy+Math.sin(a)*rr} `});return `<polygon points="${p}" fill="${fill}" stroke="${color}" stroke-width="2"/>`;};
  let labels='';D.forEach((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/n;labels+=`<text x="${cx+Math.cos(a)*(Rr+15)}" y="${cy+Math.sin(a)*(Rr+15)}" font-size="9.5" fill="var(--sub)" text-anchor="middle" dominant-baseline="middle">${d.ax}</text>`});
  return `<svg viewBox="0 0 ${S} ${S}" style="max-width:290px;margin:2px auto">${rings}${poly('sim','#A5AABB','#A5AABB30')}${poly('me','#4338CA','#4338CA24')}${labels}</svg>`;
}
function donutSVG(pct,color){

}
