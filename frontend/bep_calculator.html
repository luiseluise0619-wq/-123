<title>손익분기 계산기 — 사장님인사이트</title>
<style>
  :root{
    --bg:#EDEEF2; --card:#FBFBFD; --card2:#E1E3EB; --ink:#13141B; --sub:#3C4152; --cap:#7A8096; --dim:#A5AABB;
    --line:#DADDE7; --dash:#CFD3DE; --accent:#4338CA; --accent2:#6366F1; --cta:#F0A23C;
    --up:#D6455A; --dn:#2E9E6B; --darkline:#272A3A; --darktrack:#20222F;
    --serif:"Noto Serif KR",Georgia,"Apple SD Gothic Neo",serif;
    --sans:"Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  @media(prefers-color-scheme:dark){:root{--bg:#15161D;--card:#1B1D26;--card2:#22242F;--ink:#EDEEF2;--sub:#B9BECC;--cap:#8990A2;--dim:#5F6676;--line:#2C2F3C;--dash:#333747;}}
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.65;word-break:keep-all;overflow-wrap:break-word;-webkit-font-smoothing:antialiased}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .top{background:var(--ink);color:#EDEEF2;padding:10px 20px;display:flex;align-items:center;gap:10px}
  .top .logo{font-family:var(--serif);font-weight:700;font-size:15px} .top .date{font-family:var(--mono);font-size:11px;opacity:.45;margin-left:auto}
  .top .tab{background:var(--cta);color:#13141B;font-weight:700;font-size:11px;padding:4px 10px;border-radius:999px}
  .wrap{max-width:1120px;margin:0 auto;padding:26px 20px 70px}
  .eyebrow{font-size:11.5px;font-weight:700;color:var(--accent);letter-spacing:.1em;text-transform:uppercase}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(26px,4vw,38px);margin:8px 0 6px;line-height:1.25}
  .lede{color:var(--sub);font-size:14.5px;margin:0 0 22px;max-width:62ch}
  .lede b{color:var(--dn)}
  .grid{display:grid;grid-template-columns:.85fr 1.15fr;gap:20px} @media(max-width:900px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px}
  .panel h2{font-family:var(--serif);font-size:17px;font-weight:700;margin:0 0 14px}
  .fld{margin-bottom:13px} .fld:last-child{margin-bottom:0}
  .fld label{display:block;font-size:12.5px;color:var(--sub);font-weight:600;margin-bottom:5px}
  .fld label .auto{float:right;font-weight:500;font-size:10.5px;color:var(--accent);background:#4338CA14;padding:1px 7px;border-radius:999px}
  .fld input,.fld select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:11px;background:var(--card2);color:var(--ink);font-size:14px;font-family:var(--sans)}
  .fld input[type=number]{font-family:var(--mono)}
  .fld input:focus,.fld select:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .unit{position:relative} .unit .u{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--dim);font-family:var(--mono);pointer-events:none}
  .unit input{padding-right:38px}
  /* result */
  .verdict{display:flex;align-items:center;gap:12px;padding:15px 17px;border-radius:14px;margin-bottom:16px;border:1px solid var(--line)}
  .verdict .badge{font-family:var(--serif);font-weight:700;font-size:19px;padding:6px 14px;border-radius:999px;color:#fff;white-space:nowrap}
  .verdict .why{font-size:13px;color:var(--sub);line-height:1.5}
  .verdict .why b{color:var(--ink)}
  .big{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
  .stat{background:var(--card2);border:1px solid var(--line);border-radius:13px;padding:13px 15px}
  .stat .l{font-size:11.5px;color:var(--cap)} .stat .v{font-family:var(--mono);font-size:24px;font-weight:600;letter-spacing:-.01em;margin-top:3px}
  .stat .v small{font-size:13px;color:var(--sub);font-weight:400}
  .stat.hero{background:var(--ink);border-color:var(--ink)} .stat.hero .l{color:#A5AABB} .stat.hero .v{color:#EDEEF2}
  .distro{margin:4px 0 16px} .distro .t{font-size:12px;font-weight:600;color:var(--sub);margin-bottom:7px}
  .distwrap{position:relative;height:56px}
  svg{display:block;width:100%;overflow:visible} text{font-family:var(--sans)}
  .mini{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mini .stat .v{font-size:19px}
  .risk{margin-top:14px;font-size:12px;padding:11px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line);color:var(--sub)}
  .risk b{color:var(--up)}
  .honest{margin-top:16px;font-size:11.5px;color:var(--cap);line-height:1.7;border-top:1px dashed var(--dash);padding-top:12px}
  .honest b{color:var(--sub)}
  .tag{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px;background:#2E9E6B1a;color:var(--dn)}
</style>

<div class="top"><span class="logo">사장님인사이트</span><span class="tab">상권데이터</span><span class="date" id="date"></span></div>
<div class="wrap">
  <div class="eyebrow">계산 · 오차 0</div>
  <h1>여기, 손익분기 넘길 수 있나</h1>
  <p class="lede">임대료·평수·원가율만 넣으면 <b>살아남으려면 상위 몇 %</b>에 들어야 하는지 계산합니다. 예측이 아니라 산수 — 임대료는 <span class="tag">부동산원 실데이터</span>, 매출 분포는 서울 상권 실측입니다.</p>

  <div class="grid">
    <!-- 입력 -->
    <div class="panel">
      <h2>내 조건 입력</h2>
      <div class="fld"><label>업종</label><select id="ind"></select></div>
      <div class="fld"><label>상권 (임대료 자동)</label><select id="sang"></select></div>
      <div class="row2">
        <div class="fld"><label>평수</label><div class="unit"><input type="number" id="area" value="15"><span class="u">평</span></div></div>
        <div class="fld"><label>월 임대료 <span class="auto" id="rentauto">자동</span></label><div class="unit"><input type="number" id="rent"><span class="u">만원</span></div></div>
      </div>
      <div class="row2">
        <div class="fld"><label>월 인건비</label><div class="unit"><input type="number" id="labor" value="250"><span class="u">만원</span></div></div>
        <div class="fld"><label>기타 고정비</label><div class="unit"><input type="number" id="etc" value="80"><span class="u">만원</span></div></div>
      </div>
      <div class="row2">
        <div class="fld"><label>원가율 <span class="auto">업종값</span></label><div class="unit"><input type="number" id="cogs"><span class="u">%</span></div></div>
        <div class="fld"><label>객단가 <span class="auto">업종값</span></label><div class="unit"><input type="number" id="unit"><span class="u">원</span></div></div>
      </div>
      <div class="row2">
        <div class="fld"><label>월 영업일수</label><div class="unit"><input type="number" id="days" value="26"><span class="u">일</span></div></div>
        <div class="fld"><label>가져갈 월수입</label><div class="unit"><input type="number" id="goal" value="300"><span class="u">만원</span></div></div>
      </div>
      <div class="fld"><label>초기투자 (권리금+인테리어+보증금)</label><div class="unit"><input type="number" id="invest" value="10000"><span class="u">만원</span></div></div>
    </div>

    <!-- 결과 -->
    <div class="panel">
      <h2>계산 결과</h2>
      <div class="verdict" id="verdict"></div>
      <div class="big">
        <div class="stat hero"><div class="l">월 손익분기 매출</div><div class="v" id="bep"></div></div>
        <div class="stat"><div class="l">하루 필요 손님</div><div class="v" id="cust"></div></div>
      </div>
      <div class="distro">
        <div class="t" id="distt"></div>
        <div class="distwrap"><div id="dist"></div></div>
      </div>
      <div class="mini">
        <div class="stat"><div class="l">목표수입까지 필요 월매출</div><div class="v" id="goalrev"></div></div>
        <div class="stat"><div class="l">초기투자 회수기간</div><div class="v" id="payback"></div></div>
      </div>
      <div class="risk" id="risk"></div>
      <div class="honest" id="honest"></div>
    </div>
  </div>
</div>

  // 공실률 위험
  const vac=r&&r.vacancy;
  $('#risk').innerHTML=vac!=null?`이 상권 공실률 <b>${vac}%</b>${vac>=10?' — 높음, 빠져나가는 자리 주의':vac>=6?' — 보통':' — 낮음(안정)'} · 임대료 ${r.rent}천원/㎡ (부동산원 ${DA.quarter})`:'';
  $('#honest').innerHTML=`<b>정직 고지</b> · 이 매출 분포는 <b>지금 영업 중인 가게</b> 기준입니다 — 이미 폐업한 가게는 빠져 실제보다 낙관적입니다. 그래서 신규점은 중앙값(${won(x.p50)})이 아니라 <b>하위권(p40 ${won(x.p40)})</b>에서 시작한다고 보수적으로 보세요. 임대료=부동산원 상권 평균(개별 점포·층 다름). 이 계산은 '될 자리인가' 판단용이지 매출 보장이 아닙니다.`;
}
function pctBelow(x,bep){ // 손익분기 미달 비율(%) — 5분위 보간
  const pts=[[0,x.p25*.7],[25,x.p25],[40,x.p40],[50,x.p50],[75,x.p75],[90,x.p90],[100,x.p90*1.4]];
  for(let i=1;i<pts.length;i++){if(bep<=pts[i][1]){const [a,av]=pts[i-1],[b,bv]=pts[i];return Math.round(a+(b-a)*(bep-av)/((bv-av)||1));}}
  return 98;
}
function verdict(x,bep){
  if(bep<=x.p40) return {label:'들어가도 됩니다',col:'#2E9E6B',bg:'#2E9E6B14',why:'신규점 기대치(하위권)로도 손익분기를 넘깁니다.'};
  if(bep<=x.p50) return {label:'조건부',col:'#C2871B',bg:'#C2871B14',why:'평균은 넘지만 신규점엔 빠듯 — 초기 몇 달 버틸 자금 필요.'};
  return {label:'위험합니다',col:'#D6455A',bg:'#D6455A14',why:'절반 이상이 이 손익분기에 미달 — 신규점은 더 어렵습니다.'};
}
function drawDist(x,bep){
  const W=520,H=52,pl=6,pr=6,cw=W-pl-pr;
  const lo=x.p25*.6,hi=x.p90*1.25,X=v=>pl+Math.max(0,Math.min(1,(v-lo)/(hi-lo)))*cw;
  const seg=(a,b,c)=>`<rect x="${X(a)}" y="18" width="${Math.max(1,X(b)-X(a))}" height="14" fill="${c}" rx="2"/>`;
  const bx=X(bep);
  let s=seg(lo,x.p25,'#DADDE7')+seg(x.p25,x.p50,'#B7C0E8')+seg(x.p50,x.p75,'#8E9BDD')+seg(x.p75,hi,'#6366F1');
  // 손익분기 마커 + 미달/여유 라벨
  s+=`<rect x="${pl}" y="18" width="${Math.max(0,bx-pl)}" height="14" fill="#D6455A" opacity="0.16"/>`;
  s+=`<line x1="${bx}" y1="10" x2="${bx}" y2="40" stroke="#D6455A" stroke-width="2.5"/>
      <text x="${bx}" y="8" font-size="10.5" fill="#D6455A" font-weight="700" text-anchor="middle" font-family="var(--mono)">손익분기</text>`;
  [['p25',x.p25],['중앙',x.p50],['p75',x.p75]].forEach(([l,v])=>{s+=`<text x="${X(v)}" y="46" font-size="9" fill="var(--cap)" text-anchor="middle" font-family="var(--mono)">${(v/10000).toFixed(v>=10000?1:0)}${v>=10000?'억':'만'}</text>`});
  $('#dist').innerHTML=`<svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
}
si.onchange=()=>{curInd=si.value;fillAuto();calc()};
ss.onchange=()=>{curSang=ss.value;fillAuto();calc()};
['area','rent','labor','etc','cogs','unit','days','goal','invest'].forEach(id=>$('#'+id).oninput=calc);
$('#area').addEventListener('input',()=>{fillAuto();calc()});
// init
ss.value=curSang;fillAuto();calc();
</script>
