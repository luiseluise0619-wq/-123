<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>지역 선택 · 상권 인텔리전스</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231F6FEB'/%3E%3Crect x='8' y='16' width='4' height='9' rx='1.2' fill='white'/%3E%3Crect x='14' y='11' width='4' height='14' rx='1.2' fill='white'/%3E%3Crect x='20' y='7' width='4' height='18' rx='1.2' fill='white'/%3E%3C/svg%3E">
<style>
  :root{ --bg:#0F1826; --panel:#132033; --line:#22334d; --ink:#eaf1fb; --mut:#93a7c4; --accent:#2A78D6; --soft:#0b1420; --fill:#22406b; --fillOn:#2A78D6; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.55}
  .wrap{max-width:900px;margin:0 auto;padding:40px 20px 80px}
  h1{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
  .sub{color:var(--mut);font-size:14px;margin:0 0 28px}
  .step{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.05em;margin-bottom:8px}

  /* 1단계: 지역 카드 */
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px 20px;cursor:pointer;transition:.15s;text-align:left}
  .card:hover{border-color:var(--accent);transform:translateY(-2px)}
  .card.on{border-color:var(--accent);background:#16263f}
  .card h2{margin:0 0 4px;font-size:18px}
  .card p{margin:0;color:var(--mut);font-size:12.5px}

  /* 지도 */
  .maparea{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:22px}
  svg.map{width:100%;height:auto;display:block}
  svg.map path{fill:var(--fill);stroke:var(--bg);stroke-width:1.2;transition:fill .15s;cursor:pointer}
  svg.map path:hover{fill:var(--fillOn)}
  svg.map path.on{fill:var(--fillOn)}
  svg.map text{fill:var(--ink);font-size:9px;text-anchor:middle;pointer-events:none;font-weight:600;paint-order:stroke;stroke:var(--bg);stroke-width:2.5px}

  .bar{display:flex;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
  button{cursor:pointer;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-size:15px;font-weight:700}
  button.sec{background:var(--soft);border:1px solid var(--line);color:var(--ink);font-weight:500}
  button:disabled{opacity:.4;cursor:default}
  .hint{color:var(--mut);font-size:13px}

  /* 3단계: 시군구 목록 */
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .chip{background:var(--soft);border:1px solid var(--line);border-radius:20px;padding:7px 14px;font-size:13px;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .count{color:var(--mut);font-size:13px;margin-top:6px}
  .hide{display:none}
</style>
</head>
<body>
<div class="wrap">
  <h1>어느 지역을 볼까요?</h1>
  <p class="sub">지역을 고르면 지도를 보여드리고, 확인을 누르면 그 지역의 구·군으로 들어갑니다.</p>

  <!-- 1단계: 지역 선택 -->
  <div id="s1">
    <div class="step">STEP 1 · 지역 선택</div>
    <div class="cards" id="cards"></div>
  </div>

  <!-- 2단계: 지도 미리보기 -->
  <div id="s2" class="hide">
    <div class="step">STEP 2 · 지도 확인</div>
    <div class="maparea">
      <div id="mapTitle" style="font-size:17px;font-weight:700;margin-bottom:10px"></div>
      <svg class="map" id="svg" viewBox="0 0 700 520" preserveAspectRatio="xMidYMid meet"></svg>
    </div>
    <div class="bar">
      <button class="sec" onclick="back()">← 다시 선택</button>
      <button id="okBtn" onclick="confirmRegion()">이 지역으로 확인 →</button>
      <span class="hint" id="s2hint"></span>
    </div>
  </div>

  <!-- 3단계: 시군구 목록 -->
  <div id="s3" class="hide">
    <div class="step">STEP 3 · 구·군 선택</div>
    <div class="maparea">
      <div id="detTitle" style="font-size:17px;font-weight:700;margin-bottom:4px"></div>
      <div class="count" id="detCount"></div>
      <div class="chips" id="chips"></div>
    </div>
    <div class="bar"><button class="sec" onclick="back2()">← 지도로</button></div>
  </div>
</div>

<script>
// 지역 정의: 파일 + 시군구를 담은 property 키 + 단위 이름
const REGIONS = {
  '서울특별시': { file:'seoul_gu.geojson', key:'name', unit:'자치구', note:'25개 자치구 · 매출·소비·유동인구까지 상세' },
  '충청북도':   { file:'geo_chungbuk.json', key:'sigun', unit:'시·군', note:'11개 시·군(3시 8군) · 인구·점포 중심' },
  '충청남도':   { file:'geo_chungnam.json', key:'sigun', unit:'시·군', note:'15개 시·군(8시 7군) · 인구·점포 중심' },
};
let picked=null, cache={}, feats=[], siguns=[];

// 1단계 카드 그리기
const cardsEl=document.getElementById('cards');
Object.entries(REGIONS).forEach(([name,cfg])=>{
  const div=document.createElement('div');
  div.className='card'; div.dataset.name=name;
  div.innerHTML=`<h2>${name}</h2><p>${cfg.note}</p>`;
  div.onclick=()=>selectRegion(name);
  cardsEl.appendChild(div);
});

// 경위도 → SVG 좌표(지역 bbox에 맞춰 꽉 채움)
function projector(features){
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  const each=(coords)=>{ coords.forEach(c=>{
    if(typeof c[0]==='number'){ minX=Math.min(minX,c[0]);maxX=Math.max(maxX,c[0]);minY=Math.min(minY,c[1]);maxY=Math.max(maxY,c[1]); }
    else each(c);
  });};
  features.forEach(f=>each(f.geometry.coordinates));
  const W=700,H=520,pad=20;
  const sx=(W-2*pad)/(maxX-minX), sy=(H-2*pad)/(maxY-minY), s=Math.min(sx,sy);
  const ox=pad+((W-2*pad)-(maxX-minX)*s)/2, oy=pad+((H-2*pad)-(maxY-minY)*s)/2;
  return (lon,lat)=>[ ox+(lon-minX)*s, oy+(maxY-lat)*s ]; // y 뒤집기
}
// 폴리곤 좌표 → SVG path d
function toPath(geometry, P){
  const rings = geometry.type==='Polygon' ? [geometry.coordinates] : geometry.coordinates; // MultiPolygon
  let d='';
  rings.forEach(poly=>poly.forEach(ring=>{
    ring.forEach((pt,i)=>{ const [x,y]=P(pt[0],pt[1]); d+=(i?'L':'M')+x.toFixed(1)+' '+y.toFixed(1); });
    d+='Z';
  }));
  return d;
}
// 시군 중심(라벨 위치) = 폴리곤 좌표 평균
function centroid(features, P){
  let sx=0,sy=0,n=0;
  const walk=(c)=>{ if(typeof c[0]==='number'){const [x,y]=P(c[0],c[1]);sx+=x;sy+=y;n++;} else c.forEach(walk); };
  features.forEach(f=>walk(f.geometry.coordinates));
  return [sx/n, sy/n];
}

function load(name){
  const cfg=REGIONS[name];
  if(cache[name]) return Promise.resolve(cache[name]);
  return fetch(cfg.file).then(r=>r.json()).then(d=>{ cache[name]=d; return d; });
}

function selectRegion(name){
  picked=name;
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('on',c.dataset.name===name));
  load(name).then(d=>{ drawMap(d, name); show('s2'); });
}

function drawMap(geo, name){
  const cfg=REGIONS[name];
  feats=geo.features;
  siguns=[...new Set(feats.map(f=>f.properties[cfg.key]))].sort();
  document.getElementById('mapTitle').textContent = name + ' — ' + siguns.length + '개 ' + cfg.unit;
  document.getElementById('s2hint').textContent = '이 지역의 ' + cfg.unit + ' ' + siguns.length + '개를 확인합니다.';
  const svg=document.getElementById('svg'); svg.innerHTML='';
  const P=projector(feats);
  const NS='http://www.w3.org/2000/svg';
  // 시군별로 묶어 그리기(청주·천안처럼 여러 폴리곤인 곳 대응)
  siguns.forEach(sg=>{
    const group=feats.filter(f=>f.properties[cfg.key]===sg);
    group.forEach(f=>{
      const p=document.createElementNS(NS,'path');
      p.setAttribute('d',toPath(f.geometry,P));
      p.dataset.sigun=sg;
      p.addEventListener('mouseenter',()=>hi(sg,true));
      p.addEventListener('mouseleave',()=>hi(sg,false));
      svg.appendChild(p);
    });
    const [cx,cy]=centroid(group,P);
    const t=document.createElementNS(NS,'text');
    t.setAttribute('x',cx); t.setAttribute('y',cy); t.textContent=sg.replace(/시$|군$/,'');
    svg.appendChild(t);
  });
}
function hi(sg,on){ document.querySelectorAll('#svg path').forEach(p=>{ if(p.dataset.sigun===sg) p.classList.toggle('on',on); }); }

function confirmRegion(){
  const cfg=REGIONS[picked];
  document.getElementById('detTitle').textContent = picked + '의 ' + cfg.unit;
  document.getElementById('detCount').textContent = '총 ' + siguns.length + '개 · 하나를 고르면 상세 분석으로 (준비 중)';
  const wrap=document.getElementById('chips'); wrap.innerHTML='';
  siguns.forEach(sg=>{
    const c=document.createElement('div'); c.className='chip'; c.textContent=sg;
    c.onclick=()=>alert(picked+' '+sg+' 상세 분석은 준비 중입니다.\n(여기서 해당 구·군 데이터 화면으로 연결)');
    wrap.appendChild(c);
  });
  show('s3');
}

function show(id){ ['s1','s2','s3'].forEach(s=>document.getElementById(s).classList.toggle('hide', s!==id)); window.scrollTo(0,0); }
function back(){ show('s1'); }
function back2(){ show('s2'); }
</script>
</body>
</html>
