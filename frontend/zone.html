<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상권 인텔리전스 — 사장님인사이트</title>
<meta name="description" content="서울 상권 1,564곳의 수요·공급·변화·전망을 실측 데이터로 판독합니다.">
<link rel="stylesheet" href="theme.css">
<script src="command.js" defer></script>
<style>
/* 색·타이포·버튼·칩·시트·상태는 theme.css(디자인 시스템). 여기는 이 화면 고유 배치만. */

/* ── 진단 히어로: 결론 한 문장 + 가장 중요한 숫자 하나 ── */
.hero{padding:var(--sp-7) 0 var(--sp-6)}
.hero .verdict{margin:var(--sp-3) 0 var(--sp-6);max-width:24ch}
.metric{display:flex;align-items:baseline;gap:var(--sp-3);flex-wrap:wrap}
.metric .unit{font-size:var(--f-sub);color:var(--ink2);font-weight:500}

/* ── 핵심 변화: 카드 대신 얇은 구분선 목록 ── */
.changes{list-style:none;margin:0;padding:0}
.changes li{display:flex;gap:var(--sp-3);padding:var(--sp-4) 0;border-top:1px solid var(--line-soft);
  align-items:flex-start}
.changes li:first-child{border-top:0}
.changes .k{flex:none;width:96px;color:var(--ink3);font-size:var(--f-cap);padding-top:3px}
.changes .v{flex:1;font-size:var(--f-sub);color:var(--ink)}

/* ── 요인 분해: 0을 가운데 두고 좌우로 뻗는 막대 ── */
.factor{display:grid;grid-template-columns:92px 1fr 52px;gap:var(--sp-3);align-items:center;
  padding:var(--sp-2) 0;font-size:var(--f-sub)}
.factor .bar{position:relative;height:14px}
.factor .bar .zero{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-strong)}
.factor .bar i{position:absolute;top:3px;height:8px;border-radius:2px}
.factor .bar i.p{background:var(--up);left:50%}
.factor .bar i.n{background:var(--down)}
.factor .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}

/* ── 차트 ── */
.chart{width:100%;height:260px;display:block}
/* 차트 위 지점 — 평소엔 숨기고 마우스를 올린 것만 드러낸다(격자 대신 값으로 읽게) */
.chart .pt circle:first-child{transition:opacity var(--t-fast) var(--ease)}
.chart .pt:hover circle:first-child{opacity:1}
.chart .pt{cursor:crosshair}
.legend{display:flex;gap:var(--sp-5);font-size:var(--f-cap);color:var(--ink2);margin-top:var(--sp-3)}
.legend i{display:inline-block;width:20px;height:0;border-top:2px solid var(--ink);
  vertical-align:middle;margin-right:6px}
.legend i.fc{border-top-style:dashed;border-color:var(--brand)}

/* ── 다음 할 일 — 카드가 아니라 왼쪽 라벨 + 본문 ── */
.nba{margin-top:var(--sp-4)}
.nba .q{display:grid;grid-template-columns:120px 1fr;gap:var(--sp-4);
  padding:var(--sp-4) 0;border-top:1px solid var(--line-soft)}
.nba .q:first-child{border-top:0}
.nba .k{color:var(--ink3);font-size:var(--f-cap);padding-top:2px}
.nba .q p{margin:0;font-size:var(--f-sub);color:var(--ink)}
.acts{display:flex;gap:var(--sp-2);flex-wrap:wrap}
@media(max-width:640px){.nba .q{grid-template-columns:1fr;gap:var(--sp-1)}}

/* ── 표 ── */
table{width:100%;border-collapse:collapse;font-size:var(--f-sub)}
th,td{text-align:right;padding:var(--sp-2) var(--sp-3);border-bottom:1px solid var(--line-soft)}
th:first-child,td:first-child{text-align:left}
th{font-size:var(--f-cap);color:var(--ink3);font-weight:500;border-bottom:1px solid var(--line)}

/* ── 진입 화면(탐색) ── */
.searchbox{position:relative;margin-top:var(--sp-5)}
.sugg{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--bg);
  border:1px solid var(--line-strong);border-radius:var(--r-md);max-height:300px;overflow:auto;
  z-index:40;box-shadow:var(--shadow-pop)}
.sugg div{padding:var(--sp-3) var(--sp-4);cursor:pointer;font-size:var(--f-sub);
  border-bottom:1px solid var(--line-soft)}
.sugg div:last-child{border-bottom:0}
.sugg div:hover,.sugg div.on{background:var(--surface)}
.sugg .g{color:var(--ink3);font-size:var(--f-cap);margin-left:6px}

/* 탐색 목록 — 카드 없이 행으로 */
.list{margin-top:var(--sp-4)}
.list .row{display:grid;grid-template-columns:1fr auto;gap:var(--sp-4);align-items:center;
  padding:var(--sp-4) 0;border-top:1px solid var(--line-soft);cursor:pointer;
  transition:opacity var(--t-fast) var(--ease)}
.list .row:hover{opacity:.62}
.list .row .nm{font-size:var(--f-body);font-weight:600;letter-spacing:-.01em}
.list .row .sub{font-size:var(--f-cap);color:var(--ink3);margin-top:2px}
.list .row .val{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;font-size:var(--f-body)}
.list .row .val small{display:block;font-size:var(--f-cap);color:var(--ink3);font-weight:400}

.tabs{display:flex;gap:var(--sp-2);margin-top:var(--sp-6);flex-wrap:wrap}

/* 하단 고정 CTA — 스크롤 중에도 다음 행동이 보이게 */
.stickycta{position:sticky;bottom:0;background:var(--bg-blur);backdrop-filter:blur(16px);
  border-top:1px solid var(--line);padding:var(--sp-3) 0;margin-top:var(--sp-6);z-index:20}
.stickycta .in{display:flex;gap:var(--sp-2);align-items:center}
.stickycta .in .btn{flex:none}
.stickycta .lbl{flex:1;font-size:var(--f-cap);color:var(--ink2);min-width:0}

@media (max-width:640px){
  .factor{grid-template-columns:74px 1fr 46px}
  .changes .k{width:72px}
  .stickycta .lbl{display:none}
  .stickycta .in .btn{flex:1}
}
@media print{.stickycta,.searchbox,.tabs{display:none!important}}
</style>
</head>
<body>
<header class="sitehead">
  <div class="headwrap">
    <a class="brand" href="index.html">사장님인사이트 <span>· 상권 진단</span></a>
    <button class="cmdk-btn" data-cmdk-open type="button" aria-label="검색"><span>검색</span><kbd>⌘K</kbd></button>
    <nav>
    <a href="index.html" class="navlink">홈</a>
    <a href="zone.html" aria-current="page" class="navlink on">진단</a>
    <a href="compare.html" class="navlink">비교</a>
    <a href="mvp.html" class="navlink">손익</a>
  </nav>
  </div>
</header>

<main class="wrap">
  <!-- ═══ 탐색 ═══ -->
  <div id="browse">
    <section class="sec" style="padding-bottom:var(--sp-5)">
      <h1 class="t-display">어디서 시작하면<br>기회가 있을까요</h1>
      <p class="t-sub" style="margin-top:var(--sp-3)">업종을 고르면 수요는 있는데 그 업종 점포가 적은 상권을 찾아드립니다.</p>

      <div class="tabs" id="indchips" style="margin-top:var(--sp-5)"></div>

      <div class="searchbox" style="margin-top:var(--sp-5)">
        <input class="input" type="search" id="q" placeholder="또는 상권 · 동 · 자치구 검색" autocomplete="off">
        <div class="sugg" id="sugg" hidden></div>
      </div>

      <div class="list" id="rank"></div>
      <section class="sec" id="watchbox" hidden></section>
      <p class="t-cap" id="src" style="margin-top:var(--sp-6)"></p>
    </section>
  </div>

  <!-- ═══ 진단 ═══ -->
  <div id="profile" hidden></div>
</main>

<!-- 리포트 이메일 수집 -->
<div class="modal" id="modal">
  <div class="sheet">
    <h4>상권 리포트 받기</h4>
    <p id="mtarget" class="num"></p>
    <label for="em">이메일</label>
    <input type="email" id="em" placeholder="name@company.com" autocomplete="email">
    <div class="agree">
      <input type="checkbox" id="ag" style="margin-top:2px">
      <label for="ag" style="margin:0">리포트 발송을 위한 이메일 수집·이용에 동의합니다. 수집 항목은 <b>이메일·조회한 상권·업종·리포트 종류</b>이며, 그 외 개인정보는 수집하지 않습니다. <a href="privacy.html" target="_blank">처리방침 보기</a></label>
    </div>
    <div class="acts" style="margin-top:16px">
      <button class="btn" id="msend">받기</button>
      <button class="btn ghost" id="mclose">닫기</button>
    </div>
    <div class="msg" id="mmsg"></div>
  </div>
</div>

<script>
(function(){
"use strict";
// ─────────────────────────────────────────────────────────────
// 데이터는 "필요할 때" 받는다. 첫 화면은 경량 인덱스(zone_index)만.
// 상세(zone_intel·zone_industry·signals)는 상권을 처음 열 때 1회만 받고 캐시한다.
// ─────────────────────────────────────────────────────────────
var IDX=null, INTEL=null, ZIND=null, SIG=null, HIST=null, ZHIST=null;
var byCd={}, INDS=[], curInd="";
var cache={};                                  // 지연 로딩 결과 캐시(같은 파일 두 번 안 받음)
function get(url){
  if(cache[url]) return cache[url];
  cache[url]=fetch(url).then(function(r){ if(!r.ok) throw new Error(url+' '+r.status); return r.json(); })
    .catch(function(e){ delete cache[url]; throw e; });   // 실패는 캐시하지 않는다(재시도 가능하게)
  return cache[url];
}
var $=function(s,r){return (r||document).querySelector(s);};
var el=function(t,c,h){var n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};

// ── 숫자 표기 ──
function won(v){                                   // 원 → 조/억/만
  v=Number(v)||0; var a=Math.abs(v), s=v<0?'-':'';
  if(a>=1e12) return s+(a/1e12).toFixed(a/1e12>=10?0:1)+'조';
  if(a>=1e8)  return s+Math.round(a/1e8).toLocaleString()+'억';
  if(a>=1e4)  return s+Math.round(a/1e4).toLocaleString()+'만';
  return s+Math.round(a).toLocaleString();
}
function pct(v,d){ if(v==null||isNaN(v)) return '—'; return (v>0?'+':'')+Number(v).toFixed(d==null?1:d)+'%'; }
function qLabel(q){ return q? q.slice(0,4)+'년 '+q.slice(4)+'분기' : '—'; }
// 한글 조사 — "을지로2가은(는)" 같은 표기는 바로 아마추어처럼 보인다.
// 한글 음절 코드(0xAC00~0xD7A3)에서 (코드-0xAC00)%28 이 0이 아니면 받침이 있다.
// 상권명이 숫자나 영문·괄호로 끝나는 경우가 많아 그것도 처리한다.
function josa(w, withBat, without){
  var s=String(w||'').replace(/[)\]\s.·]+$/,''), c=s.charCodeAt(s.length-1);
  var bat;
  if(c>=0xAC00&&c<=0xD7A3) bat=((c-0xAC00)%28)!==0;
  else if(c>=48&&c<=57)    bat=[1,0,0,0,0,0,1,1,0,0][c-48]===1;   // 0 1 3 6 7 8 = 받침(영,일,삼,육,칠,팔)
  else if((c>=65&&c<=90)||(c>=97&&c<=122)) bat=/[lmnr]/i.test(s[s.length-1]);
  else return without;                                             // 판단 불가 → 받침 없는 쪽
  return bat? withBat : without;
}
var GRADE={LL:['다이나믹','창업·폐업이 모두 활발한 상권','b-warn'],
           LH:['상권 확장','점포가 늘고 매출이 커지는 국면','b-good'],
           HL:['상권 축소','점포·매출이 줄어드는 국면','b-bad'],
           HH:['정체','변화가 적고 안정적인 상권','']};

// ── 부팅 ──
// 첫 화면은 zone_opportunity.json 하나만 받아 바로 그린다.
// 검색·상세에 쓰는 zone_index 는 첫 그림이 끝난 뒤 조용히 받는다(첫 화면을 붙잡지 않게).
bootHome().catch(function(){
  $('#rank').innerHTML='<div class="state"><p class="t">데이터를 불러오지 못했습니다</p>'+
    '<p class="d">잠시 후 다시 시도해 주세요.</p>'+
    '<button class="btn btn-secondary btn-sm" onclick="location.reload()">다시 시도</button></div>';
});

function loadIndex(){
  return get('zone_index.json').then(function(d){
    IDX=d;
    if(!IDX||!IDX.rows) throw new Error('index');
    var C=IDX.cols;
    IDX.list=IDX.rows.map(function(r){ var o={}; C.forEach(function(k,i){o[k]=r[i];}); return o; });
    IDX.list.forEach(function(z){ byCd[z.cd]=z; });
    window.__cmdZones=IDX.list;      // ⌘K 팔레트가 상권을 찾을 수 있게
    return IDX;
  });
}
var idxReady=null;
function ensureIndex(){ if(!idxReady) idxReady=loadIndex(); return idxReady; }
if(window.requestIdleCallback) requestIdleCallback(function(){ensureIndex();},{timeout:2000});
else setTimeout(function(){ensureIndex();},600);
wire();
ensureIndex().then(route).catch(function(){});

// ═══ 첫 화면 — "이 상권 어때?"가 아니라 "어디서 이 업종을 하면 기회가 있나?" ═══
// 사용자가 먼저 고르는 건 상권이 아니라 '무슨 장사를 할지'다. 그 순서를 화면에 그대로 옮겼다.
var OPP=null, curOppInd='';
// 자주 찾는 업종을 앞에 둔다. 나머지는 '전체 업종'에서 고른다(선택지를 처음부터 62개 늘어놓지 않는다).
var TOP_INDS=['커피-음료','한식음식점','미용실','편의점','치킨전문점','분식전문점','제과점','일반의원'];

function bootHome(){
  return get('zone_opportunity.json').then(function(d){
    OPP=d;
    var all=Object.keys(OPP.ind||{});
    if(!all.length) throw new Error('empty');
    var picks=TOP_INDS.filter(function(k){return OPP.ind[k];});
    // 목록에 없는 업종까지 고를 수 있게 select 하나를 뒤에 붙인다.
    var etc=all.filter(function(k){return picks.indexOf(k)<0;}).sort();
    $('#indchips').innerHTML=picks.map(function(k,i){
      return '<button class="chip'+(i===0?' on':'')+'" data-ind="'+esc(k)+'">'+esc(k)+'</button>';
    }).join('')+'<select class="chip" id="indmore" style="padding-right:26px"><option value="">전체 업종…</option>'+
      etc.map(function(k){return '<option>'+esc(k)+'</option>';}).join('')+'</select>';
    curOppInd=picks[0]||all[0];
    window.__cmdInds=all;            // ⌘K 팔레트가 업종을 찾을 수 있게
    $('#indchips').addEventListener('click',function(e){
      var b=e.target.closest('[data-ind]'); if(!b) return;
      setInd(b.dataset.ind);
    });
    $('#indmore').addEventListener('change',function(){ if(this.value) setInd(this.value); });
    $('#src').innerHTML='출처 서울시 상권분석서비스 · 서울 열린데이터광장 · 기준 '+esc(qLabel(OPP.quarter))+' · 갱신 '+esc(OPP.updated);
    drawOpp();
  });
}
function setInd(k){
  curOppInd=k;
  Array.prototype.forEach.call(document.querySelectorAll('#indchips .chip[data-ind]'),function(x){
    x.classList.toggle('on', x.dataset.ind===k);
  });
  var sel=$('#indmore'); if(sel) sel.value=(TOP_INDS.indexOf(k)>=0?'':k);
  drawOpp();
}
function drawOpp(){
  var d=(OPP.ind||{})[curOppInd];
  var box=$('#rank');
  if(!d||!d.top||!d.top.length){
    box.innerHTML='<div class="state"><p class="t">'+esc(curOppInd)+'은 아직 분석할 수 없습니다</p>'+
      '<p class="d">이 업종의 점포가 있는 상권이 너무 적어 신뢰할 수 있는 비교를 하기 어렵습니다.</p></div>';
    return;
  }
  // 결론 문장은 '신뢰도 낮음'이 아닌 곳 중 최고를 고른다.
  // 점포 3곳으로 낸 점수를 대표 추천으로 내세우면 안 된다(목록에는 그대로 남긴다).
  var best=null;
  for(var bi=0;bi<d.top.length;bi++){ if(d.top[bi].conf!=='낮음'){ best=d.top[bi]; break; } }
  var thin=!best; if(!best) best=d.top[0];
  var H=[];
  H.push('<p class="t-body" style="margin:0 0 var(--sp-5)"><b>'+esc(best.gu||'')+' '+esc(best.nm||'')+
    '</b>'+josa(best.nm||'','이','가')+' 가장 기회가 큽니다. 수요가 상위 '+best.dem+
    '%인데 '+esc(curOppInd)+' 점포는 '+best.stores+'곳뿐입니다.'+
    (thin?' <span class="t-cap">— 다만 이 업종은 점포가 5곳 이상인 상권이 없어 근거가 얇습니다.</span>':'')+'</p>');
  H.push(d.top.slice(0,10).map(function(r,i){
    var conf=r.conf==='높음'?'':' · 신뢰도 '+r.conf;
    return '<div class="row" data-cd="'+r.cd+'">'+
      '<div><div class="nm">'+esc(r.nm||r.cd)+'</div>'+
      '<div class="sub">'+esc(r.gu||'')+' · 수요 '+r.dem+' · 이 업종 점포 '+r.stores+'곳'+esc(conf)+'</div></div>'+
      '<div class="val">'+Math.round(r.score)+'<small>기회점수</small></div></div>';
  }).join(''));

  // 미개척 — 점수를 매길 수 없는 곳. 기회일 수도, 안 되는 동네일 수도 있다고 정직하게 쓴다.
  if(d.unproven&&d.unproven.length){
    H.push('<details class="disclose" style="margin-top:var(--sp-5)">'+
      '<summary>아직 확인되지 않은 공백 '+d.unproven.length+'곳</summary>'+
      '<div class="list" style="margin-top:0;padding-bottom:var(--sp-4)">'+
      d.unproven.map(function(r){
        return '<div class="row" data-cd="'+r.cd+'"><div><div class="nm">'+esc(r.nm||r.cd)+'</div>'+
          '<div class="sub">'+esc(r.gu||'')+' · '+esc(r.why||'')+'</div></div>'+
          '<div class="val" style="font-size:var(--f-sub);color:var(--ink3)">확인 필요</div></div>';
      }).join('')+
      '<p class="t-cap" style="margin-top:var(--sp-3)">수요는 상위인데 이 업종 점포가 거의 없는 곳입니다. '+
      '점포가 없어 <b>여기서 이 업종이 되는지 검증할 수 없어</b> 점수를 매기지 않았습니다. '+
      '기회일 수도, 그 업종이 안 되는 동네일 수도 있습니다 — 반드시 현장에서 확인하세요.</p></div></details>');
  }
  H.push('<p class="t-cap" style="margin-top:var(--sp-5)">기회점수 = 수요 45% + 희소성 35% + 점포당 매출 20%. '+
    '가중치는 가정이며, 상업 규모가 있는 상권(점포 50곳·분기매출 10억 이상) 안에서만 비교했습니다.</p>');
  box.innerHTML=H.join('');
}

// ── 검색 ──
function search(term){
  term=term.trim(); if(!term||!IDX||!IDX.list) return [];
  return IDX.list.filter(function(z){
    return (z.nm&&z.nm.indexOf(term)>=0)||(z.gu&&z.gu.indexOf(term)>=0)||(z.dong&&z.dong.indexOf(term)>=0);
  }).sort(function(a,b){ return (a.weak-b.weak)||(b.sales-a.sales); }).slice(0,12);
}
function wire(){
  var q=$('#q'), sg=$('#sugg'), sel=-1, cur=[];
  function close(){ sg.hidden=true; sel=-1; }
  q.addEventListener('input',function(){
    ensureIndex().then(function(){ if(q.value) { cur=search(q.value); paint(); } });
    cur=search(q.value); paint();
  });
  function paint(){
    if(!cur.length){ close(); return; }
    sg.innerHTML=cur.map(function(z,i){
      return '<div data-i="'+i+'">'+esc(z.nm)+'<span class="g">'+esc(z.gu||'')+(z.dong?' '+esc(z.dong):'')+' · 점포 '+z.stores+'</span></div>';
    }).join('');
    sg.hidden=false;
  }
  q.addEventListener('keydown',function(e){
    if(sg.hidden) return;
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault(); sel+=(e.key==='ArrowDown'?1:-1);
      if(sel<0)sel=cur.length-1; if(sel>=cur.length)sel=0;
      Array.prototype.forEach.call(sg.children,function(c,i){ c.className=(i===sel?'on':''); });
    } else if(e.key==='Enter'){ e.preventDefault(); open(cur[sel<0?0:sel].cd); close(); }
    else if(e.key==='Escape') close();
  });
  sg.addEventListener('click',function(e){
    var d=e.target.closest('[data-i]'); if(!d) return;
    open(cur[+d.dataset.i].cd); close(); q.value='';
  });
  document.addEventListener('click',function(e){ if(!e.target.closest('.searchbox')) close(); });
  var wb=document.getElementById('watchbox');
  if(wb) wb.addEventListener('click',function(e){
    var r=e.target.closest('[data-cd]'); if(r) location.hash='z='+r.dataset.cd;
  });
  $('#rank').addEventListener('click',function(e){
    var r=e.target.closest('[data-cd]'); if(!r) return;
    curInd=curOppInd||curInd;
    ensureIndex().then(function(){ open(r.dataset.cd); });
  });
  window.addEventListener('hashchange',route);
}
function route(){
  // 팔레트에서 "업종"을 골라 들어온 경우
  var pi=new URLSearchParams(location.search).get('ind');
  if(pi && OPP && OPP.ind && OPP.ind[pi] && curOppInd!==pi){ setInd(pi); }
  var m=(location.hash||'').match(/^#z=([0-9]+)(?:&ind=(.*))?$/);
  if(m&&byCd[m[1]]){ curInd=m[2]?decodeURIComponent(m[2]):''; open(m[1],true); }
  else {
    $('#profile').hidden=true; $('#browse').hidden=false;
    if(OPP) drawOpp();
    ensureIndex().then(drawWatch).catch(function(){});
  }
}

// ── 상권 프로파일 ──
function open(cd, fromHash){
  var z=byCd[cd]; if(!z) return;
  if(!fromHash){ location.hash='z='+cd+(curInd?'&ind='+encodeURIComponent(curInd):''); return; }
  $('#browse').hidden=true;
  var p=$('#profile'); p.hidden=false;
  p.innerHTML='<section class="sec"><h1 class="t-title">'+esc(z.nm)+'</h1>'+
    '<ul class="steps" style="margin-top:var(--sp-5)">'+
    '<li class="now"><span class="dot"></span>상권 데이터 확인 중</li>'+
    '<li><span class="dot"></span>최근 변화 분석 중</li>'+
    '<li><span class="dot"></span>전망 계산 중</li></ul>'+
    '<div class="skel" style="height:120px;margin-top:var(--sp-6)"></div></section>';
  window.scrollTo(0,0);
  Promise.all([
    INTEL?Promise.resolve(INTEL):get('zone_intel.json').then(function(d){INTEL=d;return d;}),
    ZIND ?Promise.resolve(ZIND) :get('zone_industry.json').then(function(d){ZIND=d;return d;}),
    SIG  ?Promise.resolve(SIG)  :get('signals.json').then(function(d){SIG=d;return d;}).catch(function(){return null;}),
    HIST ?Promise.resolve(HIST) :get('sales_history.json').then(function(d){HIST=d;return d;}).catch(function(){return null;}),
    // 상권별 분기 이력은 아직 수집 전일 수 있다. 없으면 조용히 넘어가고 서울 업종 기준으로 그린다.
    ZHIST?Promise.resolve(ZHIST):get('zone_history.json').then(function(d){ZHIST=d;return d;}).catch(function(){return null;})
  ]).then(function(){ render(z); }).catch(function(e){
    p.innerHTML='<div class="state"><p class="t">분석 데이터를 불러오지 못했습니다</p>'+
      '<p class="d">잠시 후 다시 시도해 주세요.</p>'+
      '<button class="btn btn-secondary btn-sm" id="bk2">상권 목록으로</button></div>';
    $('#bk2').addEventListener('click',function(){ location.hash=''; });
  });
}



// ═══ 관심 상권 저장 (SiteVelocity·RealHQ 의 Watchlist) ═══
// 상권을 훑다 보면 "아까 그 괜찮았던 곳"을 다시 못 찾는다.
// 서버 없이 이 브라우저에만 저장한다(로그인 없음, 개인정보 수집 없음).
// localStorage 는 사생활 보호 모드·저장 차단 설정에서 예외를 던지므로 전부 감싼다.
var WKEY='si.watch.v1';
function watchGet(){
  try{ return JSON.parse(localStorage.getItem(WKEY)||'[]'); }catch(e){ return []; }
}
function watchSet(a){
  try{ localStorage.setItem(WKEY, JSON.stringify(a.slice(0,30))); return true; }
  catch(e){ return false; }   // 저장이 막혀 있어도 화면은 계속 동작해야 한다
}
function watchHas(cd){ return watchGet().indexOf(cd)>=0; }
function watchToggle(cd){
  var a=watchGet(), i=a.indexOf(cd);
  if(i>=0) a.splice(i,1); else a.unshift(cd);
  return watchSet(a) ? (i<0) : null;   // null = 저장 실패
}
function drawWatch(){
  var box=$('#watchbox'); if(!box) return;
  var list=watchGet().map(function(cd){return byCd[cd];}).filter(Boolean);
  if(!list.length){ box.hidden=true; return; }
  box.hidden=false;
  box.innerHTML='<h2 class="t-head">저장한 상권 '+list.length+'곳</h2>'+
    '<div class="list">'+list.map(function(z){
      return '<div class="row" data-cd="'+z.cd+'"><div><div class="nm">'+esc(z.nm)+'</div>'+
        '<div class="sub">'+esc(z.gu||'')+' · 점포 '+z.stores.toLocaleString()+'</div></div>'+
        '<div class="val delta '+(z.gap>0?'up':'down')+'">'+(z.gap>0?'+':'')+z.gap.toFixed(0)+'<small>기회지수</small></div></div>';
    }).join('')+'</div>';
}

// ═══ 근거(Evidence) — 숫자마다 어디서 왔고 언제 기준인지 밝힌다 ═══
// TomTom Site Selection 의 Data Provenance 패널, SiteVelocity 의 근거 등급 개념을 가져왔다.
// 우리 원칙(실측·가정·추정 구분)과 같은 방향이라, 흩어져 있던 것을 한 표로 모은다.
//   실측  = 공공데이터에 그 값이 그대로 있다
//   추정  = 실측값을 가공했다(백분위·가중합 등). 가중치는 우리가 정한 가정이다
//   미확인 = 데이터로 답할 수 없다. 지어내지 않고 비워 둔다
function evidenceRows(z,o,oppRow,q){
  var SRC_TRDAR='서울시 상권분석서비스', SRC_OPEN='서울 열린데이터광장';
  var rows=[];
  if(oppRow){
    rows.push(['이 업종 점포 수', oppRow.stores+'곳', '실측', SRC_TRDAR, q]);
    if(oppRow.psales!=null)
      rows.push(['이 업종 점포당 매출',
        won(oppRow.psales)+'원/분기'+(oppRow.perf_raw!=null?' · 서울 상위 '+Math.max(1,100-oppRow.perf_raw)+'%':''),
        oppRow.stores>=10?'실측':'실측 · 표본 '+oppRow.stores+'곳', SRC_TRDAR, q]);
    if(oppRow.score!=null)
      rows.push(['기회점수', Math.round(oppRow.score)+'점', '추정 · 가중합',
        '수요 45% + 희소성 35% + 점포당매출 20%', q]);
    else
      rows.push(['기회점수', '—', '미확인',
        '점포가 '+oppRow.stores+'곳뿐이라 이 업종이 되는 동네인지 판단 불가', q]);
  }
  if(o.dem!=null) rows.push(['수요 점수', Math.round(o.dem)+'', '추정 · 백분위',
    SRC_OPEN+' 생활인구 · 배후 아파트 · 집객시설', q]);
  if(o.opr) rows.push(['점포 평균 운영기간', (o.opr/12).toFixed(1)+'년', '실측',
    SRC_TRDAR+' 상권변화지표', q]);
  rows.push(['상권 분기 매출', won(z.sales)+'원', '추정 · 카드매출 귀속',
    SRC_TRDAR+' — 절대 금액보다 지역 간 상대 비교로 보세요', q]);
  return rows;
}

// ═══ 다음 할 일 — "가장 중요한 미해결 질문"과 그걸 푸는 방법 ═══
// SiteVelocity 의 Next Best Action. 분석을 보여주고 끝내지 않고,
// 데이터로 답할 수 없는 것 중 가장 결정적인 하나를 짚어 다음 행동으로 넘긴다.
// 지어낸 조언이 아니라 '우리 데이터의 실제 한계'에서 나온다.
function nextAction(z,o,oppRow){
  var q=null;
  if(oppRow && oppRow.score==null)
    q={ ask:'이 상권에 '+curInd+' 점포가 '+oppRow.stores+'곳뿐입니다. 기회가 있는 건지, 그 업종이 안 되는 동네인지 데이터로는 구분할 수 없습니다.',
        how:'현장에서 반경 500m 안의 '+curInd+' 수를 직접 세고, 예전에 있다가 없어진 가게가 있는지 인근 상인에게 물어보세요.',
        who:'현장 방문 · 인근 상인' };
  else if(oppRow && oppRow.conf==='낮음')
    q={ ask:curInd+' 점포가 '+oppRow.stores+'곳이라 "점포당 매출"이 한두 곳에 크게 흔들립니다. 점수의 근거가 얇습니다.',
        how:'같은 조건의 다른 상권 두세 곳과 나란히 비교해 이 숫자가 튀는 값인지 확인하세요.',
        who:'비교 화면' };
  else if(z.weak)
    q={ ask:'이 구역은 점포 '+z.stores+'곳 규모라 상권 간 비교 지표 자체를 믿기 어렵습니다.',
        how:'인접한 더 큰 상권을 기준으로 보거나, 업종을 바꿔 다시 확인하세요.',
        who:'상권 목록' };
  else
    q={ ask:'임대료는 자치구 대표 상권 값으로 추정한 것이라, 이 자리의 실제 월세와 다를 수 있습니다. 손익 계산이 통째로 흔들리는 지점입니다.',
        how:'실제 매물 두세 개의 보증금·월세·관리비를 확인한 뒤 손익을 다시 계산하세요.',
        who:'공인중개사 · 손익 진단' };
  return q;
}

function render(z){
  var o=(INTEL.zones||{})[z.cd]||{};
  var zi=(ZIND.zones||{})[z.cd]||{}, inds=ZIND.inds||[];
  var rows=(zi.rows||[]).map(function(r){
    return {nm:inds[r[0]]||('업종'+r[0]), stores:r[1], sales:r[2], unit:r[3]};
  }).sort(function(a,b){return b.sales-a.sales;});
  INDS=rows;
  if(!curInd && rows.length) curInd=rows[0].nm;

  var g=GRADE[o.grade]||null;
  var H=[];

  // ═══ ① 핵심 진단 — 결론 한 문장 + 가장 중요한 숫자 하나 ═══
  // 숫자를 전부 크게 만들면 무엇이 중요한지 사라진다. 여기서 큰 숫자는 '기회지수' 하나뿐이다.
  // 업종을 정해 들어왔으면 그 업종 기준으로 답한다(홈에서 본 숫자와 같아야 한다).
  var oppRow=null;
  if(OPP && OPP.ind && curInd && OPP.ind[curInd]){
    var pool=(OPP.ind[curInd].top||[]).concat(OPP.ind[curInd].unproven||[]);
    for(var oi=0;oi<pool.length;oi++) if(pool[oi].cd===z.cd){ oppRow=pool[oi]; break; }
  }
  var gap = (o.gap==null) ? null : Math.round(o.gap);
  var bigVal, bigUnit, verdict, tone;
  if(oppRow && oppRow.score!=null){
    bigVal=Math.round(oppRow.score); tone=bigVal>=70?'up':(bigVal>=50?'flat':'down');
    bigUnit=esc(curInd)+' 기회점수 · 수요 45% + 희소성 35% + 점포당 매출 20% · 신뢰도 '+esc(oppRow.conf||'—');
    verdict=(bigVal>=70?'이 상권에서 '+curInd+'은 기회가 큽니다'
            :bigVal>=50?'이 상권의 '+curInd+'은 보통 수준입니다'
                       :'이 상권에서 '+curInd+'은 기회가 크지 않습니다');
  } else if(z.weak){
    bigVal=null; verdict='상권 간 비교가 어려운 구역입니다'; tone='flat';
  } else {
    bigVal=gap; tone=gap>=15?'up':(gap<=-15?'down':'flat');
    bigUnit='기회지수 · 서울 상권 수요·공급 백분위 차 · '+esc(qLabel(IDX.quarter));
    verdict=gap>=15?'수요에 비해 점포가 적습니다'
           :gap<=-15?'점포가 수요보다 많습니다'
                    :'수요와 공급이 균형에 가깝습니다';
  }

  H.push('<section class="sec hero">');
  H.push('<button class="btn btn-tertiary" id="bk" style="margin-bottom:var(--sp-4)">← 상권 목록</button>');
  H.push('<div style="display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-bottom:var(--sp-3)">'+
    (g?'<span class="badge">'+esc(g[0])+'</span>':'')+
    (z.weak?'<span class="badge">비교 제한</span>':'')+'</div>');
  H.push('<h1 class="t-title">'+esc(z.nm)+'</h1>');
  H.push('<p class="t-cap" style="margin-top:var(--sp-1)">'+esc([z.gu,z.dong].filter(Boolean).join(' · '))+'</p>');
  H.push('<p class="t-display verdict">'+esc(verdict)+'</p>');
  if(bigVal!=null){
    H.push('<div class="metric">'+
      '<span class="t-metric delta '+tone+'">'+(oppRow&&oppRow.score!=null?bigVal:(bigVal>0?'+':'')+bigVal)+'</span>'+
      '<span class="unit">'+bigUnit+'</span></div>');
  }
  if(oppRow && oppRow.score==null){
    H.push('<div class="badge badge-warn" style="height:auto;padding:var(--sp-2) var(--sp-3);white-space:normal">'+
      esc(curInd)+' 점포가 '+oppRow.stores+'곳뿐이라 이 업종이 되는 동네인지 확인할 수 없습니다 — 점수를 매기지 않았습니다</div>');
  }
  H.push('</section>');

  // ═══ ② 핵심 변화 — 2~3개만. 카드가 아니라 얇은 목록 ═══
  var ch=[];
  if(oppRow && oppRow.score!=null)
    // perf 는 표본이 적으면 중간으로 끌어당긴 '점수 계산용' 값이다.
    // 화면에 "서울 상위 N%"로 쓸 때는 실제 측정 순위(perf_raw)를 써야 한다.
    ch.push([esc(curInd),'수요 <b>'+oppRow.dem+'</b> · 이 업종 점포 <b>'+oppRow.stores+'곳</b>'+
      ' · 희소성 <b>'+oppRow.scarce+'</b>'+
      (oppRow.perf_raw!=null
        ? ' · 점포당 매출 서울 <b>상위 '+Math.max(1,100-oppRow.perf_raw)+'%</b>'
          +(oppRow.stores<5?' <span class="t-cap">(점포 '+oppRow.stores+'곳 기준이라 흔들릴 수 있음)</span>':'')
        : '')]);
  if(g) ch.push(['국면', '<b>'+esc(g[0])+'</b> — '+esc(g[1])]);
  if(gap!=null && !z.weak)
    ch.push(['수요·공급', '수요 '+Math.round(o.dem)+' · 공급 '+Math.round(o.sup)+
      ' <span class="t-cap">(100에 가까울수록 서울 상위)</span>']);
  if(o.opr) ch.push(['버티는 기간','점포 평균 <b>'+(o.opr/12).toFixed(1)+'년</b>'+
    (o.cls?' · 문 닫은 점포는 평균 '+(o.cls/12).toFixed(1)+'년':'')]);
  var sc0 = SIG && SIG.ind && SIG.ind[curInd];
  if(sc0 && (sc0.anomaly||sc0.watch))
    ch.push(['이상 신호','<b>'+esc(curInd)+' '+esc(sc0.anomaly||sc0.watch)+'</b> — '+esc(sc0.anomaly_detail||'')]);
  if(z.weak) ch.push(['주의','점포 '+z.stores+'개 · 분기매출 '+won(z.sales)+
    '원으로 상업 규모가 작아 비교 지표의 신뢰도가 낮습니다']);
  if(ch.length){
    H.push('<section class="sec"><h2 class="t-head">핵심 변화</h2><ul class="changes" style="margin-top:var(--sp-4)">');
    ch.slice(0,4).forEach(function(c){
      H.push('<li><span class="k">'+esc(c[0])+'</span><span class="v">'+c[1]+'</span></li>');
    });
    H.push('</ul></section>');
  }

  // ═══ ③ 실제 데이터 + ④ 미래 전망 ═══
  H.push('<section class="sec"><h2 class="t-head">매출 흐름과 전망</h2>'+forecastBlock(z,o)+'</section>');

  // ═══ ⑤ 변화 원인 — 왜 이 점수가 나왔는가 ═══
  if(o.why){
    var W=Object.entries(o.why).sort(function(a,b){return Math.abs(b[1])-Math.abs(a[1]);});
    var LBL={hshld:'배후 세대수',livepop:'생활인구',fac:'집객시설',price:'주거 구매력'};
    var mx=Math.max.apply(null,W.map(function(w){return Math.abs(w[1]);}))||1;
    H.push('<section class="sec"><h2 class="t-head">주요 변화 요인</h2>'+
      '<p class="t-sub" style="margin-top:var(--sp-2)">서울 중간(50) 대비 각 요인이 이 상권의 수요를 얼마나 끌어올렸는지입니다.</p>'+
      '<div style="margin-top:var(--sp-4)">');
    W.forEach(function(w){
      var v=w[1], wd=Math.abs(v)/mx*48;
      H.push('<div class="factor"><span class="t-sub">'+esc(LBL[w[0]]||w[0])+'</span>'+
        '<span class="bar"><span class="zero"></span>'+
        (v>=0?'<i class="p" style="width:'+wd+'%"></i>'

  }

  // ═══ ⑥ 상세 분석 — 기본은 접어 둔다. 원하는 사람만 연다 ═══

      (odd?' * 는 매출은 잡혔지만 점포 수가 0으로 집계된 행입니다.':'')+'</p></div></details>');
  }

      return '<div class="row" data-go="'+c+'"><div><div class="nm">'+esc(s2.nm)+'</div>'+

    }).join('');
    det.push('<details class="disclose"><summary>성격이 비슷한 상권 (5곳)</summary>'+
      '<div class="list" style="margin-top:0;padding-bottom:var(--sp-5)">'+sims+
      '<p class="t-cap" style="margin-top:var(--sp-3)">업종 구성이 가장 가까운 상권입니다. 여기서 잘된 업종이 통할 가능성을 봅니다.</p></div></details>');
  }
  if(det.length) H.push('<section class="sec"><h2 class="t-head" style="margin-bottom:var(--sp-2)">상세 분석</h2>'+det.join('')+'</section>');

  // ═══ ⑦ 다음 할 일 — 분석을 보여주고 끝내지 않는다 ═══
  var na=nextAction(z,o,oppRow);
  H.push('<section class="sec"><h2 class="t-head">다음 할 일</h2>'+
    '<div class="nba">'+
      '<div class="q"><span class="k">가장 큰 미해결 질문</span><p>'+esc(na.ask)+'</p></div>'+
      '<div class="q"><span class="k">확인하는 방법</span><p>'+esc(na.how)+'</p></div>'+

    '</div>'+
    '<div class="acts" style="margin-top:var(--sp-4)">'+
      (z.lat&&z.lon?'<a class="btn btn-secondary btn-sm" href="building.html?lat='+z.lat+'&lon='+z.lon+'">이 지점 지도에서 보기</a>':'')+
      '<a class="btn btn-secondary btn-sm" href="mvp.html?gu='+encodeURIComponent(z.gu||'')+'&ind='+encodeURIComponent(curInd||'')+'">손익 다시 계산</a>'+
    '</div></section>');

  // ═══ ⑧ 근거 — 숫자마다 출처와 기준 시점 ═══

    '<p class="t-sub" style="margin-top:var(--sp-2)">화면의 숫자가 각각 어디서 왔는지입니다.</p>'+
    '<div class="scroll-x" style="margin-top:var(--sp-4)"><table><thead><tr>'+
    '<th>항목</th><th style="text-align:left">값</th><th style="text-align:left">등급</th>'+
    '<th style="text-align:left">출처</th><th style="text-align:left">기준</th></tr></thead><tbody>'+
    ev.map(function(r){
      var cls=r[2].indexOf('실측')===0?'badge-up':(r[2]==='미확인'?'badge-warn':'');
      return '<tr><td>'+esc(r[0])+'</td><td style="text-align:left" class="num">'+esc(r[1])+'</td>'+
        '<td style="text-align:left"><span class="badge '+cls+'">'+esc(r[2])+'</span></td>'+
        '<td style="text-align:left" class="t-cap">'+esc(r[3])+'</td>'+
        '<td style="text-align:left" class="t-cap">'+esc(r[4])+'</td></tr>';
    }).join('')+'</tbody></table></div></section>');

  // ═══ ⑨ 리포트 — 화면에서 가장 중요한 행동 하나 ═══
  H.push('<div class="stickycta"><div class="in">'+
    '<span class="lbl">이 분석을 리포트로 받아보세요</span>'+
    '<button class="btn btn-secondary btn-sm" id="wat">'+(watchHas(z.cd)?'저장됨':'저장')+'</button>'+
    '<button class="btn btn-secondary btn-sm" id="cmp">비교에 담기</button>'+

    '</div></div>');

  var p=$('#profile'); p.innerHTML=H.join('');
  $('#bk').addEventListener('click',function(){ location.hash=''; });
  p.addEventListener('click',function(e){
    var c=e.target.closest('[data-go]'); if(c) location.hash='z='+c.dataset.go;
  });
  $('#rep').addEventListener('click',function(){ openModal(z); });
  $('#wat').addEventListener('click',function(){

    if(r===null){ this.textContent='저장 불가'; this.title='브라우저가 저장을 막고 있습니다(사생활 보호 모드 등)'; return; }

function forecastBlock(z,o){
  var opts=INDS.map(function(r){return '<option'+(r.nm===curInd?' selected':'')+'>'+esc(r.nm)+'</option>';}).join('');
  var head='<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px">'+
    '<select class="f" id="fsel">'+opts+'</select>'+
    '<span class="sub" style="font-size:12px">업종을 고르면 해당 업종의 분기 매출 추이를 봅니다.</span></div>';

  if(!SIG||!SIG.ind||!HIST||!HIST.ind){
    return head+'<div class="note">분기 시계열을 아직 불러오지 못했습니다. 데이터 자동 갱신 이후 표시됩니다.</div>';
  }
  // 어느 시계열을 쓸지 결정한다.
  //  1순위: 이 상권 자체의 분기 매출(zone_history 가 수집된 뒤부터 가능) — 사용자가 진짜 궁금한 것
  //  2순위: 서울 전체 해당 업종 — 상권 이력이 아직 없을 때. 무엇을 기준으로 그렸는지 화면에 명시한다.
  var sc=null, series=null, qs=null, scope='';
  if(SIG.zone && SIG.zone[z.cd] && ZHIST && ZHIST.zone && ZHIST.zone[z.cd]){
    sc=SIG.zone[z.cd]; qs=ZHIST.quarters; series=ZHIST.zone[z.cd].slice();
    scope='이 상권의 전체 매출';
  } else if(SIG.ind[curInd] && HIST.ind[curInd]){
    sc=SIG.ind[curInd]; qs=HIST.quarters;
    series=qs.map(function(q){ return HIST.ind[curInd][q]||null; });
    scope='서울 전체 '+curInd+' 업종';
  }
  if(!sc||!series){
    return head+'<div class="note">'+esc(curInd)+' 업종은 분기 이력이 없어 전망을 계산하지 않았습니다.'+
      (SIG.zone_pending?'<br><span class="mut">'+esc(SIG.zone_pending)+'</span>':'')+'</div>';
  }
  var f=sc.forecast||{};
  var isZone=(scope==='이 상권의 전체 매출');
  var chart=drawChart(qs, series, f.show? f.value:null, f.next_q);

  // 무엇의 시계열인지 차트 '위에' 크게 밝힌다.
  // 상권 매출이 4억인 화면에 서울 업종 전체 전망 '3.8조'가 크게 떠 있으면
  // 사용자는 그걸 이 상권의 숫자로 읽는다. 기준을 작은 글씨로 두면 안 된다.
  var scopeBar='<div class="note'+(isZone?'':' warn')+'" style="margin-bottom:12px">'+
    '<b>기준: '+esc(scope)+'</b>'+
    (isZone?'' : '<br>이 상권 자체의 분기 매출 이력은 아직 수집 전이라, 같은 업종의 <b>서울 전체</b> 흐름을 대신 보여줍니다. 아래 금액은 이 상권의 매출이 아닙니다.')+
    '</div>';

  var body=[scopeBar, chart,
    '<div class="legend"><span><i></i>실측</span>'+(f.show?'<span><i class="f"></i>전망(검증 통과)</span>':'')+'</div>'];

  if(f.show){
    body.push('<div class="note" style="margin-top:14px">'+
      '<b>'+esc(scope)+' · '+qLabel(f.next_q)+' 전망 '+won(f.value)+'원</b> · 방법 '+esc(f.method_ko)+
      '<div class="metrics"><span>검증 오차 MAPE <b>'+f.mape+'%</b></span>'+
      '<span>MAE <b>'+won(f.mae)+'원</b></span><span>RMSE <b>'+won(f.rmse)+'원</b></span>'+
      '<span>기준선(직전 분기 유지) MAPE <b>'+f.baseline_mape+'%</b></span>'+
      '<span>검증 구간 <b>'+f.holdout_n+'분기</b></span></div>'+
      '<p style="margin:8px 0 0;font-size:11.5px;color:var(--ink3)">검증 구간은 학습에 전혀 쓰지 않은 최근 '+f.holdout_n+'분기입니다. 이 방법이 기준선보다 오차가 낮았을 때만 전망을 표시합니다.</p></div>');
  } else {
    body.push('<div class="note warn" style="margin-top:14px"><b>전망을 표시하지 않습니다.</b><br>'+
      esc(f.reason||'검증 기준 미달')+'.'+
      (f.baseline_mape!=null?' 기준선(직전 분기 유지)의 검증 오차는 '+f.baseline_mape+'%입니다.':'')+
      '<p style="margin:8px 0 0;font-size:11.5px;color:var(--ink3)">맞을 확률이 동전 던지기보다 나을 근거가 없는 예측은 내보내지 않습니다. 대신 위의 실측 추이와 수요·공급 균형으로 판단하세요.</p></div>');
  }
  return head+body.join('');
}

// 순수 SVG 라인차트 — 라이브러리 없음(용량·인수인계 부담 없음).
function drawChart(qs, vals, fc, fq){
  var pts=[], W=760, H=230, PL=52, PR=14, PT=14, PB=26;
  var idx=[]; vals.forEach(function(v,i){ if(v!=null){ idx.push(i); } });
  if(idx.length<2) return '<div class="note">그릴 수 있는 분기가 부족합니다.</div>';
  var all=idx.map(function(i){return vals[i];}); if(fc!=null) all=all.concat([fc]);
  var mn=Math.min.apply(null,all), mx=Math.max.apply(null,all);
  var pad=(mx-mn)*0.12||mx*0.1||1; mn=Math.max(0,mn-pad); mx=mx+pad;
  var n=idx.length+(fc!=null?1:0);
  var X=function(k){ return PL+(W-PL-PR)*(n<2?0:k/(n-1)); };
  var Y=function(v){ return PT+(H-PT-PB)*(1-(v-mn)/((mx-mn)||1)); };
  idx.forEach(function(i,k){ pts.push([X(k),Y(vals[i])]); });
  var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
  var area=line+' L'+pts[pts.length-1][0].toFixed(1)+' '+(H-PB)+' L'+pts[0][0].toFixed(1)+' '+(H-PB)+' Z';
  var s=['<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="분기별 매출 추이">'];
  // 가로 눈금 3줄 — 격자를 촘촘히 깔면 데이터보다 격자가 눈에 띈다.
  [0,0.5,1].forEach(function(t){
    var v=mn+(mx-mn)*(1-t), y=PT+(H-PT-PB)*t;
    s.push('<line x1="'+PL+'" y1="'+y.toFixed(1)+'" x2="'+(W-PR)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/>');
    s.push('<text x="'+(PL-8)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--ink3)">'+won(v)+'</text>');
  });
  s.push('<path d="'+area+'" fill="var(--surface)" opacity=".7"/>');
  s.push('<path d="'+line+'" fill="none" stroke="var(--ink)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>');
  var last=pts[pts.length-1];
  s.push('<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.5" fill="var(--ink)"/>');
  if(fc!=null){
    var fx=X(n-1), fy=Y(fc);
    // 전망은 점선 + 반투명. 실측과 시각적으로 절대 헷갈리면 안 된다.
    s.push('<path d="M'+last[0].toFixed(1)+' '+last[1].toFixed(1)+' L'+fx.toFixed(1)+' '+fy.toFixed(1)+'" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4" opacity=".85"/>');
    s.push('<circle cx="'+fx.toFixed(1)+'" cy="'+fy.toFixed(1)+'" r="4" fill="none" stroke="var(--accent)" stroke-width="2"/>');
  }
  // x축 라벨은 처음·중간·마지막만. 21개 다 쓰면 읽을 수 없다.
  // 전망점이 있으면 마지막 실측 라벨과 겹치므로 그 라벨은 빼고 전망 분기만 쓴다.
  var ticks = fc!=null ? [0, Math.floor((idx.length-1)/2)] : [0, Math.floor((idx.length-1)/2), idx.length-1];
  ticks.forEach(function(k){
    s.push('<text x="'+X(k).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--ink3)">'+qs[idx[k]].slice(2,4)+'년 '+qs[idx[k]].slice(4)+'Q</text>');
  });
  if(fc!=null) s.push('<text x="'+X(n-1).toFixed(1)+'" y="'+(H-8)+'" text-anchor="end" font-size="10" fill="var(--accent)">'+(fq?fq.slice(2,4)+'년 '+fq.slice(4)+'Q 전망':'전망')+'</text>');
  // Hover — 각 분기 위에 넉넉한 투명 원을 얹는다. 마우스가 정확히 선 위에 없어도 잡히게.
  // 툴팁 라이브러리를 쓰지 않고 <title> 로 처리한다(의존성 0, 모바일에선 탭으로 뜬다).
  idx.forEach(function(i,k){
    var q=qs[i], lbl=q.slice(2,4)+'년 '+q.slice(4)+'분기 · '+won(vals[i])+'원';
    s.push('<g class="pt"><circle cx="'+X(k).toFixed(1)+'" cy="'+Y(vals[i]).toFixed(1)+
      '" r="3" fill="var(--ink)" opacity="0"/>'+
      '<circle cx="'+X(k).toFixed(1)+'" cy="'+Y(vals[i]).toFixed(1)+
      '" r="14" fill="transparent"><title>'+esc(lbl)+'</title></circle></g>');
  });
  if(fc!=null){
    s.push('<g class="pt"><circle cx="'+X(n-1).toFixed(1)+'" cy="'+Y(fc).toFixed(1)+
      '" r="14" fill="transparent"><title>'+esc((fq?fq.slice(2,4)+'년 '+fq.slice(4)+'분기':'다음 분기')+' 전망 · '+won(fc)+'원')+'</title></circle></g>');
  }
  s.push('</svg>');
  return s.join('');
}

function anomalyBlock(){
  if(!SIG||!SIG.ind) return '';
  var sc=SIG.ind[curInd]; if(!sc) return '';
  if(!sc.anomaly && !sc.watch) return '';
  var isA=!!sc.anomaly;
  return '<div class="note '+(isA?'bad':'')+'"><b>'+esc(curInd)+' — '+esc(sc.anomaly||sc.watch)+'</b><br>'+

    '<p style="margin:8px 0 0;font-size:11.5px;color:var(--ink3)">중앙값·MAD 기반으로 이 업종의 평소 변동폭을 구한 뒤, 최근 값이 그 범위를 얼마나 벗어났는지로 판정합니다. 평균·표준편차를 쓰면 이상치가 평균을 끌어당겨 이상을 놓칩니다.'+
    (isA?'':' 경보 기준(3.0)에는 못 미쳐 참고용으로만 표시합니다.')+'</p></div>';
}

$('#msend').addEventListener('click',function(){

  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){ m.style.color='var(--bad)'; m.textContent='이메일 형식을 확인해 주세요.'; return; }

  m.style.color='var(--ink2)'; m.textContent='보내는 중…';
  fetch('/api/lead',{method:'POST',headers:{'Content-Type':'application/json'},
    // 최소 수집: 이메일 / 조회 상권 / 업종 / 리포트 종류 / 동의. 이름·소속·연락처는 받지 않는다.

                         region:(mz&&mz.gu)||'',industry:curInd||'',format:'pdf'})})
  .then(function(r){return r.json();}).then(function(j){
    if(j.ok){ m.style.color='var(--good)'; m.textContent='신청됐습니다. 리포트를 보내드리겠습니다.'; setTimeout(function(){$('#modal').classList.remove('on');},1400); }
    else if(j.configured===false){ m.style.color='var(--warn)'; m.textContent='리포트 발송 준비 중입니다. 우선 PDF로 저장해 주세요.'; }
    else { m.style.color='var(--bad)'; m.textContent=j.error||'전송에 실패했습니다.'; }
  }).catch(function(){ m.style.color='var(--bad)'; m.textContent='네트워크 오류입니다. 잠시 후 다시 시도해 주세요.'; });
});
})();
