      <p style="margin-top:6px">하위 25% 매출 기준 예상 월 순이익 <b style="color:${profLow>=0?'var(--good)':'var(--bad)'}">${profLow>=0?'':'−'}${won(Math.abs(profLow))}</b>
      (15평·직원2명·서울평균 임대료·단순 시뮬레이션). 두 자치구의 임대료·목 차이는 실제 계약값으로 <a href="report.html?gu=${encodeURIComponent(an)}&ind=${encodeURIComponent(ind)}" style="color:var(--navy2);font-weight:700">진단 리포트</a>에서 확인하세요.</p></div>
    <div class="foot">지표별로 어느 쪽이 유리한지만 보여주고 <b>합산 점수·승패는 내지 않습니다</b> — 지표마다 중요도가 다르고, 상관된 지표(임대료↑↔유동인구↑)를 중복 계산하지 않기 위함입니다. 폐업 건수는 상권 규모에 비례해 판단 보류로 뒀습니다. 실제 창업 판단은 정확한 위치·임대료·동선을 현장에서 확인하세요. 지어낸 값은 없습니다.</div>`;
}
function loadJSON(f){return fetch(f,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);}
function init(){
  const gus=Object.keys(DATA.gu);
  const a=document.getElementById('a'),b=document.getElementById('b'),ind=document.getElementById('ind');
  a.innerHTML=gus.map(g=>`<option>${g}</option>`).join('');
  b.innerHTML=gus.map(g=>`<option>${g}</option>`).join('');
  ind.innerHTML=Object.keys(DATA.ind).map(k=>`<option>${k}</option>`).join('');
  a.value=gus[0]; b.value=gus[1]||gus[0]; ind.value='한식음식점';
  [a,b,ind].forEach(el=>el.onchange=render);
  render();
}
Promise.all([loadJSON('livepop_gu.json'),loadJSON('parking_gu.json')]).then(([p,k])=>{
  if(p&&p.gu)POP=p; if(k&&k.gu)PARK=k;
}).finally(init);
</script>
