<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상권 진단 리포트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#F5F4F0;--panel:#FFFFFF;--panel2:#EFEFEA;--ink:#111112;--ink2:#6E6E73;--ink3:#8E8E93;
  --line:#EAEAE5;--line2:#DCDCD6;--navy:#1D1D1F;--navy2:#1F6FEB;--navyL:#DDE7F8;--r:14px;
  --sh:0 1px 2px rgba(28,28,30,.045),0 12px 30px rgba(28,28,30,.06);
  --good:#1F7A4D;--goodL:rgba(31,122,77,.10);--warn:#A8620F;--warnL:rgba(168,98,15,.10);--bad:#B3503C;--badL:rgba(179,80,60,.10);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0E0F10;--panel:#16181B;--panel2:#23262A;--ink:#ECECEA;--ink2:#9A9DA2;--ink3:#6E7278;--line:#22252A;--line2:#3A3E44;--navy:#6AA5F5;--navy2:#6AA5F5;--navyL:#1E3352;--sh:0 4px 16px rgba(0,0,0,.35);
  --good:#4E9E6A;--goodL:rgba(78,158,106,.14);--warn:#C88A3A;--warnL:rgba(200,138,58,.14);--bad:#C4604E;--badL:rgba(196,96,78,.14);}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;font-feature-settings:"tnum" 1;letter-spacing:-.01em;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55;word-break:keep-all}
.wrap{max-width:860px;margin:0 auto;padding:0 22px}
.top{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-weight:800;font-size:15px;display:flex;gap:9px;align-items:center}
.brand .m{width:28px;height:28px;border-radius:9px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 2px 8px rgba(18,23,33,.2);letter-spacing:-.02em}
.top a,.top button{font:inherit;font-size:13px;color:var(--ink2);text-decoration:none;font-weight:700;background:none;border:none;cursor:pointer;transition:.15s;letter-spacing:-.01em}
.top a:hover,.top button:hover{color:var(--navy2)}
.pdfbtn{color:#fff!important;background:var(--navy)!important;padding:9px 16px;border-radius:10px;box-shadow:0 2px 8px rgba(18,23,33,.16);transition:.15s;letter-spacing:-.01em}
.pdfbtn:hover{transform:translateY(-1px);box-shadow:0 4px 13px rgba(18,23,33,.24)}
.pick{display:flex;gap:12px;flex-wrap:wrap;padding:26px 0 6px}
.pick .f label{font-size:11px;font-weight:700;color:var(--ink2);display:block;margin-bottom:5px}
.pick select,.pick input{font:inherit;font-size:14px;font-weight:600;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--panel);color:var(--ink);min-width:150px;outline:none;transition:border-color .15s,box-shadow .15s}
.pick select:hover,.pick input:hover{border-color:var(--ink3)}
.pick select:focus,.pick input:focus{border-color:var(--navy2);box-shadow:0 0 0 3px var(--navyL)}
.rhead{padding:14px 0 4px}
.rhead .k{font-size:12px;font-weight:700;color:var(--navy2);letter-spacing:.04em}
.rhead h1{font-size:29px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.rhead .date{font-size:12px;color:var(--ink3);margin-top:5px}
.verdict{margin:20px 0;border-radius:16px;padding:22px 24px;border:1px solid var(--line)}
.verdict.g{background:var(--goodL)}.verdict.w{background:var(--warnL)}.verdict.b{background:var(--badL)}
.verdict .tag{font-size:13px;font-weight:800}
.verdict.g .tag{color:var(--good)}.verdict.w .tag{color:var(--warn)}.verdict.b .tag{color:var(--bad)}
.verdict h2{font-size:22px;font-weight:800;margin:6px 0 10px;letter-spacing:-.01em}
.verdict p{font-size:14px;color:var(--ink);line-height:1.6}
.signals{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.sig{display:flex;align-items:center;gap:10px;font-size:13px}
.sig .dot{width:8px;height:8px;border-radius:50%;flex:none}
.sig .txt{color:var(--ink2)}.sig .txt b{color:var(--ink)}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 12px}
.badge{font-size:12.5px;font-weight:700;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel)}
.badge.g{color:var(--good)}.badge.b{color:var(--bad)}
.redflag{background:var(--badL);border:1px solid var(--bad);color:var(--ink);border-radius:12px;padding:13px 16px;font-size:13.5px;font-weight:600;margin:16px 0 0}
.reso{background:var(--warnL,#fff7ed);border:1px solid var(--warn,#f59e0b);color:var(--ink);border-radius:12px;padding:12px 16px;font-size:13px;line-height:1.6;margin:16px 0 0}
.sec{margin-top:30px}
.sec h3{font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:.02em;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border:1px solid var(--line);border-radius:12px;padding:15px 16px;background:var(--panel)}
.tile .l{font-size:11.5px;color:var(--ink2);font-weight:600}
.tile .v{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.tile .s{font-size:11px;color:var(--ink3);margin-top:4px}
.up{color:var(--bad)}.dn{color:var(--good)}
.bepbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}
.beprow{display:flex;justify-content:space-between;padding:11px 15px;font-size:13.5px;border-top:1px solid var(--line)}
.beprow:first-child{border-top:none;background:var(--bg)}.beprow .bk{color:var(--ink2)}.beprow b{font-variant-numeric:tabular-nums}
.bignum{border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-top:6px;background:var(--navyL,var(--bg))}
.bignum b{font-size:26px;font-weight:800;color:var(--navy2,var(--navy));font-variant-numeric:tabular-nums}
.bignum span{display:block;font-size:12px;color:var(--ink3);margin-top:4px}
.scen{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:10px}
.scenrow{display:grid;grid-template-columns:1.3fr 1fr 1fr;align-items:center;padding:11px 15px;font-size:13.5px;border-top:1px solid var(--line)}
.scenrow:first-child{border-top:none}
.scenrow.head{background:var(--bg);color:var(--ink3);font-size:11.5px;font-weight:700}
.scenrow.on{background:var(--navyL,var(--bg))}.scenrow.on>span:first-child{font-weight:800;color:var(--ink)}
.scenrow span:nth-child(2),.scenrow b{text-align:right;font-variant-numeric:tabular-nums}
.scenrow b{font-weight:800}
.foot{margin-top:34px;font-size:11px;color:var(--ink3);border-top:1px solid var(--line);padding-top:14px;line-height:1.7}
.pending{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--ink2);font-size:13px;margin-top:6px}
@media(max-width:640px){.tiles{grid-template-columns:1fr}.rhead h1{font-size:24px}
  .top .wrap{height:auto;flex-wrap:wrap;padding-top:9px;padding-bottom:9px;gap:6px}
  .brand{font-size:14px}
  .top .wrap>div:last-child{width:100%;justify-content:flex-start;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .top a,.top button{font-size:12.5px;white-space:nowrap}.pdfbtn{padding:7px 13px}}
@media print{.top{position:static}.pick,.pdfbtn,.top a{display:none}body{background:#fff}.verdict,.tile,.bepbox{box-shadow:none;break-inside:avoid}.sec{break-inside:avoid}}
/* ── 폴리시: 진입 모션 · 정제 타이포 · 카드 호버 ── */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
body{animation:fadeIn .35s ease both}
.rhead h1{letter-spacing:-.03em;text-wrap:pretty}
.tile{transition:transform .16s,box-shadow .16s,border-color .16s}
.tile:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(28,28,30,.10);border-color:var(--line2)}
</style>
</head>

    <div class="tile"><div class="l">서울 임대료</div><div class="v">${RENT.rent.toFixed(1)}</div><div class="s">만원/㎡(서울평균 ${DATA.quarter}) · 공실 ${RENT.vacancy||'—'}%(표본)</div></div>
  </div></div>

  <div class="sec"><h3>업종 진단 · ${ind}</h3><div class="tiles">
    <div class="tile"><div class="l">업종 폐업률</div><div class="v">${STORES&&STORES.ind[ind]?STORES.ind[ind].close_rate+'%':'—'}</div><div class="s">${STORES&&STORES.ind[ind]?'점포 '+num(STORES.ind[ind].stores)+'개':'수집 대기'}</div></div>
    <div class="tile"><div class="l">객단가(실측)</div><div class="v">${num(unit)}원</div><div class="s">${SGU?gu+' 실측 · 카드':SALES?'서울 · 카드 실적':'추정'}</div></div>
    <div class="tile"><div class="l">상권 평균매출의 중위</div><div class="v">${won(i.p50)}</div><div class="s">점포 아닌 상권 평균 · 추정</div></div>
  </div>${salesLine?`<div class="pending" style="border-style:solid">${salesLine}</div>`:''}</div>

  <div class="sec"><h3>손익분기 시뮬레이션 (내 조건: ${area}평 · 직원 ${staff}명)</h3>
    <div class="pending" style="border-style:solid;margin-bottom:8px;border-color:var(--navy2,var(--navy))">이 값은 <b>사업계획서용 예상손익이 아니라</b>, 입력 조건에 따른 <b>단순 시뮬레이션</b>입니다. 배달·카드 수수료, 4대보험, 공과금, 광고·소모품, 부가세, 권리금·대출이자, 사장님 본인 노동비용 등은 빠져 있어 실제 순이익은 더 낮을 수 있습니다.</div>
    <div class="bignum">본전까지 하루 <b>${needDay.toLocaleString()}명</b><span>객단가 ${num(unit)}원 · 월 26일 영업 기준 · 사장님이 직접 셀 수 있는 유일한 숫자</span></div>
    <div class="bepbox">
      <div class="beprow"><span class="bk">월 고정비 (임대료+인건비+기타)</span><b>${won(fixed)}</b></div>
      <div class="beprow"><span class="bk">손익분기 매출 (원가율 ${i.cogs}%)</span><b>${won(bep)}</b></div>
      <div class="beprow"><span class="bk">임대료 부담률 <span style="color:var(--ink3)">보수매출 대비</span></span><b style="color:${rentCost/i.p25>0.2?'var(--bad)':'var(--ink)'}">${Math.round(rentCost/i.p25*100)}%</b></div>
    </div>
    <div class="pending" style="border-style:solid;margin-top:8px;font-size:12px">임대료 부담률 = 월 임대료 ÷ 보수(하위25%) 매출. <b>절대 적정선은 업종·원가구조마다 달라</b> 단일 기준으로 판단하지 말고 <b>같은 업종끼리 비교</b>하세요(외식업은 통상 10%대를 넘으면 부담이 큰 편).</div>
    <div class="scen">
      <div class="scenrow head"><span>시나리오</span><span>상권 평균매출</span><span>월 순이익</span></div>
      <div class="scenrow on"><span>보수 (하위 25%) · 기본</span><span>${won(i.p25)}</span><b style="color:${pLow>=0?'var(--good)':'var(--bad)'}">${pLow>=0?'':'−'}${won(Math.abs(pLow))}</b></div>
      <div class="scenrow"><span>기본 (중위)</span><span>${won(i.p50)}</span><b style="color:${pMid>=0?'var(--good)':'var(--bad)'}">${pMid>=0?'':'−'}${won(Math.abs(pMid))}</b></div>
      <div class="scenrow"><span>낙관 (상위 25%)</span><span>${won(i.p75)}</span><b style="color:${pHigh>=0?'var(--good)':'var(--bad)'}">${pHigh>=0?'':'−'}${won(Math.abs(pHigh))}</b></div>
    </div>
    <div class="pending" style="border-style:solid;margin-top:10px">신규 점포는 통상 <b>상권 평균 이하</b>에서 시작하므로 <b>보수(하위 25%)를 기본</b>으로 봅니다. 위 매출은 개별 점포가 아니라 '<b>상권 평균매출의 분위값</b>'이라 실제와 다를 수 있습니다.</div>
    <div class="pending" style="border-style:solid;margin-top:8px">전국 평균 영업이익 <b>월 258만</b>과 비교(보수 기준): <b style="color:var(--ink)">${pLow-258>=0?'+':'−'}${won(Math.abs(pLow-258))}</b> ${pLow-258>=0?'많음':'적음'}. <span style="color:var(--ink3)">※ 이 258만은 <b>지금 살아있는</b> 사업장만의 평균(폐업한 곳은 미포함, 생존자 편향)이고 <b>사장님 본인 인건비는 빠져</b> 있습니다. 최저임금 환산 근로소득(월 약 215만)과도 비교해 "이 돈 벌려고 이만큼 일하는가"를 함께 보세요.</span></div></div>

  <div class="sec"><h3>매출예측</h3><div class="pending" style="border-style:solid">${fcLine}</div></div>

  <div class="foot">데이터: 국세청 폐업통계 · 한국부동산원 임대동향 · 서울 상권분석서비스(추정매출·점포) · 서울 생활인구 · 통계청 생존율/실태조사. 추정치는 개별 점포와 다를 수 있으며, 손익분기·순이익은 입력값 기준 계산이며, 임대료·기타비는 추정 가정이라 실제와 다를 수 있습니다. 이 리포트는 공개 통계 신호를 <b>합치지 않고 그대로</b> 보여줄 뿐이며, 종합 점수·투자 권유가 아닙니다. 최종 판단은 사장님 몫입니다.</div>`;
  document.getElementById('report').innerHTML=H;
}

function loadJSON(f){return fetch(f,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);}
function init(){
  const gs=document.getElementById('p-gu'), is=document.getElementById('p-ind');
  gs.innerHTML=Object.keys(DATA.gu).map(k=>`<option>${k}</option>`).join('');
  is.innerHTML=Object.keys(DATA.ind).map(k=>`<option>${k}</option>`).join('');
  const q=new URLSearchParams(location.search);
  if(q.get('gu')&&DATA.gu[q.get('gu')])gs.value=q.get('gu');
  if(q.get('ind')&&DATA.ind[q.get('ind')])is.value=q.get('ind'); else is.value='한식음식점';
  if(q.get('area')&&+q.get('area')>0)document.getElementById('p-area').value=+q.get('area');
  ['p-gu','p-ind','p-area','p-staff','p-rent'].forEach(id=>document.getElementById(id).oninput=render);
  ['p-gu','p-ind'].forEach(id=>document.getElementById(id).onchange=render);
  render();
}
Promise.all([loadJSON('livepop_gu.json'),loadJSON('sales_by_industry.json'),loadJSON('stores_by_industry.json'),loadJSON('sales_forecast.json'),loadJSON('repop.json'),loadJSON('store_gu_ind.json'),loadJSON('sales_gu_ind.json')]).then(([p,s,t,f,r,sg,sgu])=>{
  if(p&&p.gu)POP=p; if(s&&s.ind)SALES=s; if(t&&t.ind)STORES=t; if(f&&f.ind)FORECAST=f; if(r&&r.tot)REPOP=r;
  if(sg&&sg.available&&sg.gu)STOREGU=sg; if(sgu&&sgu.available&&sgu.gu)SALESGU=sgu;
}).finally(init);
</script>
</body>
