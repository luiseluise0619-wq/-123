<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>상권 진단 리포트</title>
<style>
:root{
  --bg:#F7F8FA;--panel:#FFFFFF;--ink:#0F172A;--ink2:#64748B;--ink3:#94A3B8;
  --line:#E5E7EB;--navy:#1E3A5F;--navy2:#2A78D6;--navyL:#EAF0F7;--r:14px;
  --sh:0 1px 2px rgba(16,24,40,.04),0 4px 16px rgba(16,24,40,.05);
  --good:#15803D;--goodL:rgba(21,128,61,.10);--warn:#B45309;--warnL:rgba(180,83,9,.10);--bad:#B91C1C;--badL:rgba(185,28,28,.10);
  --s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0B0E13;--panel:#141922;--ink:#F1F5F9;--ink2:#94A3B8;--ink3:#64748B;--line:#232B36;--navy:#6BA1E0;--navy2:#3987E5;--navyL:#182230;--sh:0 4px 16px rgba(0,0,0,.35);
  --good:#4ade80;--goodL:rgba(74,222,128,.12);--warn:#fbbf24;--warnL:rgba(251,191,36,.12);--bad:#f87171;--badL:rgba(248,113,113,.12);}}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",Inter,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;line-height:1.55}
.wrap{max-width:860px;margin:0 auto;padding:0 22px}
.top{border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:10}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:56px}
.brand{font-weight:800;font-size:15px;display:flex;gap:9px;align-items:center}
.brand .m{width:26px;height:26px;border-radius:7px;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.top a,.top button{font:inherit;font-size:13px;color:var(--navy2);text-decoration:none;font-weight:600;background:none;border:none;cursor:pointer}
.pdfbtn{color:#fff!important;background:var(--navy)!important;padding:8px 14px;border-radius:9px}
.pick{display:flex;gap:12px;flex-wrap:wrap;padding:26px 0 6px}
.pick .f label{font-size:11px;font-weight:700;color:var(--ink2);display:block;margin-bottom:5px}
.pick select,.pick input{font:inherit;font-size:14px;font-weight:600;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);min-width:150px}
.rhead{padding:14px 0 4px}
.rhead .k{font-size:12px;font-weight:700;color:var(--navy2);letter-spacing:.04em}
.rhead h1{font-size:29px;font-weight:800;letter-spacing:-.02em;margin-top:6px}
.rhead .date{font-size:12px;color:var(--ink3);margin-top:5px}
.verdict{margin:20px 0;border-radius:16px;padding:22px 24px;border:1px solid var(--line)}
.verdict.g{background:var(--goodL)}.verdict.w{background:var(--warnL)}.verdict.b{background:var(--badL)}
.verdict .tag{font-size:13px;font-weight:800}
.verdict.g .tag{color:var(--good)}.verdict.w .tag{color:var(--warn)}.verdict.b .tag{color:var(--bad)}
.verdict h2{font-size:22px;font-weight:800;margin:6px 0 10px;letter-spacing:-.01em}
.verdict p{font-size:14px;color:var(--ink);line-height:1.6}
.signals{margin-top:16px;display:flex;flex-direction:column;gap:8px}
.sig{display:flex;align-items:center;gap:10px;font-size:13px}
.sig .dot{width:8px;height:8px;border-radius:50%;flex:none}
.sig .txt{color:var(--ink2)}.sig .txt b{color:var(--ink)}
.sec{margin-top:30px}
.sec h3{font-size:13px;font-weight:800;color:var(--ink2);letter-spacing:.02em;margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.tile{border:1px solid var(--line);border-radius:12px;padding:15px 16px;background:var(--panel)}
.tile .l{font-size:11.5px;color:var(--ink2);font-weight:600}
.tile .v{font-size:22px;font-weight:800;margin-top:4px;letter-spacing:-.02em}
.tile .s{font-size:11px;color:var(--ink3);margin-top:4px}
.up{color:var(--bad)}.dn{color:var(--good)}
.bepbox{border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-top:6px}
.beprow{display:flex;justify-content:space-between;padding:11px 15px;font-size:13.5px;border-top:1px solid var(--line)}
.beprow:first-child{border-top:none;background:var(--bg)}.beprow .bk{color:var(--ink2)}.beprow b{font-variant-numeric:tabular-nums}
.foot{margin-top:34px;font-size:11px;color:var(--ink3);border-top:1px solid var(--line);padding-top:14px;line-height:1.7}
.pending{border:1px dashed var(--line);border-radius:12px;padding:16px;color:var(--ink2);font-size:13px;margin-top:6px}
@media(max-width:640px){.tiles{grid-template-columns:1fr}.rhead h1{font-size:24px}}
@media print{.top{position:static}.pick,.pdfbtn,.top a{display:none}body{background:#fff}.verdict,.tile,.bepbox{box-shadow:none;break-inside:avoid}.sec{break-inside:avoid}}
</style>
</head>

    const peak=tmzL[d.tmzon.indexOf(Math.max(...d.tmzon))];
    salesLine=`객단가 <b>${num(d.unit)}원</b> · 매출 피크 <b>${peak}시간대</b> · 주말 비중 <b>${Math.round(d.dow[5]+d.dow[6])}%</b>`;}
  let fcLine='예측 대상 아님 — 이 업종은 통계상 매출예측이 관성(전분기 유지)을 못 이겨, 예측 대신 위 손익분기로 판단하세요.';
  if(FORECAST&&FORECAST.ind[ind]&&FORECAST.ind[ind].beats_naive){const f=FORECAST.ind[ind];
    fcLine=`이 업종은 계절성이 뚜렷해 예측 가능 — 백테스트 오차 <b>${f.mape}%</b>(관성 ${f.naive_mape}%보다 정확).`;}
  const sc=v=>v>0?'var(--good)':v<0?'var(--bad)':'var(--ink3)';
  const H=`
  <div class="rhead"><div class="k">상권 진단 리포트 · 공공데이터 기반</div>
    <h1>${gu} · ${ind}</h1><div class="date">${new Date().toLocaleDateString('ko-KR')} 생성 · 기준 ${DATA.quarter}</div></div>
  <div class="verdict ${cls}"><span class="tag">종합 판정: ${tag}</span><h2>${head}</h2>
    <p>아래 신호들을 합산한 결과입니다. 점수 대신 <b>근거를 그대로 보여드립니다</b> — 지어낸 예측이 아니라 공개 통계 기반 판단입니다.</p>
    <div class="signals">${S.map(s=>`<div class="sig"><span class="dot" style="background:${sc(s[0])}"></span><span class="txt">${s[1]}</span></div>`).join('')}</div></div>

  <div class="sec"><h3>지역 진단 · ${gu}</h3><div class="tiles">
    <div class="tile"><div class="l">2024 폐업</div><div class="v">${num(g.y2024)}</div><div class="s ${g.trend>=0?'up':'dn'}">${g.trend>=0?'▲':'▼'} 2년 ${Math.abs(g.trend)}%</div></div>
    <div class="tile"><div class="l">유동인구</div><div class="v">${POP&&POP.gu[gu]?num(POP.gu[gu].tot):'—'}</div><div class="s">${POP?POP.hour+'시 기준':'수집 대기'}</div></div>
    <div class="tile"><div class="l">서울 임대료</div><div class="v">${RENT.rent.toFixed(1)}</div><div class="s">만원/㎡(서울평균) · 공실 ${RENT.vacancy||'—'}%</div></div>
  </div></div>

  <div class="sec"><h3>업종 진단 · ${ind}</h3><div class="tiles">
    <div class="tile"><div class="l">업종 폐업률</div><div class="v">${STORES&&STORES.ind[ind]?STORES.ind[ind].close_rate+'%':'—'}</div><div class="s">${STORES&&STORES.ind[ind]?'점포 '+num(STORES.ind[ind].stores)+'개':'수집 대기'}</div></div>
    <div class="tile"><div class="l">객단가(실측)</div><div class="v">${SALES&&SALES.ind[ind]?num(SALES.ind[ind].unit)+'원':num(i.unit)+'원'}</div><div class="s">${SALES?'카드 실적':'추정'}</div></div>
    <div class="tile"><div class="l">중위 월매출</div><div class="v">${won(i.p50)}</div><div class="s">점포당 · 추정</div></div>
  </div>${salesLine?`<div class="pending" style="border-style:solid">${salesLine}</div>`:''}</div>

  <div class="sec"><h3>손익분기 · 순이익 (내 조건: ${area}평 · 직원 ${staff}명)</h3>
    <div class="bepbox">
      <div class="beprow"><span class="bk">월 고정비 (임대료+인건비+기타)</span><b>${won(fixed)}</b></div>
      <div class="beprow"><span class="bk">손익분기 매출 (원가율 ${i.cogs}%)</span><b>${won(bep)}</b></div>
      <div class="beprow"><span class="bk">업종 중위매출</span><b>${won(med)}</b></div>
      <div class="beprow" style="background:var(--bg)"><span class="bk" style="font-weight:800;color:var(--ink)">예상 월 순이익</span><b style="color:${profit>=0?'var(--good)':'var(--bad)'};font-size:15px">${profit>=0?'':'−'}${won(Math.abs(profit))}</b></div>
    </div>
    <div class="pending" style="border-style:solid;margin-top:10px">전국 평균 영업이익(월 258만)과 비교: <b style="color:var(--ink)">${profit-258>=0?'+':'−'}${won(Math.abs(profit-258))}</b> ${profit-258>=0?'많음':'적음'}.</div></div>

  <div class="sec"><h3>매출예측</h3><div class="pending" style="border-style:solid">${fcLine}</div></div>

  <div class="foot">데이터: 국세청 폐업통계 · 한국부동산원 임대동향 · 서울 상권분석서비스(추정매출·점포) · 서울 생활인구 · 통계청 생존율/실태조사. 추정치는 개별 점포와 다를 수 있으며, 손익분기·순이익은 입력값 기준 계산이며, 임대료·기타비는 추정 가정이라 실제와 다를 수 있습니다. 이 판정은 공개 통계 신호의 합산이며 투자 권유가 아닙니다.</div>`;
  document.getElementById('report').innerHTML=H;
}

function loadJSON(f){return fetch(f,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);}
function init(){
  const gs=document.getElementById('p-gu'), is=document.getElementById('p-ind');
  gs.innerHTML=Object.keys(DATA.gu).map(k=>`<option>${k}</option>`).join('');
  is.innerHTML=Object.keys(DATA.ind).map(k=>`<option>${k}</option>`).join('');
  const q=new URLSearchParams(location.search);
  if(q.get('gu')&&DATA.gu[q.get('gu')])gs.value=q.get('gu');
  if(q.get('ind')&&DATA.ind[q.get('ind')])is.value=q.get('ind'); else is.value='한식음식점';
  ['p-gu','p-ind','p-area','p-staff'].forEach(id=>document.getElementById(id).oninput=render);
  ['p-gu','p-ind'].forEach(id=>document.getElementById(id).onchange=render);
  render();
}
Promise.all([loadJSON('livepop_gu.json'),loadJSON('sales_by_industry.json'),loadJSON('stores_by_industry.json'),loadJSON('sales_forecast.json'),loadJSON('repop.json')]).then(([p,s,t,f,r])=>{
  if(p&&p.gu)POP=p; if(s&&s.ind)SALES=s; if(t&&t.ind)STORES=t; if(f&&f.ind)FORECAST=f; if(r&&r.tot)REPOP=r;
}).finally(init);
</script>
</body>
</html>
