<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>창업 지원 제도 찾기 · 사장님인사이트</title>
<meta name="description" content="창업 준비 단계와 필요한 것을 고르면 해당하는 정부·지자체 지원 제도를 보여드립니다.">
<link rel="stylesheet" href="theme.css">
<script src="command.js" defer></script>
<script src="si-context.js"></script>
<style>
/* 색·타이포·버튼·칩은 theme.css. 여기는 이 화면 배치만. */

/* 질문 하나씩 — 한 번에 다 묻지 않는다 */
.qa{padding:var(--sp-6) 0;border-top:1px solid var(--line-soft)}
.qa:first-of-type{border-top:0;padding-top:var(--sp-4)}
.qa h2{font-size:var(--f-head);font-weight:600;letter-spacing:var(--ls-head);margin:0}
.qa h2 i{font-style:normal;color:var(--ink3);font-weight:500;margin-right:var(--sp-3)}
.qa .hint{font-size:var(--f-cap);color:var(--ink3);margin:var(--sp-2) 0 0}
.qa .tabs{display:flex;gap:var(--sp-2);flex-wrap:wrap;margin-top:var(--sp-4)}
.chip.two{height:auto;padding:var(--sp-3) var(--sp-4);text-align:left;line-height:1.35;
  flex-direction:column;align-items:flex-start;gap:2px;border-radius:var(--r-md)}
.chip.two b{font-weight:600;color:var(--ink)}
.chip.two span{font-size:var(--f-cap);color:var(--ink3);font-weight:400}
.chip.two.on b{color:inherit}
.chip.two.on span{color:inherit;opacity:.7}

/* 목록 — 카드 없이 행으로 */
.list .row{display:grid;grid-template-columns:1fr auto;gap:var(--sp-4);align-items:center;
  padding:var(--sp-5) var(--sp-4);margin:0 calc(var(--sp-4) * -1);
  border-top:1px solid var(--line-soft);border-radius:var(--r-md);
  transition:background var(--t-fast) var(--ease)}
.list .row:hover{background:var(--surface)}
.list .row .nm{font-size:var(--f-body);font-weight:600;letter-spacing:-.01em}
.list .row .sub{font-size:var(--f-cap);color:var(--ink3);margin-top:3px}
.list .row .when{text-align:right;white-space:nowrap}
.list .row .when b{display:block;font-variant-numeric:tabular-nums;font-weight:600}
.list .row .when small{font-size:var(--f-cap);color:var(--ink3)}
.dday{color:var(--down)}

.warnbox{border-left:2px solid var(--warn);background:var(--warn-weak);
  padding:var(--sp-4) var(--sp-5);border-radius:var(--r-sm);margin-top:var(--sp-5);
  font-size:var(--f-sub);color:var(--ink2);line-height:1.7}
.warnbox b{color:var(--ink)}
</style>
</head>
<body>
<header class="sitehead">
  <div class="headwrap">
    <a class="brand" href="/">사장님인사이트 <span>· 지원 제도</span></a>
    <button class="cmdk-btn" data-cmdk-open type="button" aria-label="검색"><span>검색</span><kbd>⌘K</kbd></button>
    <nav>
    <a href="zone.html" class="navlink">인텔리전스</a>
    <a href="mvp.html" class="navlink">진단</a>
    <a href="compare.html" class="navlink">비교</a>
    <a href="building.html" class="navlink">건물 지도</a>
    <a href="index.html#chat" class="navlink">상담</a>
  </nav>
  </div>
</header>

<main class="wrap">
  <div class="pagehead">
    <h1 class="t-display">받을 수 있는<br>지원이 있는지</h1>
    <p class="pagesub">두 가지만 고르면 해당하는 제도를 모아 보여드립니다.</p>
  </div>

  <section class="sec" style="padding-top:0">
    <div class="qa">
      <h2><i>1</i>지금 어느 단계세요?</h2>
      <p class="hint">업력에 따라 신청할 수 있는 제도가 다릅니다.</p>
      <div class="tabs" id="q_stage"></div>
    </div>

    <div class="qa" id="q2" hidden>
      <h2><i>2</i>무엇이 필요하세요?</h2>
      <p class="hint">여러 개 고를 수 있습니다.</p>
      <div class="tabs" id="q_need"></div>
    </div>

    <div id="out"></div>
  </section>
</main>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s);};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};

// 단계·필요는 우리가 정한 분류다. 공고 원문의 분류와 1:1 이 아니므로
// '거르는 기준'이 아니라 '찾는 말'로만 쓴다 — 애매하면 빼지 않고 보여준다.
var STAGES=[
  {id:'pre', nm:'창업 준비 중', d:'아직 사업자등록 전', kw:['예비','창업교육','창업준비']},
  {id:'y1',  nm:'1년 미만',     d:'막 시작했어요',      kw:['초기','신규','1년','재도전']},
  {id:'y3',  nm:'1~3년',        d:'자리 잡는 중',       kw:['도약','성장','소상공인']},
  {id:'old', nm:'3년 이상',     d:'계속 하고 있어요',   kw:['소상공인','재도약','경영개선','전환']}
];
var NEEDS=[
  {id:'fund', nm:'자금',        d:'융자 · 보조금',  kw:['자금','융자','보조','지원금','바우처']},
  {id:'space',nm:'공간',        d:'임대료 · 시설',  kw:['임대','공간','시설','점포','환경개선']},
  {id:'edu',  nm:'교육 · 컨설팅',d:'배우고 상담받기',kw:['교육','컨설팅','멘토','상담','아카데미']},
  {id:'sale', nm:'판로 · 홍보',  d:'파는 걸 돕는',   kw:['판로','마케팅','홍보','온라인','수출']}
];

var stage=null, needs=[], DATA=null;

$('#q_stage').innerHTML=STAGES.map(function(s){
  return '<button class="chip two" data-stage="'+s.id+'"><b>'+esc(s.nm)+'</b><span>'+esc(s.d)+'</span></button>';
}).join('');
$('#q_need').innerHTML=NEEDS.map(function(n){
  return '<button class="chip two" data-need="'+n.id+'"><b>'+esc(n.nm)+'</b><span>'+esc(n.d)+'</span></button>';
}).join('');

$('#q_stage').addEventListener('click',function(e){
  var b=e.target.closest('[data-stage]'); if(!b) return;
  stage=b.dataset.stage;
  Array.prototype.forEach.call(this.children,function(x){ x.classList.toggle('on', x.dataset.stage===stage); });
  $('#q2').hidden=false;
  load();
});
$('#q_need').addEventListener('click',function(e){
  var b=e.target.closest('[data-need]'); if(!b) return;
  var i=needs.indexOf(b.dataset.need);
  if(i>=0) needs.splice(i,1); else needs.push(b.dataset.need);
  Array.prototype.forEach.call(this.children,function(x){ x.classList.toggle('on', needs.indexOf(x.dataset.need)>=0); });
  draw();
});

function load(){
  if(DATA){ draw(); return; }
  $('#out').innerHTML='<div class="skel" style="height:90px;margin-top:var(--sp-6)"></div>';
  fetch('/api/support',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'})
    .then(function(r){return r.json();})
    .then(function(j){ DATA=j; draw(); })
    .catch(function(){ DATA={ok:false,error:'공고를 불러오지 못했습니다.'}; draw(); });
}

function dday(dl){
  if(!dl) return null;
  var d=new Date(dl+'T00:00:00'), t=new Date(); t.setHours(0,0,0,0);
  return Math.round((d-t)/86400000);
}

function draw(){
  var box=$('#out');
  if(!DATA) return;
  if(DATA.configured===false){
    box.innerHTML='<div class="state" style="margin-top:var(--sp-6)"><p class="t">아직 연결되지 않았습니다</p>'+
      '<p class="d">'+esc(DATA.error||'')+'</p></div>';
    return;
  }
  if(!DATA.ok){
    box.innerHTML='<div class="state" style="margin-top:var(--sp-6)"><p class="t">불러오지 못했습니다</p>'+
      '<p class="d">'+esc(DATA.error||'')+'</p>'+
      '<button class="btn btn-secondary btn-sm" onclick="location.reload()">다시 시도</button></div>';
    return;
  }
  var all=DATA.items||[];
  var sk=(STAGES.filter(function(s){return s.id===stage;})[0]||{}).kw||[];
  var nk=[]; needs.forEach(function(id){
    NEEDS.forEach(function(n){ if(n.id===id) nk=nk.concat(n.kw); });
  });

  // 거르는 규칙 — 애매하면 빼지 않는다.
  // 우리 분류와 공고의 표현이 다를 수 있어서, 못 맞춘 것을 버리면 진짜 필요한 제도가 사라진다.
  function hit(it, kws){
    if(!kws.length) return true;
    var t=(it.title+' '+it.target+' '+it.kind).toLowerCase();
    for(var i=0;i<kws.length;i++) if(t.indexOf(kws[i].toLowerCase())>=0) return true;
    return false;
  }
  var matched=all.filter(function(it){ return hit(it,sk) && hit(it,nk); });
  var rest=all.filter(function(it){ return matched.indexOf(it)<0; });

  var H=[];
  H.push('<h2 class="t-head" style="margin-top:var(--sp-7)">조건에 해당할 수 있는 제도 '+matched.length+'건</h2>');
  H.push('<p class="t-sub" style="margin-top:var(--sp-2)">마감이 지난 공고는 빼고 <b>마감이 가까운 순</b>으로 놓았습니다.</p>');

  if(!matched.length){
    H.push('<div class="state" style="margin-top:var(--sp-5)"><p class="t">고른 조건에 맞는 공고가 지금은 없습니다</p>'+
      '<p class="d">조건을 줄여 보시거나, 아래 전체 목록을 보세요.</p></div>');
  } else {
    H.push(rows(matched.slice(0,30)));
  }
  if(rest.length){
    H.push('<details class="disclose" style="margin-top:var(--sp-5)">'+
      '<summary>조건에 안 걸린 나머지 '+rest.length+'건도 보기</summary>'+
      '<div class="list" style="padding-bottom:var(--sp-4)">'+rows(rest.slice(0,50))+'</div>'+
      '<p class="t-cap">우리 분류와 공고의 표현이 달라 못 걸러졌을 수 있습니다. 여기서 직접 찾아보세요.</p></details>');
  }

  H.push('<div class="warnbox">'+
    '<b>자격을 판정한 목록이 아닙니다.</b><br>'+
    '실제 신청 자격은 업력·매출·지역·업종·소상공인 여부에 따라 다르고, 공고마다 조건이 다릅니다. '+
    '여기 있는 것은 <b>조건에 해당할 수 있는 공고</b>이며, 신청 가능 여부는 <b>반드시 원문에서 확인</b>하세요.'+
    (DATA.undated? '<br>마감일을 읽지 못한 공고 '+DATA.undated+'건이 포함돼 있습니다(상시 모집일 수 있습니다).':'')+
    (DATA.expired? ' 마감이 지난 '+DATA.expired+'건은 제외했습니다.':'')+
    '</div>');
  box.innerHTML=H.join('');
}

function rows(list){
  return '<div class="list">'+list.map(function(it){
    var d=dday(it.deadline);
    var when = d==null ? '<b>상시</b><small>마감일 미표기</small>'
             : '<b class="'+(d<=7?'dday':'')+'">D-'+d+'</b><small>'+esc(it.deadline)+'</small>';
    var sub=[it.org, it.kind, it.region].filter(Boolean).join(' · ');
    var inner='<div><div class="nm">'+esc(it.title)+'</div>'+
      (sub?'<div class="sub">'+esc(sub)+'</div>':'')+'</div>'+
      '<div class="when">'+when+'</div>';
    // 원문 링크가 있으면 행 전체가 링크다. 없으면 링크로 만들지 않는다(가짜 링크 금지).
    return it.url
      ? '<a class="row" href="'+esc(it.url)+'" target="_blank" rel="noopener" style="color:inherit">'+inner+'</a>'
      : '<div class="row">'+inner+'</div>';
  }).join('')+'</div>';
}
})();
</script>

  <div class="footwrap">
    <a href="trends.html">연도별 추이</a>

    <a href="about.html">소개</a>
    <span class="footsrc">출처 공공데이터포털 창업지원사업 공고 · 서울시 상권분석서비스</span>
  </div>
</footer>
</body>
</html>
