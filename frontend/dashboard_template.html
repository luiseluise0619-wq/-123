<title>사장님인사이트 — 상권 데이터 대시보드</title>
<style>
  :root{
    --bg:#f5f7fa; --card:#ffffff; --card2:#fafbfd;
    --ink:#0f1826; --mut:#5a687d; --faint:#8b98ab; --line:#e6eaf1;
    --brand:#1668b0; --brand-soft:#e8f1fa; --accent:#c17d1f; --accent-soft:#fbf1e0;
    --grid:#eef1f6;
    --g0:#2f9e6b; --g1:#7cc07a; --g2:#c99a1e; --g3:#e07a2f; --g4:#d64545;
    --up:#d64545; --dn:#2f9e6b;
    --shadow:0 1px 2px rgba(16,24,38,.04),0 4px 16px rgba(16,24,38,.05);
    --sans:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  @media(prefers-color-scheme:dark){:root{
    --bg:#0d141e; --card:#161f2c; --card2:#1b2634; --ink:#e9eff7; --mut:#93a2b6; --faint:#5f6e82;
    --line:#243142; --brand:#4a9ee6; --brand-soft:#16283b; --accent:#e6a24a; --accent-soft:#2a2313;
    --grid:#1c2836; --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28);
  }}
  :root[data-theme=dark]{--bg:#0d141e;--card:#161f2c;--card2:#1b2634;--ink:#e9eff7;--mut:#93a2b6;--faint:#5f6e82;--line:#243142;--brand:#4a9ee6;--brand-soft:#16283b;--accent:#e6a24a;--accent-soft:#2a2313;--grid:#1c2836;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.28);}
  :root[data-theme=light]{--bg:#f5f7fa;--card:#ffffff;--card2:#fafbfd;--ink:#0f1826;--mut:#5a687d;--faint:#8b98ab;--line:#e6eaf1;--brand:#1668b0;--brand-soft:#e8f1fa;--accent:#c17d1f;--accent-soft:#fbf1e0;--grid:#eef1f6;--shadow:0 1px 2px rgba(16,24,38,.04),0 4px 16px rgba(16,24,38,.05);}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
  /* header */
  .top{background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
  .top .in{max-width:1120px;margin:0 auto;padding:13px 20px;display:flex;align-items:center;gap:12px}
  .logo{font-weight:800;font-size:18px;letter-spacing:-.02em} .logo b{color:var(--brand)}
  .logo span{display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--accent);margin-right:8px;transform:translateY(-1px)}
  .date{color:var(--faint);font-size:12px;margin-left:auto}
  .themebtn{border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:9px;padding:7px 11px;cursor:pointer;font-size:14px;line-height:1;transition:.15s}
  .themebtn:hover{color:var(--ink);border-color:var(--brand)}
  .themebtn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  /* layout */
  .wrap{max-width:1120px;margin:0 auto;padding:26px 20px 72px}
  .eyebrow{font-size:11.5px;font-weight:800;color:var(--brand);text-transform:uppercase;letter-spacing:.09em}
  h1{font-size:clamp(23px,3.4vw,30px);font-weight:800;margin:6px 0 5px;letter-spacing:-.03em;text-wrap:balance}
  .sub{color:var(--mut);font-size:14px;margin:0;max-width:60ch}
  /* KPI tiles */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0 30px}
  @media(max-width:820px){.kpis{grid-template-columns:repeat(2,1fr)}}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand);opacity:.85}
  .kpi.warn::before{background:var(--accent)}
  .kpi .k{font-size:11.5px;color:var(--faint);font-weight:600;margin-bottom:7px}
  .kpi .v{font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .kpi .v small{font-size:13px;font-weight:600;color:var(--mut)}
  .kpi .d{font-size:11.5px;color:var(--mut);margin-top:5px}
  .kpi .d b{color:var(--up)} .kpi .d b.dn{color:var(--dn)}
  /* section head */
  .sh{display:flex;align-items:baseline;gap:10px;margin:0 2px 13px}
  .sh h2{font-size:16px;font-weight:800;margin:0;letter-spacing:-.02em}
  .sh .hint{font-size:12px;color:var(--faint)}
  .sh .tag{margin-left:auto;font-size:10.5px;font-weight:700;color:var(--brand);background:var(--brand-soft);padding:3px 9px;border-radius:20px}
  /* explorer */
  .bar{display:flex;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);border-radius:13px;padding:11px;box-shadow:var(--shadow)}
  .bar select,.bar input{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card2);color:var(--ink);font-size:14px;font-family:var(--sans)}
  .bar select{min-width:180px;cursor:pointer} .bar input{flex:1;min-width:150px}
  .bar select:focus,.bar input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:var(--brand)}
  .cnt{margin-left:auto;align-self:center;color:var(--faint);font-size:12px}
  .zg{display:grid;grid-template-columns:1fr .82fr;gap:14px;margin-top:13px}
  @media(max-width:860px){.zg{grid-template-columns:1fr}}
  .rightcol{display:flex;flex-direction:column;gap:14px}
  .list{background:var(--card);border:1px solid var(--line);border-radius:13px;max-height:392px;overflow-y:auto;box-shadow:var(--shadow)}
  .list::-webkit-scrollbar{width:8px}.list::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
  .row{display:grid;grid-template-columns:30px 1fr auto auto;gap:10px;align-items:center;padding:10px 15px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .12s}
  .row:last-child{border-bottom:0}
  .row:hover{background:var(--card2)} .row.sel{background:var(--brand-soft)}
  .row.sel .zn{color:var(--brand)}
  .rk{font-family:var(--mono);font-size:11px;color:var(--faint);text-align:right;font-variant-numeric:tabular-nums}
  .zn{font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .zn small{display:block;color:var(--faint);font-weight:400;font-size:10.5px;margin-top:1px}
  .rev{font-family:var(--mono);font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
  .gr{font-family:var(--mono);font-weight:800;font-size:12px;min-width:30px;text-align:center;border-radius:6px;padding:2px 5px}
  .gA{background:var(--g0);color:#04180f} .gB{background:var(--g1);color:#08240f} .gC{background:var(--g2);color:#2e2405}
  .gD{background:var(--g3);color:#fff} .gF{background:var(--g4);color:#fff}
  .detail{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:16px 18px;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .ml{margin-top:11px;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:linear-gradient(180deg,var(--brand-soft),transparent)}
  .ml .mlh{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--brand);margin-bottom:9px}
  .ml .mlh .b{font-size:9.5px;font-weight:700;background:var(--brand);color:#fff;padding:1px 6px;border-radius:10px;letter-spacing:.02em}
  .ml .prob{display:flex;align-items:baseline;gap:7px;margin-bottom:6px}
  .ml .prob .pv{font-size:27px;font-weight:800;font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
  .ml .prob .pl{font-size:12px;color:var(--mut)}
  .ml .track{height:8px;border-radius:5px;background:var(--grid);overflow:hidden;margin-bottom:9px}
  .ml .fill{height:100%;border-radius:5px;transition:width .4s ease}
  .ml .mrow{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:4px}
  .ml .mrow b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
  .ml .mnote{font-size:10.5px;color:var(--faint);margin-top:8px;line-height:1.5}
  .verdict{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
  .detail .z{font-size:17px;font-weight:800;letter-spacing:-.02em}
  .detail .i{color:var(--mut);font-size:12.5px;margin:2px 0 6px}
  .detail .i b{color:var(--brand)}
  .detail{flex:1}
  .graderef{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 16px;box-shadow:var(--shadow)}
  .graderef .gh{font-size:12.5px;font-weight:800;letter-spacing:-.01em;margin-bottom:3px}
  .graderef .gsub{font-size:11px;color:var(--faint);margin-bottom:10px}
  .gscale{display:flex;flex-direction:column;gap:6px}
  .grow{display:flex;align-items:center;gap:9px;font-size:12px}
  .grow .gr{flex-shrink:0}
  .grow .gl{color:var(--mut)} .grow .gp{margin-left:auto;color:var(--faint);font-family:var(--mono);font-variant-numeric:tabular-nums}
  .radar-wrap{display:flex;justify-content:center;margin:2px 0}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
  .stat{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  .stat .l{font-size:10.5px;color:var(--faint)} .stat .n{font-size:15px;font-weight:700;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .empty{color:var(--faint);text-align:center;padding:60px 20px;font-size:13px}
  /* tabs / chart panel */
  .tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow);overflow-x:auto}
  .tab{flex:1;white-space:nowrap;border:0;background:none;color:var(--mut);font-family:var(--sans);font-size:13px;font-weight:700;padding:9px 12px;border-radius:8px;cursor:pointer;transition:.15s}
  .tab:hover{color:var(--ink);background:var(--card2)}
  .tab[aria-selected=true]{background:var(--brand);color:#fff}
  .tab:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;box-shadow:var(--shadow);margin-top:13px;min-height:300px}
  .panel h3{font-size:15px;font-weight:800;margin:0 0 2px;letter-spacing:-.02em}
  .panel .cd{font-size:12px;color:var(--faint);margin:0 0 15px}
  .panel .cd b{color:var(--brand)}
  @media(prefers-reduced-motion:no-preference){.panel{animation:fade .25s ease}}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  svg{display:block;width:100%;overflow:visible} text{font-family:var(--sans)}
  .legend{display:flex;gap:15px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--mut)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px}
  /* tooltip */
  #tip{position:fixed;pointer-events:none;z-index:60;background:var(--ink);color:var(--card);font-size:12px;padding:6px 9px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .1s;white-space:nowrap;font-weight:600}
  #tip .num{font-weight:700}
  .note{margin-top:26px;font-size:11.5px;color:var(--faint);line-height:1.8;border-top:1px solid var(--line);padding-top:14px}
  .note b{color:var(--mut)}
</style>

<div class="top"><div class="in">
  <div class="logo"><span></span>사장님<b>인사이트</b></div>
  <div class="date num" id="date"></div>
  <button class="themebtn" id="theme" aria-label="테마 전환">◐</button>
</div></div>

<div class="wrap">
  <div class="eyebrow">서울 상권 데이터 경영 대시보드</div>
  <h1>여기서 장사, 해도 될까?</h1>
  <p class="sub">서울 전 상권을 매출 등급으로 줄세우고, <b style="color:var(--brand)">AI가 '처음 보는 자리'의 성공확률</b>까지 예측합니다. 식자재 원가·가격 신호는 덤.</p>

  <div class="kpis" id="kpis"></div>

  <div class="sh"><h2>상권 탐색</h2><span class="hint">업종을 고르고 자리를 클릭하세요</span><span class="tag">HERO · 실데이터</span></div>
  <div class="bar">
    <select id="ind" aria-label="업종 선택"></select>
    <input id="q" placeholder="🔍 지역 검색 — 성수 · 강남 · 홍대" aria-label="지역 검색">
    <span class="cnt num" id="cnt"></span>
  </div>
  <div class="zg">
    <div class="list" id="list" role="listbox" aria-label="상권 순위"></div>
    <div class="rightcol">
      <div class="detail" id="detail"></div>
      <div class="graderef" id="graderef"></div>
    </div>
  </div>

  <div class="sh" style="margin-top:34px"><h2>시장 차트</h2><span class="hint">버튼으로 지표를 전환하세요</span><span class="tag">Pro</span></div>
  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-v="forecast" aria-selected="true">🔮 매출 전망</button>
    <button class="tab" role="tab" data-v="bars" aria-selected="false">업종 매출</button>
    <button class="tab" role="tab" data-v="food" aria-selected="false">식자재 원가</button>
    <button class="tab" role="tab" data-v="lines" aria-selected="false">가격 추세</button>
    <button class="tab" role="tab" data-v="sources" aria-selected="false">데이터 출처</button>
  </div>
  <div class="panel" id="panel"></div>

  <p class="note" id="note"></p>
</div>

<div id="tip"></div>

<script id="Z" type="application/json">__ZONES__</script>
<script id="F" type="application/json">__FOOD__</script>
<script id="C" type="application/json">__CHART__</script>
<script>
const ZD=JSON.parse(document.getElementById('Z').textContent);
const Z=ZD.rows, ML=ZD.ml||{};
const FOOD=JSON.parse(document.getElementById('F').textContent);
const C=JSON.parse(document.getElementById('C').textContent);
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const cssv=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const won=n=>n>=10000?(n/10000).toFixed(n>=100000?0:1)+'억':Math.round(n).toLocaleString()+'만';
const wonRaw=n=>n.toLocaleString()+'원';
document.getElementById('date').textContent=new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric'});

// ---- tooltip ----
const tip=$('#tip');
function showTip(e,html){tip.innerHTML=html;tip.style.opacity=1;moveTip(e)}
function moveTip(e){const x=Math.min(e.clientX+14,innerWidth-tip.offsetWidth-8);tip.style.left=x+'px';tip.style.top=(e.clientY-tip.offsetHeight-10)+'px'}
function hideTip(){tip.style.opacity=0}

// ---- index data ----
const byInd={}; Z.forEach(r=>{(byInd[r.i]=byInd[r.i]||[]).push(r)});
Object.values(byInd).forEach(a=>a.sort((x,y)=>y.rev-x.rev));
const inds=Object.keys(byInd).sort((a,b)=>byInd[b].length-byInd[a].length);
const sel=$('#ind'); inds.forEach(i=>{const o=document.createElement('option');o.value=i;o.textContent=`${i} · ${byInd[i].length}곳`;sel.appendChild(o)});
let curInd=inds[0],cur=null,curView='forecast';
const gcls=g=>({'A+':'gA','A':'gA','B':'gB','C':'gC','D':'gD','F':'gF'}[g]);

// ---- 등급 기준 (오른쪽 레퍼런스) ----
(function graderef(){
  const scale=[['A+','상위 5%','gA'],['A','상위 5–15%','gA'],['B','상위 15–35%','gB'],
    ['C','상위 35–60%','gC'],['D','상위 60–80%','gD'],['F','하위 20%','gF']];
  $('#graderef').innerHTML=`<div class="gh">등급 기준</div><div class="gsub">해당 업종 내 월매출 백분위</div>
    <div class="gscale">${scale.map(s=>`<div class="grow"><span class="gr ${s[2]}">${s[0]}</span><span class="gl">${s[1]}</span></div>`).join('')}</div>`;
})();

// ---- KPI ----
(function kpis(){
  const uniqZones=new Set(Z.map(r=>r.z)).size;
  const aplus=C.grade_dist['A+']||0;
  const top=FOOD[0];
  $('#kpis').innerHTML=`
    <div class="kpi"><div class="k">분석 상권 자리</div><div class="v num">${Z.length.toLocaleString()}<small> 건</small></div><div class="d">서울 ${uniqZones.toLocaleString()}개 상권 · ${inds.length}개 업종</div></div>
    <div class="kpi"><div class="k">최상위 A+ 상권</div><div class="v num">${aplus.toLocaleString()}<small> 곳</small></div><div class="d">전체 상위 5% 매출 구간</div></div>
    <div class="kpi warn"><div class="k">오늘의 원가 경보</div><div class="v" style="font-size:19px">${top.item}</div><div class="d">전년比 <b>+${Math.round(top.yoy)}%</b> · ${wonRaw(top.price)}</div></div>
    <div class="kpi"><div class="k">데이터 갱신</div><div class="v" style="font-size:18px">상권 분기 · 식자재 <span style="color:var(--brand)">일</span></div><div class="d">상권=분기별 공표 · 가격=매일 갱신</div></div>`;
})();

// ---- explorer list ----
function renderList(){
  const q=$('#q').value.trim(); let L=byInd[curInd]; if(q)L=L.filter(r=>r.z.includes(q));
  $('#cnt').textContent=L.length+'곳';
  $('#list').innerHTML=L.slice(0,200).map((r,i)=>`<div class="row ${cur===r?'sel':''}" role="option" data-i="${i}"><div class="rk">${i+1}</div>
    <div class="zn">${r.z}<small>상위 ${100-r.p}% · 점포 ${r.stores||'—'}개</small></div><div class="rev">${won(r.rev)}</div><div class="gr ${gcls(r.g)}">${r.g}</div></div>`).join('')
    || '<div class="empty">검색 결과가 없어요</div>';
  $$('#list .row').forEach((el,i)=>el.onclick=()=>{const L2=q?byInd[curInd].filter(r=>r.z.includes(q)):byInd[curInd];cur=L2[i];renderList();detail(cur)});
}
function detail(r){
  if(!r){$('#detail').innerHTML='<div class="empty">왼쪽에서 상권 자리를<br>클릭하면 프로필이 열려요</div>';return}
  const L=byInd[r.i],rank=L.indexOf(r)+1;
  const sp=r.sp==null?null:r.sp;
  let mlHtml='';
  if(sp!=null){
    const col=sp>=60?cssv('--g0'):sp>=35?cssv('--g2'):cssv('--g4');
    const vlabel=sp>=60?'유망':sp>=35?'보통':'주의',vbg=sp>=60?'var(--g0)':sp>=35?'var(--g2)':'var(--g4)';
    const band=r.pr?`${won(Math.round(r.pr*0.7))} ~ ${won(Math.round(r.pr*1.3))}`:'—';
    mlHtml=`<div class="ml">
      <div class="mlh">🤖 상권 예측 모델<span class="b">AI</span>
        <span class="verdict" style="margin-left:auto;color:#fff;background:${vbg}">${vlabel}</span></div>
      <div class="prob"><span class="pv" style="color:${col}">${sp}<small style="font-size:15px">%</small></span>
        <span class="pl">이 업종 서울 상위권 매출일 확률</span></div>
      <div class="track"><div class="fill" style="width:${sp}%;background:${col}"></div></div>
      <div class="mrow"><span>예상 월매출 밴드 <span style="color:var(--faint)">(참고)</span></span><b>${band}</b></div>
      <div class="mnote">경쟁 강도·고객 구성·업종으로 학습 · 공간 홀드아웃(처음 보는 상권 검증) · 성공확률 AUC ${ML.success_auc||'0.80'}. 매출 밴드는 오차가 커 참고용.</div>
    </div>`;
  }
  $('#detail').innerHTML=`<div class="z">${r.z}</div><div class="i"><b>${r.i}</b> · ${rank}위 / ${L.length}곳 · 상위 ${100-r.p}%</div>
    <div class="radar-wrap" id="radar"></div>
    <div class="stats">
      <div class="stat"><div class="l">월매출 (실측)</div><div class="n">${won(r.rev)}</div></div>
      <div class="stat"><div class="l">점포 수</div><div class="n">${r.stores||'—'}</div></div>
      <div class="stat"><div class="l">주말 비중</div><div class="n">${r.we_ratio||0}%</div></div>
      <div class="stat"><div class="l">여성 고객</div><div class="n">${r.fm_ratio||0}%</div></div>
    </div>${mlHtml}`;
  drawRadar(r);
}
sel.onchange=()=>{curInd=sel.value;cur=null;renderList();detail(null);if(curView==='bars')draw()};
$('#q').oninput=renderList;

function drawRadar(r){
  const dims=[['매출',r.p/100],['주말',(r.we_ratio||0)/100],['여성',(r.fm_ratio||0)/100],
    ['점포밀도',Math.min(1,(r.stores||0)/80)],['거래량',Math.min(1,(r.cnt||0)/50000)]];
  const S=196,cx=S/2,cy=S/2+4,R=64,n=dims.length,ax=cssv('--faint'),br=cssv('--brand');
  let g='';for(let ring=1;ring<=3;ring++){let pts='';for(let i=0;i<n;i++){const a=-Math.PI/2+i*2*Math.PI/n;pts+=`${cx+Math.cos(a)*R*ring/3},${cy+Math.sin(a)*R*ring/3} `}g+=`<polygon points="${pts}" fill="none" stroke="${cssv('--grid')}" stroke-width="1"/>`}
  let poly='';dims.forEach((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,rr=R*Math.max(.04,d[1]);poly+=`${cx+Math.cos(a)*rr},${cy+Math.sin(a)*rr} `});
  let dots='',labels='';dims.forEach((d,i)=>{const a=-Math.PI/2+i*2*Math.PI/n,rr=R*Math.max(.04,d[1]);
    dots+=`<circle cx="${cx+Math.cos(a)*rr}" cy="${cy+Math.sin(a)*rr}" r="3" fill="${br}"/>`;
    labels+=`<text x="${cx+Math.cos(a)*(R+14)}" y="${cy+Math.sin(a)*(R+14)}" font-size="10.5" font-weight="600" fill="${ax}" text-anchor="middle" dominant-baseline="middle">${d[0]}</text>`});
  $('#radar').innerHTML=`<svg viewBox="0 0 ${S} ${S+8}" style="width:220px"><g>${g}<polygon points="${poly}" fill="${br}2b" stroke="${br}" stroke-width="2"/>${dots}${labels}</g></svg>`;
}

// ======== chart views ========
function draw(){const p=$('#panel');({forecast:drawForecast,bars:drawBars,food:drawFood,lines:drawLines,sources:drawSources}[curView])(p)}

function drawForecast(p){
  const FC=(ZD.forecast&&ZD.forecast.length)?ZD.forecast:null;
  if(FC){  // 다분기 데이터가 있으면 진짜 forward 예측선을 그린다
    const W=460,H=250,pl=48,pb=28,pt=12,pr=14,cw=W-pl-pr,ch=H-pb-pt;
    const hist=FC.filter(d=>!d.f),fut=FC.filter(d=>d.f),all=FC.map(d=>d.v).concat(FC.filter(d=>d.hi).map(d=>d.hi));
    const mx=Math.max(...all),mn=Math.min(...FC.map(d=>d.lo||d.v)),n=FC.length;
    const X=i=>pl+cw*i/(n-1),Y=v=>pt+ch-(v-mn)/(mx-mn||1)*ch;
    let g='';for(let k=0;k<=4;k++){const yy=pt+ch*k/4;g+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="${cssv('--grid')}"/>`}
    let band='';fut.forEach((d,i)=>{const idx=hist.length-1+i;if(d.lo!=null){band+=`${X(idx)},${Y(d.hi)} `}});
    let bandB='';[...fut].reverse().forEach((d,i)=>{const idx=hist.length-1+(fut.length-1-i);if(d.lo!=null)bandB+=`${X(idx)},${Y(d.lo)} `});
    const hl=hist.map((d,i)=>(i?'L':'M')+X(i)+' '+Y(d.v)).join(' ');
    const fl=[hist[hist.length-1]].concat(fut).map((d,i)=>(i?'L':'M')+X(hist.length-1+i)+' '+Y(d.v)).join(' ');
    p.innerHTML=`<h3>다음 분기 매출 전망 — ${ZD.forecast_zone||'선택 상권'}</h3><p class="cd">실선=실측 · 점선=예측 · 음영=오차범위 · time-split 검증 R² ${ZD.forecast_r2||'0.80'}</p>
      <svg viewBox="0 0 ${W} ${H}">${g}<polygon points="${band}${bandB}" fill="${cssv('--brand')}22"/>
      <path d="${hl}" fill="none" stroke="${cssv('--brand')}" stroke-width="2.4"/>
      <path d="${fl}" fill="none" stroke="${cssv('--brand')}" stroke-width="2.4" stroke-dasharray="5 4"/></svg>`;
    return;
  }
  // 다분기 데이터 없음 → 지어내지 않고, 실제 검증된 예측 성능만 정직하게 보여준다
  const bars=[
    ['아는 상권 · 다음 분기 매출',0.80,'time-split 검증',cssv('--g0'),'가능'],
    ['처음 보는 상권 · 성공확률',(ML.success_auc||0.80),'공간 홀드아웃 AUC',cssv('--g0'),'가능'],
    ['처음 보는 상권 · 정확한 매출액',(ML.rev_r2_spatial||0.52),'공간 홀드아웃 R²',cssv('--g2'),'거침'],
    ['식자재 · 단기 가격',0.0,'관성 못 이김(백테스트)',cssv('--g4'),'무의미'],
  ];
  const W=460,rowH=46,H=bars.length*rowH+6,labX=0,barX=8,barW=W-150;
  let s='';bars.forEach((b,i)=>{const y=i*rowH+8,val=b[1],bw=Math.max(4,val*barW);
    s+=`<text x="${labX}" y="${y+13}" font-size="12" font-weight="600" fill="${cssv('--ink')}">${b[0]}</text>
        <text x="${labX}" y="${y+29}" font-size="10.5" fill="${cssv('--faint')}">${b[2]}</text>
        <rect x="${barX}" y="${y+34}" width="${barW}" height="7" rx="3.5" fill="${cssv('--grid')}"/>
        <rect x="${barX}" y="${y+34}" width="${bw}" height="7" rx="3.5" fill="${b[3]}"/>
        <text x="${W-80}" y="${y+18}" font-size="15" font-weight="800" font-family="monospace" fill="${b[3]}" text-anchor="end">${val>0?val.toFixed(2):'—'}</text>
        <text x="${W-72}" y="${y+18}" font-size="11" font-weight="700" fill="${b[3]}">${b[4]}</text>`});
  p.innerHTML=`<h3>🔮 매출 전망 — 무엇을 예측할 수 있나</h3>
    <p class="cd">전부 <b>실측 검증치</b> · 지어낸 예측선은 넣지 않았습니다</p>
    <svg viewBox="0 0 ${W} ${H}">${s}</svg>
    <div style="margin-top:14px;padding:13px 15px;border:1px solid var(--line);border-radius:11px;background:var(--brand-soft)">
      <div style="font-size:12.5px;font-weight:800;color:var(--brand);margin-bottom:6px">📈 다음 분기 매출 예측선을 켜려면</div>
      <div style="font-size:12px;color:var(--mut);line-height:1.7">
        지금은 <b>1개 분기(20254)</b>만 있어 시간축이 없습니다. 서울 상권분석에서 <b style="color:var(--ink)">여러 분기 CSV</b>(예: 2022~2025, 12개 분기)를 넣으면,
        아는 상권의 다음 분기~내년 매출을 <b style="color:var(--ink)">실선+점선+오차밴드</b> 그래프로 자동 생성합니다.
        상권 매출은 분기마다 완만·추세적으로 변해 <b style="color:var(--ink)">진짜 시계열 예측(R²0.80)</b>이 됩니다 — 식자재 단기예측과 달리 관성이 아닙니다.
      </div>
    </div>`;
}

  const uniqZones=new Set(Z.map(r=>r.z)).size;
  const src=[
    {t:'서울 상권분석 서비스',d:`상권 ${uniqZones.toLocaleString()}곳 · ${Z.length.toLocaleString()}개 업종별 자리 · ${inds.length}개 업종`,

     m:['일별 평균가','전년대비 등락','부류별 대체품'],c:'매일 갱신',org:'한국농수산식품유통공사(aT)',k:'accent'},

    <div style="display:flex;flex-direction:column;gap:12px">

      <div style="font-size:11px;color:var(--faint)">출처 · ${s.org}</div>
    </div>`).join('')}
    </div>
    <div style="border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:var(--card2);margin-top:12px">

      <div style="font-size:12.5px;color:var(--mut);margin-bottom:9px">LightGBM · 경쟁강도·고객구성·업종으로 '처음 보는 상권'의 성공 여부를 예측</div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin-bottom:9px">

function drawBars(p){
  const d=C.ind_avg,max=Math.max(...d.map(x=>x.rev)),br=cssv('--brand');
  const rowH=34,W=460,H=d.length*rowH+8,labW=118,valW=64,barMax=W-labW-valW;
  let s='';d.forEach((x,i)=>{const y=i*rowH+5,bw=Math.max(3,(x.rev/max)*barMax),hot=x.i===curInd;
    s+=`<text x="0" y="${y+17}" font-size="12" fill="${cssv('--mut')}" font-weight="${hot?700:400}">${x.i}</text>
        <rect class="bar" data-i="${x.i}" data-r="${x.rev}" data-n="${x.n}" x="${labW}" y="${y+5}" width="${bw}" height="18" rx="5" fill="${hot?cssv('--accent'):br}" style="cursor:pointer;transition:opacity .12s"/>
        <text x="${labW+bw+8}" y="${y+19}" font-size="11.5" class="num" fill="${cssv('--faint')}">${won(x.rev)}</text>`});
  p.innerHTML=`<h3>업종별 평균 월매출 · 상위 8</h3><p class="cd">구역당 평균 매출 — <b>${curInd}</b>는 강조 표시</p><svg viewBox="0 0 ${W} ${H}">${s}</svg>`;
  p.querySelectorAll('.bar').forEach(el=>{
    el.onmousemove=e=>{el.style.opacity=.8;showTip(e,`${el.dataset.i} · <span class="num">${won(+el.dataset.r)}</span> · ${(+el.dataset.n).toLocaleString()}곳`)};
    el.onmouseleave=()=>{el.style.opacity=1;hideTip()};});
}

function drawFood(p){
  const d=FOOD.slice(0,12),up=cssv('--up'),dn=cssv('--dn'),W=460,rowH=27,H=d.length*rowH+8,mid=W*.42,maxY=Math.max(...d.map(x=>Math.abs(x.yoy)));
  let s=`<line x1="${mid}" y1="0" x2="${mid}" y2="${H-10}" stroke="${cssv('--line')}" stroke-width="1.5"/>`;
  d.forEach((x,i)=>{const y=i*rowH+5,bw=Math.max(3,(Math.abs(x.yoy)/maxY)*(mid-96)),col=x.yoy>=0?up:dn,rev=x.yoy>=0;
    s+=`<text x="0" y="${y+16}" font-size="11.5" fill="${cssv('--mut')}">${x.item}</text>
        <rect class="fb" data-i="${x.item}" data-y="${x.yoy}" data-pr="${x.price}" x="${mid}" y="${y+4}" width="${bw}" height="16" rx="5" fill="${col}" style="cursor:pointer;transition:opacity .12s"/>
        <text x="${mid+bw+7}" y="${y+16}" font-size="11" class="num" font-weight="700" fill="${col}">${rev?'+':''}${Math.round(x.yoy)}%</text>`});
  p.innerHTML=`<h3>식자재 전년대비 가격 변화</h3><p class="cd">공판장 실가격 · <b style="color:${up}">상승=원가 위험</b> · 하락=원가 여유</p>
    <svg viewBox="0 0 ${W} ${H}">${s}</svg>
    <div class="legend"><span><i style="background:${up}"></i>전년比 상승 (원가↑)</span><span><i style="background:${dn}"></i>전년比 하락 (원가↓)</span></div>`;
  p.querySelectorAll('.fb').forEach(el=>{
    el.onmousemove=e=>{el.style.opacity=.8;showTip(e,`${el.dataset.i} · 현재 <span class="num">${wonRaw(+el.dataset.pr)}</span> · 전년比 <span class="num">${+el.dataset.y>=0?'+':''}${Math.round(el.dataset.y)}%</span>`)};
    el.onmouseleave=()=>{el.style.opacity=1;hideTip()};});
}

function drawLines(p){
  const P=C.price_lines,items=Object.keys(P),pal=[cssv('--brand'),cssv('--up'),cssv('--g0'),cssv('--accent')];
  const months=[...new Set([].concat(...items.map(it=>P[it].map(x=>x.m))))].sort();
  const all=[].concat(...items.map(it=>P[it].map(x=>x.v))),mx=Math.max(...all),mn=Math.min(...all);
  const W=460,H=250,pl=48,pb=26,pt=10,pr=10,cw=W-pl-pr,ch=H-pb-pt;
  const X=i=>pl+(months.length<=1?0:cw*i/(months.length-1)),Y=v=>pt+ch-(v-mn)/(mx-mn||1)*ch;
  let g='';for(let k=0;k<=4;k++){const yy=pt+ch*k/4,val=Math.round(mx-(mx-mn)*k/4);
    g+=`<line x1="${pl}" y1="${yy}" x2="${W-pr}" y2="${yy}" stroke="${cssv('--grid')}"/><text x="${pl-7}" y="${yy+3}" font-size="9.5" fill="${cssv('--faint')}" text-anchor="end" class="num">${(val/1000).toFixed(0)}k</text>`}
  let ln='',dots='';items.forEach((it,idx)=>{const pts=P[it].map(x=>[months.indexOf(x.m),x.v,x.m]);let dd='';
    pts.forEach((pp,i)=>{dd+=(i?'L':'M')+X(pp[0]).toFixed(1)+' '+Y(pp[1]).toFixed(1)+' '});
    ln+=`<path d="${dd}" fill="none" stroke="${pal[idx]}" stroke-width="2.2" stroke-linejoin="round"/>`;
    dots+=pts.map(pp=>`<circle class="pt" data-i="${it}" data-v="${pp[1]}" data-m="${pp[2]}" cx="${X(pp[0]).toFixed(1)}" cy="${Y(pp[1]).toFixed(1)}" r="3.4" fill="${pal[idx]}" stroke="${cssv('--card')}" stroke-width="1.5" style="cursor:pointer"/>`).join('')});
  let xl='';months.forEach((m,i)=>{if(i%2===0)xl+=`<text x="${X(i)}" y="${H-8}" font-size="9.5" fill="${cssv('--faint')}" text-anchor="middle" class="num">${m.slice(2)}</text>`});
  p.innerHTML=`<h3>주요 식자재 월별 도매가 추세</h3><p class="cd">공판장 실가격 · 원/단위 · 2024</p>
    <svg viewBox="0 0 ${W} ${H}">${g}${ln}${dots}${xl}</svg>
    <div class="legend">${items.map((it,i)=>`<span><i style="background:${pal[i]}"></i>${it}</span>`).join('')}</div>`;
  p.querySelectorAll('.pt').forEach(el=>{
    el.onmousemove=e=>{el.setAttribute('r',5);showTip(e,`${el.dataset.i} · ${el.dataset.m} · <span class="num">${wonRaw(+el.dataset.v)}</span>`)};
    el.onmouseleave=()=>{el.setAttribute('r',3.4);hideTip()};});
}
