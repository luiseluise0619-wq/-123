services:
  - type: web
    name: mysbizon
    runtime: node
    buildCommand: npm ci --include=dev && npm run check:html && npm run check:data && npm test && npm run build:deploy
    startCommand: node dist/server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: ALLOWED_ORIGIN
        sync: false
      - key: REPORT_EMAIL_ENABLED
        value: "false"
      - key: TRUST_PROXY_HOPS
        value: "0"
